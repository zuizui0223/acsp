name: Public Japan 96-pair environment-nearest overlap diagnostic v1

on:
  pull_request:
    paths:
      - "validation/public_japan_96pair_environment_nearest_overlap_diagnostic_v1.json"
      - "validation/public_japan_96pair_environment_vs_distance_development_v1.json"
      - "research/diagnose_public_japan_96pair_environment_nearest_overlap_v1.py"
      - "research/compare_public_japan_96pair_environment_vs_distance_v1.py"
      - "tests/test_public_japan_96pair_environment_nearest_overlap.py"
      - ".github/workflows/public-japan-96pair-environment-nearest-overlap-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic overlap tests
        run: python tests/test_public_japan_96pair_environment_nearest_overlap.py -v
      - name: Download frozen 96-pair cohort artifact
        uses: actions/download-artifact@v4
        with:
          name: acsp-robust-patch-untouched-confirmation-cohort-v2
          path: frozen-cohort
          github-token: ${{ github.token }}
          repository: zuizui0223/acsp
          run-id: 32335791948
      - name: Verify frozen post-result diagnostic boundary
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          sample = pd.read_csv('frozen-cohort/predeclared_taxon_region_pairs.csv')
          sample = sample[sample['status'].eq('predeclared')]
          diag = json.loads(Path('validation/public_japan_96pair_environment_nearest_overlap_diagnostic_v1.json').read_text())
          parent = json.loads(Path('validation/public_japan_96pair_environment_vs_distance_development_result_v1.json').read_text())
          assert len(sample) == 96 and sample['scientific_name'].nunique() == 96
          assert diag['status'] == 'POST_RESULT_DIAGNOSTIC_FROZEN_BEFORE_OVERLAP_RERUN'
          assert diag['method_replay']['recovery_radius_km'] == 10.0
          assert parent['decision'] == 'DO_NOT_NOMINATE_OR_RETUNE_ON_THESE_96_OPENED_PAIRS'
          PY
      - name: Run exact-method overlap replay
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}
        run: |
          rm -rf /tmp/public-japan-96pair-environment-nearest-overlap-v1
          python research/diagnose_public_japan_96pair_environment_nearest_overlap_v1.py \
            --sample-file frozen-cohort/predeclared_taxon_region_pairs.csv \
            --out-dir /tmp/public-japan-96pair-environment-nearest-overlap-v1
      - name: Guard aggregate-only output
        run: |
          if head -n 1 /tmp/public-japan-96pair-environment-nearest-overlap-v1/*.csv | grep -E '(^|,)(latitude|longitude|decimalLatitude|decimalLongitude|private_exact_site_record_id)(,|$)'; then
            echo 'coordinate/private column leaked into overlap diagnostic'
            exit 1
          fi
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('/tmp/public-japan-96pair-environment-nearest-overlap-v1')
          table = pd.read_csv(root/'pair_overlap_counts.csv')
          summary = json.loads((root/'summary.json').read_text())
          assert len(table) == 96
          assert summary['declared_pairs'] == 96
          assert summary['validated_product_changed'] is False
          assert summary['new_independent_confirmation_claim'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-japan-96pair-environment-nearest-overlap-v1
          path: /tmp/public-japan-96pair-environment-nearest-overlap-v1/
          if-no-files-found: error
          retention-days: 90
