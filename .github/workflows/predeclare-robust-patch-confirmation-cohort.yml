name: Predeclare robust-patch untouched confirmation cohort

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - validation/robust_patch_confirmation_predeclare_trigger.txt
      - .github/workflows/predeclare-robust-patch-confirmation-cohort.yml
      - research/predeclare_robust_patch_confirmation_cohort_v2.py
      - research/test_robust_patch_confirmation_cohort_v2.py
      - validation/acsp_robust_patch_untouched_confirmation_protocol_v2.json

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  predeclare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Verify frozen v2 protocol and network-free sampler tests
        run: python -m unittest -v research/test_robust_patch_confirmation_cohort_v2.py
      - name: Draw taxonomy-safe taxon-region cohort only
        run: |
          python research/predeclare_robust_patch_confirmation_cohort_v2.py \
            --output robust-patch-confirmation-cohort
      - name: Audit no-outcome v2 cohort contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path("robust-patch-confirmation-cohort")
          manifest = json.loads((root / "cohort_manifest.json").read_text())
          declared = pd.read_csv(root / "predeclared_taxon_region_pairs.csv")
          audit = pd.read_csv(root / "sampling_frame_audit.csv")

          assert manifest["status"] == "ready"
          assert manifest["protocol_fingerprint"] == "68f94dbb5ad9cd6ec433653df83df323a7fc489b1ef8ded2422bd8520b0f71e6"
          assert manifest["declared_pairs"] == 96
          assert manifest["unique_declared_taxa"] == 96
          assert manifest["taxon_group_counts"] == {"animal": 48, "plant": 48}
          assert set(manifest["record_count_stratum_counts"].values()) == {24}
          assert set(manifest["region_cell_counts"].values()) == {8}
          assert len(declared) == 96
          assert declared["scientific_name"].nunique() == 96
          assert len(audit) == 96
          assert not declared["scientific_name"].astype(str).str.startswith("Campanula microdonta").any()
          assert not declared["scientific_name"].astype(str).str.startswith("Campanula punctata").any()
          assert manifest["outcomes_inspected"] is False
          assert manifest["occurrence_rows_fetched_for_declared_taxa"] is False
          assert manifest["candidate_generation_run"] is False
          assert manifest["robust_support_run"] is False
          assert manifest["heldout_recovery_run"] is False
          assert manifest["taxon_replacement_after_declaration_allowed"] is False
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-robust-patch-untouched-confirmation-cohort-v2
          path: robust-patch-confirmation-cohort
          if-no-files-found: error
          retention-days: 90
