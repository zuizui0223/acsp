name: Japan plant broad-frame historical preflight v4

on:
  workflow_dispatch:

concurrency:
  group: japan-plant-broad-frame-historical-preflight-v4-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Test historical-only v4 qualification mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}
        run: python tests/test_japan_plant_broad_frame_preflight_v4.py -v

      - name: Download exact frozen v4 identity artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: zuizui0223/acsp
          run-id: 34565100325
          name: japan-plant-broad-frame-identity-candidates-v4
          path: /tmp/japan-plant-broad-v4-stage1

      - name: Verify exact stage1 receipt before focal historical queries
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd

          receipt = json.load(open('validation/japan_plant_broad_frame_identity_receipt_v4.json'))
          assert receipt['status'] == 'IDENTITY_CANDIDATES_PINNED_PRE_FOCAL_HISTORICAL_QUERY'
          assert receipt['source_workflow_run_id'] == 34565100325
          assert receipt['source_artifact_id'] == 10186066547
          assert receipt['source_artifact_digest'] == 'sha256:0d2b061f8d9c8254c3fae1463501c2d4c1b32844828deda498b6eac12a0a654b'
          c = Path('/tmp/japan-plant-broad-v4-stage1/identity_candidates.csv')
          a = Path('/tmp/japan-plant-broad-v4-stage1/audit.json')
          assert hashlib.sha256(c.read_bytes()).hexdigest() == receipt['identity_candidates_sha256']
          assert hashlib.sha256(a.read_bytes()).hexdigest() == receipt['identity_audit_sha256']
          audit = json.loads(a.read_text())
          frame = pd.read_csv(c)
          assert len(frame) == 96 and frame['speciesKey'].nunique() == 96 and frame['scientific_name'].nunique() == 96
          assert audit['candidate_count'] == 96
          assert audit['candidate_identity_sha256'] == receipt['candidate_identity_sha256']
          assert audit['protocol_sha256'] == receipt['protocol_sha256']
          assert audit['focal_2000_2020_occurrences_opened'] is False
          assert audit['heldout_2021_2025_opened'] is False
          assert receipt['no_reselection_after_pin'] is True
          PY

      - name: Open only 2000-2020 evidence and freeze final 24 candidate universes
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}
        run: |
          rm -rf /tmp/japan-plant-broad-v4-preflight
          mkdir -p /tmp/japan-plant-broad-v4-preflight
          python research/prepare_japan_plant_broad_frame_preflight_v4.py \
            --candidates /tmp/japan-plant-broad-v4-stage1/identity_candidates.csv \
            --stage1-audit /tmp/japan-plant-broad-v4-stage1/audit.json \
            --output /tmp/japan-plant-broad-v4-preflight/preflight.json

      - name: Verify pre-heldout boundary
        run: |
          python - <<'PY'
          import json
          x = json.load(open('/tmp/japan-plant-broad-v4-preflight/preflight.json'))
          assert x['status'] in {
              'PREOUTCOME_24_TAXA_AND_CANDIDATE_UNIVERSES_FROZEN',
              'STOP_PREOUTCOME_INSUFFICIENT_HISTORICAL_QUALIFIERS',
          }
          assert x['candidate_identity_count'] == 96
          assert x['heldout_2021_2025_opened'] is False
          assert x['selector_evaluated'] is False
          assert x['validated_japan_product_changed'] is False
          assert x['automatic_global_adapter_changed'] is False
          if x['status'] == 'PREOUTCOME_24_TAXA_AND_CANDIDATE_UNIVERSES_FROZEN':
              assert x['final_taxa'] == 24 and len(x['selected_taxa']) == 24
              assert len({int(r['speciesKey']) for r in x['selected_taxa']}) == 24
              assert all(int(r['historical_population_count']) >= 5 for r in x['selected_taxa'])
              required = {'BROAD_LAND', 'LOCAL_2KM_LAND', 'LOCAL_5KM_LAND', 'LOCAL_10KM_LAND'}
              assert all(required == set(r['candidate_universes']) for r in x['selected_taxa'])
          else:
              assert int(x['historically_qualified_identities']) < 24
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: japan-plant-broad-frame-historical-preflight-v4
          path: /tmp/japan-plant-broad-v4-preflight/
          if-no-files-found: error
          retention-days: 90
