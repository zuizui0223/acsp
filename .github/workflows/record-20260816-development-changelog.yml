name: Record 2026-08-16 ACSP development changelog

on:
  push:
    branches:
      - agent/microenvironment-generalization-development
    paths:
      - .github/workflows/record-20260816-development-changelog.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/microenvironment-generalization-development
          fetch-depth: 0
      - name: Prepend consolidated development entry
        env:
          ENTRY_B64: 
      - name: Prepend entry
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('CHANGELOG_AI.md')
          text=p.read_text(encoding='utf-8')
          marker='## 2026-08-16 - ChatGPT (OpenAI) - Adaptive survey architecture convergence'
          if marker not in text:
              entry=base64.b64decode(os.environ['ENTRY_B64']).decode('utf-8')
              prefix='# AI Change Log\n\n'
              text=(prefix+entry+text[len(prefix):]) if text.startswith(prefix) else (entry+text)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit entry
        run: |
          if git diff --quiet -- CHANGELOG_AI.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG_AI.md
          git commit -m 'Document adaptive survey development line'
          git push origin HEAD:agent/microenvironment-generalization-development
