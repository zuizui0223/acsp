name: Practical Rescue wiring QA

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - .github/workflows/ai-practical-rescue-wiring-qa.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/practical-coverage-v3-development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install exact rescue runtime and package
        run: |
          python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0" joblib
          python -m pip install -e .
      - name: Run wiring regression tests
        run: |
          python -m unittest -v \
            test_practical_rescue_grts_development.py \
            test_practical_rescue_fresh_confirmation.py \
            test_practical_rescue_fresh_protocol.py \
            test_practical_rescue_fresh_exclusions.py
      - name: Compile operational entry point and rescue scripts
        run: |
          python -m py_compile \
            gbif_fieldmap_builder_app.py \
            aggregate_practical_rescue_grts_development.py \
            aggregate_practical_rescue_fresh_confirmation.py \
            predeclare_practical_rescue_fresh_confirmation_cohort.py \
            freeze_practical_rescue_fresh_confirmation_protocol.py \
            run_practical_rescue_fresh_confirmation_pair.py \
            fit_practical_rescue_final_model.py
      - name: Remove one-shot QA workflow after success
        run: |
          git rm .github/workflows/ai-practical-rescue-wiring-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove completed Practical Rescue wiring QA helper"
          git push origin HEAD:agent/practical-coverage-v3-development
