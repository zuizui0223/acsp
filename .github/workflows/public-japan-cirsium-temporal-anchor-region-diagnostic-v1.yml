name: Public Japan Cirsium temporal anchor regional diagnostic v1

on:
  pull_request:
    paths:
      - "research/diagnose_public_japan_cirsium_temporal_anchor_by_region_v1.py"
      - "tests/test_public_japan_cirsium_temporal_anchor_region_diagnostic.py"
      - "validation/public_japan_cirsium_temporal_anchor_region_diagnostic_v1.json"
      - "validation/public_japan_cirsium_temporal_anchor_benchmark_result_v1.json"
      - "validation/cirsium_aza3_prospective_validation_cohort_v1.csv"
      - ".github/workflows/public-japan-cirsium-temporal-anchor-region-diagnostic-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic unit tests
        run: python tests/test_public_japan_cirsium_temporal_anchor_region_diagnostic.py -v
      - name: Run frozen regional diagnostic
        run: |
          rm -rf /tmp/public-japan-cirsium-temporal-anchor-region-v1
          PYTHONPATH=${{ github.workspace }}/research:${{ github.workspace }} \
            python research/diagnose_public_japan_cirsium_temporal_anchor_by_region_v1.py \
            --out-dir /tmp/public-japan-cirsium-temporal-anchor-region-v1
      - name: Guard public output against exact coordinate columns
        run: |
          if head -n 1 /tmp/public-japan-cirsium-temporal-anchor-region-v1/*.csv | grep -E '(^|,)(latitude|longitude|private_exact_site_record_id)(,|$)'; then
            echo 'exact coordinate/private column leaked into public regional diagnostic'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-japan-cirsium-temporal-anchor-region-diagnostic-v1
          path: /tmp/public-japan-cirsium-temporal-anchor-region-v1/
          if-no-files-found: error
