name: Campanula set-level development

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: campanula-set-level-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  structure-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ACSP and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install rasterio pyproj scipy awscli

      - name: Download frozen Campanula development cache and GSI DEM artifacts
        uses: actions/download-artifact@v4
        with:
          name: campanula-development-data
          path: campanula-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31856717236

      - name: Download pinned ESA WorldCover NDVI composite
        run: |
          set -euo pipefail
          mkdir -p public-layers
          NDVI_KEY="ndvi/2021/N34/ESA_WorldCover_10m_2021_v200_N34E139_NDVI.tif"
          aws s3 cp "s3://esa-worldcover-s2/$NDVI_KEY" public-layers/ndvi.tif --no-sign-request
          sha256sum public-layers/ndvi.tif | tee public-layers/ndvi_sha256.txt
          grep -q '^641c99d0bae8ddb38f31c079b16597956e9c981ca42c20d9e13e5b8551133638 ' public-layers/ndvi_sha256.txt

      - name: Rebuild outcome-blind full-island universe
        run: |
          python research/campanula_microterrain_discovery.py \
            --gbif campanula-source/field_validation/campanula_microdonta/development_data/gbif_training_occurrences_through_2025.csv \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --dem oshima=campanula-source/dem-artifacts/gsi_02d7024d473d0b2d.tif \
            --dem toshima=campanula-source/dem-artifacts/gsi_4867a2c26d122c44.tif \
            --dem niijima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem shikinejima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem kozushima=campanula-source/dem-artifacts/gsi_4ea5609c14c17bd8.tif \
            --out microterrain-results

      - name: Diagnose late recovery witness patches
        run: |
          python research/campanula_spatial_policy_structure_diagnostic.py \
            --microterrain-universe microterrain-results/microterrain_universe.csv \
            --gbif-prototypes microterrain-results/gbif_microterrain_prototypes.csv \
            --ndvi public-layers/ndvi.tif \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --out campanula-structure-diagnostic
          cat campanula-structure-diagnostic/structure_diagnostic_report.json

      - name: Verify diagnostic guardrails
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('campanula-structure-diagnostic/structure_diagnostic_report.json').read_text())
          assert report['status']=='development_only_structure_diagnostic'
          assert report['field_coordinates_used_to_build_patch_features'] is False
          assert report['field_coordinates_used_to_build_canonical_order'] is False
          assert report['canonical_policy']['top32_fixed_reference'] is True
          assert report['latest_first_recovery_rank'] <= 32
          print(json.dumps({
              'latest_first_recovery_rank': report['latest_first_recovery_rank'],
              'detections_recovered_by_rank20': report['detections_recovered_by_rank20'],
              'detections_recovered_rank21_to_32': report['detections_recovered_rank21_to_32'],
              'late_detection_ids': report['late_detection_ids'],
              'top_feature_contrasts': report['top_feature_contrasts'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: campanula-structure-diagnostic
          path: |
            public-layers/ndvi_sha256.txt
            microterrain-results/microterrain_report.json
            campanula-structure-diagnostic/
          if-no-files-found: error
          retention-days: 90
