name: Campanula inverse development

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: campanula-inverse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  inverse-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ACSP and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install rasterio pyproj scipy awscli

      - name: Download frozen Campanula development cache and GSI DEM artifacts
        uses: actions/download-artifact@v4
        with:
          name: campanula-development-data
          path: campanula-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31856717236

      - name: Download pinned ESA WorldCover NDVI composite
        run: |
          set -euo pipefail
          mkdir -p public-layers
          NDVI_KEY="ndvi/2021/N34/ESA_WorldCover_10m_2021_v200_N34E139_NDVI.tif"
          aws s3 cp "s3://esa-worldcover-s2/$NDVI_KEY" public-layers/ndvi.tif --no-sign-request
          sha256sum public-layers/ndvi.tif | tee public-layers/ndvi_sha256.txt
          grep -q '^641c99d0bae8ddb38f31c079b16597956e9c981ca42c20d9e13e5b8551133638 ' public-layers/ndvi_sha256.txt

      - name: Rebuild outcome-blind full-island universe
        run: |
          python research/campanula_microterrain_discovery.py \
            --gbif campanula-source/field_validation/campanula_microdonta/development_data/gbif_training_occurrences_through_2025.csv \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --dem oshima=campanula-source/dem-artifacts/gsi_02d7024d473d0b2d.tif \
            --dem toshima=campanula-source/dem-artifacts/gsi_4867a2c26d122c44.tif \
            --dem niijima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem shikinejima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem kozushima=campanula-source/dem-artifacts/gsi_4ea5609c14c17bd8.tif \
            --out microterrain-results

      - name: Learn Campanula inverse patch utility
        run: |
          python research/campanula_inverse_patch_learning.py \
            --microterrain-universe microterrain-results/microterrain_universe.csv \
            --gbif-prototypes microterrain-results/gbif_microterrain_prototypes.csv \
            --ndvi public-layers/ndvi.tif \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --out campanula-inverse-development
          cat campanula-inverse-development/inverse_patch_learning_report.json

      - name: Test component-wise environmental stopping
        run: |
          python research/campanula_component_knee_policy.py \
            --microterrain-universe microterrain-results/microterrain_universe.csv \
            --gbif-prototypes microterrain-results/gbif_microterrain_prototypes.csv \
            --ndvi public-layers/ndvi.tif \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --out campanula-component-knee
          cat campanula-component-knee/component_knee_report.json

      - name: Test support-envelope set coverage
        run: |
          python research/campanula_support_envelope_set_policy.py \
            --microterrain-universe microterrain-results/microterrain_universe.csv \
            --gbif-prototypes microterrain-results/gbif_microterrain_prototypes.csv \
            --ndvi public-layers/ndvi.tif \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --out campanula-support-envelope
          cat campanula-support-envelope/support_envelope_report.json

      - name: Verify development guardrails
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inverse=json.loads(Path('campanula-inverse-development/inverse_patch_learning_report.json').read_text())
          knee=json.loads(Path('campanula-component-knee/component_knee_report.json').read_text())
          envelope=json.loads(Path('campanula-support-envelope/support_envelope_report.json').read_text())
          assert inverse['status']=='development_only_inverse_patch_learning'
          assert inverse['field_coordinates_used_to_construct_features'] is False
          assert inverse['field_outcomes_used_to_define_oracle_labels'] is True
          assert inverse['oracle_label_definition']=='membership in any minimum-size patch cover'
          assert inverse['oracle_minimum_patch_count'] <= 12
          assert inverse['patch_count'] >= inverse['oracle_compatible_patch_count'] >= inverse['oracle_minimum_patch_count']
          assert inverse['oracle_necessary_patch_count'] <= inverse['oracle_minimum_patch_count']
          assert knee['status']=='development_only_component_environmental_knee'
          assert knee['field_coordinates_used_to_select_patches'] is False
          assert envelope['status']=='development_only_support_envelope_set_policy'
          assert envelope['field_coordinates_used_to_build_envelope'] is False
          assert envelope['field_coordinates_used_to_order_patches'] is False
          assert envelope['field_coordinates_used_to_choose_stopping_point'] is False
          assert envelope['support_envelope_components'] == 5
          print(json.dumps({
              'oracle_minimum_patch_count': inverse['oracle_minimum_patch_count'],
              'oracle_compatible_patch_count': inverse['oracle_compatible_patch_count'],
              'inverse_crossfit_patches': inverse['crossfit_result']['n_patches'],
              'inverse_fullfit_patches': inverse['full_fit_result']['n_patches'],
              'component_knee_selected_patches': knee['selected_patches'],
              'component_knee_field_recovery': knee['field_development_result']['recovered'],
              'component_knee_field_total': knee['field_development_result']['total'],
              'support_envelope_selected_patches': envelope['selected_patches'],
              'support_envelope_mass': envelope['selected_envelope_mass'],
              'support_envelope_field_recovery': envelope['field_development_result']['recovered'],
              'support_envelope_first_complete_prefix': envelope['first_complete_recovery_prefix'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: campanula-inverse-development
          path: |
            public-layers/ndvi_sha256.txt
            microterrain-results/microterrain_report.json
            campanula-inverse-development/
            campanula-component-knee/
            campanula-support-envelope/
          if-no-files-found: error
          retention-days: 90
