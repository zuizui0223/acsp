name: Campanula robust support export

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: campanula-robust-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  robust-support-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install rasterio pyproj scipy awscli
          python - <<'PY'
          import numpy, pandas, scipy, rasterio, sys
          print('python', sys.version)
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('scipy', scipy.__version__)
          print('rasterio', rasterio.__version__)
          PY

      - name: Download frozen Campanula development cache and GSI DEM artifacts
        uses: actions/download-artifact@v4
        with:
          name: campanula-development-data
          path: campanula-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31856717236

      - name: Download pinned ESA WorldCover NDVI composite
        run: |
          set -euo pipefail
          mkdir -p public-layers
          NDVI_KEY="ndvi/2021/N34/ESA_WorldCover_10m_2021_v200_N34E139_NDVI.tif"
          aws s3 cp "s3://esa-worldcover-s2/$NDVI_KEY" public-layers/ndvi.tif --no-sign-request
          sha256sum public-layers/ndvi.tif | tee public-layers/ndvi_sha256.txt
          grep -q '^641c99d0bae8ddb38f31c079b16597956e9c981ca42c20d9e13e5b8551133638 ' public-layers/ndvi_sha256.txt

      - name: Rebuild outcome-blind full-island universe
        run: |
          python research/campanula_microterrain_discovery.py \
            --gbif campanula-source/field_validation/campanula_microdonta/development_data/gbif_training_occurrences_through_2025.csv \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --dem oshima=campanula-source/dem-artifacts/gsi_02d7024d473d0b2d.tif \
            --dem toshima=campanula-source/dem-artifacts/gsi_4867a2c26d122c44.tif \
            --dem niijima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem shikinejima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem kozushima=campanula-source/dem-artifacts/gsi_4ea5609c14c17bd8.tif \
            --out microterrain-results

      - name: Reproduce frozen robust support through generic core
        run: |
          python research/campanula_robust_support_patch_export.py \
            --microterrain-universe microterrain-results/microterrain_universe.csv \
            --gbif-prototypes microterrain-results/gbif_microterrain_prototypes.csv \
            --ndvi public-layers/ndvi.tif \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --out campanula-robust-support
          cat campanula-robust-support/robust_support_patch_report.json

      - name: Verify generic-core freeze regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('campanula-robust-support/robust_support_patch_report.json').read_text())
          assert report['status']=='frozen_robust_support_patch_export'
          assert report['generic_core']=='acsp.robust_patches.leave_one_out_consensus_support'
          assert report['field_coordinates_used_to_build_consensus_support'] is False
          assert report['field_coordinates_used_to_choose_threshold'] is False
          assert report['field_coordinates_used_to_define_patches'] is False
          assert report['freeze_reproduction']['pass'] is True
          assert report['selected_cells'] == report['expected_frozen_cells'] == 2367
          assert report['field_development_verification']['recovered'] == 19
          assert report['candidate_output_contract']['output_stops_at_candidate_patches'] is True
          assert report['candidate_output_contract']['route_or_effort_optimization'] is False
          print(json.dumps({
              'selected_cells': report['selected_cells'],
              'patch_count': report['patch_count'],
              'island_patch_counts': report['island_patch_counts'],
              'field_verification': report['field_development_verification'],
              'generic_core': report['generic_core'],
          }, indent=2))
          PY

      - name: Smoke-test movement-only downstream selector on frozen patches
        run: |
          set -euo pipefail
          # 5 km is a deterministic CI fixture only. It is not a production
          # default, a field-efficiency estimate, or a tuned scientific value.
          acsp-operate \
            --patches campanula-robust-support/robust_support_patches.csv \
            --max-transition-km 5 \
            --output campanula-robust-support/operational_visits_fixture_5km.csv \
            --summary-json campanula-robust-support/operational_summary_fixture_5km.json

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('campanula-robust-support')
          patches = pd.read_csv(root / 'robust_support_patches.csv')
          visits = pd.read_csv(root / 'operational_visits_fixture_5km.csv')
          report = json.loads((root / 'robust_support_patch_report.json').read_text())
          summary = json.loads((root / 'operational_summary_fixture_5km.json').read_text())

          assert len(patches) == report['patch_count']
          assert 0 < len(visits) <= len(patches)
          assert summary['automatic_selected_count'] == len(visits)
          assert summary['candidate_patch_count'] == len(patches)
          assert summary['movement_constraint_only'] is True
          assert summary['user_site_count_required'] is False
          assert summary['user_coverage_target_required'] is False
          assert summary['survey_days_input'] is False
          assert summary['monetary_budget_input'] is False
          assert summary['route_feasibility_claim'] is False
          assert summary['field_efficiency_claim'] is False
          assert summary['validated_candidate_generation_changed'] is False
          assert summary['audit']['max_transition_km'] == 5.0
          assert 'survey_area_id' in visits.columns
          assert set(visits['zone_id'].astype(str)).issubset(set(patches['zone_id'].astype(str)))

          # The frozen Campanula adapter still carries historical ranking fields.
          # Remove them and require identical downstream selection, proving that
          # the new operational selector does not consume the legacy ranking.
          rank_free = patches.drop(columns=['zone_score', 'zone_rank'], errors='ignore')
          rank_free.to_csv(root / 'robust_support_patches_rank_free.csv', index=False)
          PY

          acsp-operate \
            --patches campanula-robust-support/robust_support_patches_rank_free.csv \
            --max-transition-km 5 \
            --output campanula-robust-support/operational_visits_rank_free_fixture_5km.csv \
            --summary-json campanula-robust-support/operational_summary_rank_free_fixture_5km.json

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('campanula-robust-support')
          original = pd.read_csv(root / 'operational_visits_fixture_5km.csv')
          rank_free = pd.read_csv(root / 'operational_visits_rank_free_fixture_5km.csv')
          rank_free_summary = json.loads(
              (root / 'operational_summary_rank_free_fixture_5km.json').read_text()
          )
          assert original['zone_id'].astype(str).tolist() == rank_free['zone_id'].astype(str).tolist()
          assert original['survey_area_id'].astype(str).tolist() == rank_free['survey_area_id'].astype(str).tolist()
          assert rank_free_summary['automatic_selected_count'] == len(rank_free)
          assert rank_free_summary['route_feasibility_claim'] is False
          assert rank_free_summary['field_efficiency_claim'] is False
          print(json.dumps({
              'fixture_transition_km': 5.0,
              'input_patch_count': int(rank_free_summary['candidate_patch_count']),
              'automatic_selected_count': int(rank_free_summary['automatic_selected_count']),
              'movement_components': int(rank_free_summary['audit']['movement_component_count']),
              'legacy_rank_invariant': True,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campanula-robust-support-patches
          path: |
            public-layers/ndvi_sha256.txt
            microterrain-results/microterrain_report.json
            campanula-robust-support/
          if-no-files-found: warn
          retention-days: 90
