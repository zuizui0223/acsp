name: Predeclare robust-support island cohort

on:
  workflow_dispatch:
  push:
    branches:
      - agent/campanula-discovery-development
    paths:
      - research/predeclare_robust_support_island_cohort.py
      - research/predeclare_robust_support_island_cohort_v11.py
      - validation/robust_support_island_random_validation_protocol.json
      - .github/workflows/predeclare-robust-support-island-cohort.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  predeclare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .

      - name: Audit all island frames and draw only if every frame is sufficient
        run: |
          python research/predeclare_robust_support_island_cohort_v11.py \
            --protocol validation/robust_support_island_random_validation_protocol.json \
            --output robust-support-island-cohort

      - name: Audit no-outcome boundary
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('robust-support-island-cohort')
          manifest = json.loads((root / 'cohort_manifest.json').read_text())
          audit = pd.read_csv(root / 'sampling_frame_audit.csv')
          assert manifest['protocol_fingerprint'] == 'e62e0e65e490ee6f04ce50dc3009407cb9ed1875fd610f153592104934b77acd'
          assert manifest['occurrence_coordinates_fetched'] is False
          assert manifest['outcomes_inspected'] is False if 'outcomes_inspected' in manifest else manifest['heldout_recovery_inspected'] is False
          if manifest['status'] == 'ready_frozen_before_occurrence_retrieval':
              cohort = pd.read_csv(root / 'predeclared_taxon_island_pairs.csv')
              assert len(cohort) == 24
              assert cohort['scientific_name'].nunique() == 24
              assert cohort['island_id'].nunique() == 12
              assert set(cohort['island_id'].value_counts()) == {2}
              assert set(cohort['record_count_stratum'].value_counts()) == {12}
              assert manifest['taxon_replacement_after_declaration_allowed'] is False
          print(json.dumps(manifest, indent=2))
          print(audit.to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: robust-support-island-cohort-v11
          path: robust-support-island-cohort
          if-no-files-found: error
          retention-days: 90
