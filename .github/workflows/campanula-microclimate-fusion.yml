name: Campanula microclimate fusion

on:
  workflow_dispatch:
  push:
    branches:
      - agent/campanula-discovery-development
    paths:
      - research/campanula_microclimate_fusion.py
      - research/campanula_microclimate_fusion_runner.py
      - .github/workflows/campanula-microclimate-fusion.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  microclimate-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP and geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install rasterio pyproj scipy awscli

      - name: Download frozen Campanula development cache and GSI DEM artifacts
        uses: actions/download-artifact@v4
        with:
          name: campanula-development-data
          path: campanula-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31856717236

      - name: Download pinned ESA public layers
        run: |
          set -euo pipefail
          mkdir -p public-layers
          NDVI_KEY="ndvi/2021/N34/ESA_WorldCover_10m_2021_v200_N34E139_NDVI.tif"
          aws s3 cp "s3://esa-worldcover-s2/$NDVI_KEY" public-layers/ndvi.tif --no-sign-request
          echo "$NDVI_KEY" > public-layers/ndvi_s3_key.txt
          sha256sum public-layers/ndvi.tif | tee public-layers/ndvi_sha256.txt
          grep -q '^641c99d0bae8ddb38f31c079b16597956e9c981ca42c20d9e13e5b8551133638 ' public-layers/ndvi_sha256.txt
          curl --fail --location --retry 4 --retry-delay 3 \
            --output public-layers/worldcover.tif \
            https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N33E138_Map.tif
          sha256sum public-layers/worldcover.tif | tee public-layers/worldcover_sha256.txt

      - name: Rebuild outcome-blind full-island universe
        run: |
          python research/campanula_microterrain_discovery.py \
            --gbif campanula-source/field_validation/campanula_microdonta/development_data/gbif_training_occurrences_through_2025.csv \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --dem oshima=campanula-source/dem-artifacts/gsi_02d7024d473d0b2d.tif \
            --dem toshima=campanula-source/dem-artifacts/gsi_4867a2c26d122c44.tif \
            --dem niijima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem shikinejima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem kozushima=campanula-source/dem-artifacts/gsi_4ea5609c14c17bd8.tif \
            --out microterrain-results

      - name: Run physical microclimate fusion
        run: |
          python research/campanula_microclimate_fusion_runner.py \
            --microterrain-universe microterrain-results/microterrain_universe.csv \
            --gbif-prototypes microterrain-results/gbif_microterrain_prototypes.csv \
            --ndvi public-layers/ndvi.tif \
            --worldcover public-layers/worldcover.tif \
            --dem oshima=campanula-source/dem-artifacts/gsi_02d7024d473d0b2d.tif \
            --dem toshima=campanula-source/dem-artifacts/gsi_4867a2c26d122c44.tif \
            --dem niijima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem shikinejima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem kozushima=campanula-source/dem-artifacts/gsi_4ea5609c14c17bd8.tif \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --random-iterations 5000 \
            --seed 20260815 \
            --out microclimate-results

      - name: Audit development boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('microclimate-results/microclimate_report.json').read_text())
          assert r['status'] == 'development_only'
          assert r['field_coordinates_used_by_generator'] is False
          assert r['best_count_only_1km']['recovered'] == 19
          assert r['best_count_only_500m']['recovered'] == 19
          print(json.dumps({
              'best_promoted_1km': r['best_promoted_1km'],
              'best_1km': r['best_count_only_1km'],
              'best_500m': r['best_count_only_500m'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: campanula-microclimate-fusion
          path: |
            public-layers/ndvi_s3_key.txt
            public-layers/ndvi_sha256.txt
            public-layers/worldcover_sha256.txt
            microterrain-results/microterrain_report.json
            microclimate-results/microclimate_report.json
            microclimate-results/microclimate_frontier_1km.csv
            microclimate-results/microclimate_frontier_500m.csv
            microclimate-results/best_microclimate_candidates.csv
          if-no-files-found: error
          retention-days: 90
