name: Geographic framing development v2 replay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research
  AUTHORITATIVE_RUN_ID: "32613456408"
  AUTHORITATIVE_ARTIFACT_DIGEST: "sha256:76a3eafaeeb3a42fcc7d0f525db9d01f7ec5809b6fc26313ccafece5ec7de03e"

jobs:
  replay-development:
    name: Manual replay of rejected v2 representation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP
        run: python -m pip install -e .

      - name: Verify frozen v2 contract
        run: |
          python -m unittest -v \
            research/test_geographic_framing.py \
            research/test_geographic_framing_higher_taxon_v2.py \
            research/test_geographic_framing_v2_evaluator.py
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path('validation/geographic_framing_development_v2/framing_v2_diagnostic_summary.json').read_text(encoding='utf-8')
          )
          assert summary['authoritative_workflow_run'] == 32613456408
          assert summary['authoritative_artifact_digest'] == 'sha256:76a3eafaeeb3a42fcc7d0f525db9d01f7ec5809b6fc26313ccafece5ec7de03e'
          assert summary['promotion_gate_passed'] is False
          assert summary['retuning_on_same_96_taxa_allowed'] is False
          PY

      - name: Download development identities
        uses: actions/download-artifact@v4
        with:
          name: acsp-robust-patch-untouched-confirmation-cohort-v2
          path: frozen-cohort
          github-token: ${{ github.token }}
          repository: zuizui0223/acsp
          run-id: 32335791948

      - name: Re-export focal folds
        run: |
          python research/export_robust_patch_confirmation_folds_v2.py \
            --sample-file frozen-cohort/predeclared_taxon_region_pairs.csv \
            --output framing-development-v2-folds

      - name: Replay rejected higher-taxon representation
        run: |
          python research/evaluate_geographic_framing_development_v2.py \
            --export-root framing-development-v2-folds \
            --output framing-development-v2-results

      - name: Compare replay with authoritative first run without changing the decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          authoritative = json.loads(
              Path('validation/geographic_framing_development_v2/framing_v2_diagnostic_summary.json').read_text(encoding='utf-8')
          )
          replay = json.loads(
              Path('framing-development-v2-results/framing_v2_diagnostic_summary.json').read_text(encoding='utf-8')
          )
          print('authoritative containment:', authoritative['mean_fold_heldout_frame_containment'])
          print('replay containment:', replay['mean_fold_heldout_frame_containment'])
          print('authoritative decision remains:', authoritative['decision'])
          print('Replay is reproducibility diagnostics only; live-provider drift cannot revise the frozen decision.')
          PY

      - name: Upload replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsp-geographic-framing-development-v2-replay
          path: framing-development-v2-results/
          if-no-files-found: error
          retention-days: 30
