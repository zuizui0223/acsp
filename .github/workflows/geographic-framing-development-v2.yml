name: Geographic framing development v2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "research/geographic_framing_higher_taxon_v2.py"
      - "research/evaluate_geographic_framing_development_v2.py"
      - "research/test_geographic_framing_higher_taxon_v2.py"
      - "research/test_geographic_framing_v2_evaluator.py"
      - "validation/acsp_geographic_framing_development_protocol_v2.json"
      - ".github/workflows/geographic-framing-development-v2.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  higher-taxon-framing-development:
    name: 96-pair nonfocal higher-taxon framing diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP
        run: python -m pip install -e .

      - name: Verify frozen v2 contract before opening results
        run: |
          python -m unittest -v \
            research/test_geographic_framing.py \
            research/test_geographic_framing_higher_taxon_v2.py \
            research/test_geographic_framing_v2_evaluator.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('validation/acsp_geographic_framing_development_protocol_v2.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          stored = payload.pop('protocol_fingerprint')
          calculated = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          expected = '5f77d4e0d33fec794ce85c666a6bfafbe029f0ed001ab2644eb2e64eceb35f5f'
          assert stored == calculated == expected
          assert payload['prior_fetch']['preferred_rank'] == 'GENUS'
          assert payload['prior_fetch']['fallback_rank'] == 'FAMILY'
          assert payload['prior_fetch']['fallback_condition'] == 'zero usable non-focal genus records only'
          assert payload['prior_fetch']['heldout_focal_records_used'] is False
          assert payload['prior_fetch']['focal_training_records_used_for_prior'] is False
          assert payload['frame_geometry']['block_degrees'] == 0.1
          assert payload['frame_geometry']['padding_km'] == 10.0
          assert payload['development_gate']['mean_heldout_frame_containment_min'] == 0.95
          assert payload['development_gate']['animal_mean_heldout_frame_containment_min'] == 0.9
          assert payload['development_gate']['median_frame_area_ratio_to_fixed_max'] == 0.85
          assert payload['preserved_core']['validated_japan_adapter_changed'] is False
          PY

      - name: Download already-opened robust-patch v2 development identities
        uses: actions/download-artifact@v4
        with:
          name: acsp-robust-patch-untouched-confirmation-cohort-v2
          path: frozen-cohort
          github-token: ${{ github.token }}
          repository: zuizui0223/acsp
          run-id: 32335791948

      - name: Audit permanently nonconfirmatory development boundary
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          sample = pd.read_csv(Path('frozen-cohort')/'predeclared_taxon_region_pairs.csv')
          assert len(sample) == 96
          assert sample['scientific_name'].nunique() == 96
          assert not sample['scientific_name'].astype(str).str.startswith(
              ('Campanula microdonta', 'Campanula punctata')
          ).any()
          print('The same 96 already-opened taxa remain development-only for framing v2.')
          PY

      - name: Re-export focal folds with unchanged v2 split rule
        run: |
          python research/export_robust_patch_confirmation_folds_v2.py \
            --sample-file frozen-cohort/predeclared_taxon_region_pairs.csv \
            --output framing-development-v2-folds

      - name: Evaluate nonfocal higher-taxon broad prior
        run: |
          python research/evaluate_geographic_framing_development_v2.py \
            --export-root framing-development-v2-folds \
            --output framing-development-v2-results

      - name: Audit complete denominator and claim boundary
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path('framing-development-v2-results')
          summary = json.loads((root/'framing_v2_diagnostic_summary.json').read_text())
          folds = pd.read_csv(root/'framing_v2_fold_diagnostics.csv')
          pairs = pd.read_csv(root/'framing_v2_pair_diagnostics.csv')
          prior = pd.read_csv(root/'higher_taxon_prior_pair_audit.csv')
          assert summary['status'] == 'development_only_higher_taxon_framing_v2_complete'
          assert summary['protocol_fingerprint'] == '5f77d4e0d33fec794ce85c666a6bfafbe029f0ed001ab2644eb2e64eceb35f5f'
          assert summary['declared_folds'] == 480
          assert len(folds) == 480
          assert len(pairs) == 96
          assert len(prior) == 96
          assert summary['candidate_generation_run'] is False
          assert summary['robust_support_run'] is False
          assert summary['fresh_confirmation_taxa_consumed'] is False
          assert summary['validated_japan_adapter_changed'] is False
          assert summary['beyond_japan_claim_allowed'] is False
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          if summary['promotion_gate_passed']:
              print('DEVELOPMENT GATE PASSED: representation may be frozen before fresh confirmation; not validated here.')
          else:
              print('DEVELOPMENT GATE FAILED: reject this representation without tuning on these 96 taxa.')
          PY

      - name: Upload v2 framing development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsp-geographic-framing-development-v2
          path: |
            framing-development-v2-folds/export_manifest.json
            framing-development-v2-folds/pair_export_status.csv
            framing-development-v2-results/
          if-no-files-found: error
          retention-days: 90
