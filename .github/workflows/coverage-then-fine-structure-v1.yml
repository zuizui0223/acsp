name: Scale-separated coverage then fine structure checks

on:
  pull_request:
    paths:
      - "acsp/discovery/scale_separated.py"
      - "acsp/discovery/__init__.py"
      - "research/materialize_cirsium_fresh_sentinel_public_sources_v1.py"
      - "research/build_cirsium_private_sector_structural_grid_v1.py"
      - "tests/test_coverage_then_fine_structure_v1.py"
      - "tests/test_coverage_then_fine_structure_fresh_sentinel_v1.py"
      - "tests/test_cirsium_fresh_sentinel_source_readiness_v1.py"
      - "validation/coverage_then_fine_structure_architecture_v1.json"
      - "validation/coverage_then_fine_structure_fresh_sentinel_cohort_v1.csv"
      - "validation/coverage_then_fine_structure_fresh_sentinel_freeze_v1.json"
      - "validation/coverage_then_fine_structure_source_readiness_amendment_v1.json"
      - ".github/workflows/coverage-then-fine-structure-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependency
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run scale-separated mechanics, fresh-cohort and source-readiness guards
        run: |
          pytest -q \
            tests/test_coverage_then_fine_structure_v1.py \
            tests/test_coverage_then_fine_structure_fresh_sentinel_v1.py \
            tests/test_cirsium_fresh_sentinel_source_readiness_v1.py
      - name: Guard frozen architecture boundary
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          p = json.loads(Path('validation/coverage_then_fine_structure_architecture_v1.json').read_text())
          assert p['status'] == 'FROZEN_BEFORE_FRESH_EVALUATION'
          assert p['global_order']['method_identity'] == 'COVERAGE_THEN_FINE_STRUCTURE_V1'
          assert p['role_separation']['coarse_default_order_identity'] == 'MORTON_DYADIC_COVERAGE_ORDER_V1'
          assert p['role_separation']['coverage_structure_weight'] is None
          assert p['role_separation']['budget_parameter'] is None
          assert p['role_separation']['cross_cell_structural_score_comparison'] is False
          assert p['fresh_evaluation_requirements']['fresh_or_disjoint_outcomes_required'] is True
          assert p['fresh_evaluation_requirements']['consumed_cirsium_12_folds_may_be_used_for_promotion'] is False

          f = json.loads(Path('validation/coverage_then_fine_structure_fresh_sentinel_freeze_v1.json').read_text())
          assert f['status'] == 'FROZEN_PRE_FIELD_OUTCOME_SOURCE_BLOCKED'
          assert f['method_identity'] == 'COVERAGE_THEN_FINE_STRUCTURE_V1'
          assert f['selection_rule']['selected_units'] == ['CIR02', 'CIR06', 'CIR12', 'CIR13']
          assert f['execution_blocker']['current'] is True
          assert f['frozen_method_boundary']['fine_candidate_spacing_m'] == 100
          assert f['frozen_method_boundary']['coarse_coverage_cell_size_m'] == 5000
          assert f['frozen_method_boundary']['coverage_structure_weight'] is None
          assert f['frozen_method_boundary']['known_point_kernel_for_sentinel'] is False

          with Path('validation/coverage_then_fine_structure_fresh_sentinel_cohort_v1.csv').open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          assert [row['cohort_unit_id'] for row in rows] == ['CIR02', 'CIR06', 'CIR12', 'CIR13']
          assert all(row['outcome_opened'].lower() == 'false' for row in rows)
          assert all(row['execution_status'] == 'BLOCKED_PRIVATE_SOURCE_FREEZE' for row in rows)

          s = json.loads(Path('validation/coverage_then_fine_structure_source_readiness_amendment_v1.json').read_text())
          assert s['status'] == 'PUBLIC_SOURCE_RECONSTRUCTION_READY_PRIVATE_RANGE_SECTOR_GEOMETRY_BLOCKED'
          assert s['repo_and_upstream_audit']['aza3_required_slots_frozen_at_pinned_commit'] == 0
          assert s['remaining_external_blocker']['single_input_class'] == 'PRIVATE_FROZEN_RANGE_SECTOR_GEOMETRY'
          assert s['remaining_external_blocker']['required_units'] == ['CIR02', 'CIR06', 'CIR12', 'CIR13']
          PY
