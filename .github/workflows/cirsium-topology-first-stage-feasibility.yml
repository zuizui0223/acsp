name: Cirsium topology site-choice first-stage feasibility
on:
  pull_request:
    paths:
      - 'research/assess_cirsium_topology_site_first_stage.py'
      - 'tests/test_cirsium_site_first_stage_feasibility.py'
      - 'validation/cirsium_topology_site_selection_first_stage_feasibility_v1.json'
      - 'examples/synthetic_topology_site_preview.json'
      - 'paper/CIRSIUM_SITE_CHOICE_FIRST_STAGE_FEASIBILITY_SECONDARY.md'
      - '.github/workflows/cirsium-topology-first-stage-feasibility.yml'
permissions:
  contents: read
jobs:
  source-bound-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic test runner
        run: python -m pip install pytest
      - name: Exact original source SHA and synthetic preview guards
        run: |
          python -m pytest -q tests/test_cirsium_site_first_stage_feasibility.py tests/test_cirsium_patch_connectivity_trial_design_v1.py
          python -m research.assess_cirsium_topology_site_first_stage --verify-saved validation/cirsium_topology_site_selection_first_stage_feasibility_v1.json
          python -m py_compile research/assess_cirsium_topology_site_first_stage.py research/design_cirsium_patch_connectivity_field_trial_v1.py gbif_fieldmap_builder_app.py
