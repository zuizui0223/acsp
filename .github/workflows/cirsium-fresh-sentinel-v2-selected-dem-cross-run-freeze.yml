name: Fresh-SENTINEL v2 selected DEM source-world evidence freeze

on:
  pull_request:
    paths:
      - "research/compare_cirsium_fresh_sentinel_v2_public_gsi_precision_runs.py"
      - "tests/test_cirsium_fresh_sentinel_v2_public_gsi_precision_runs.py"
      - "research/verify_cirsium_fresh_sentinel_v2_selected_dem_cross_run_result.py"
      - "tests/test_cirsium_fresh_sentinel_v2_selected_dem_cross_run_result.py"
      - "validation/coverage_then_fine_structure_fresh_sentinel_v2_selected_mosaic_cross_run_result_v1.json"
      - ".github/workflows/cirsium-fresh-sentinel-v2-selected-dem-cross-run-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  verify_public_cross_run_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original patch, expected feature hashes and fail-closed cross-run scope
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_cirsium_fresh_sentinel_v2_public_gsi_precision_runs.py \
            tests/test_cirsium_fresh_sentinel_v2_selected_dem_cross_run_result.py
          python -m research.verify_cirsium_fresh_sentinel_v2_selected_dem_cross_run_result
      - name: Download only nine original coordinate-free public receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for unit in CIR02 CIR06 CIR12 CIR13; do
            mkdir -p "/tmp/acsp-public-source-world/first/$unit"
            mkdir -p "/tmp/acsp-public-source-world/second/$unit"
            gh run download 37765932839 --repo "${{ github.repository }}" \
              --name "cirsium-fresh-sentinel-v2-fixed-gsi-${unit}-receipt" \
              --dir "/tmp/acsp-public-source-world/first/$unit"
            gh run download 37785966356 --repo "${{ github.repository }}" \
              --name "cirsium-fresh-sentinel-v2-fixed-gsi-${unit}-receipt" \
              --dir "/tmp/acsp-public-source-world/second/$unit"
          done
          mkdir -p /tmp/acsp-public-source-world/partial
          gh run download 37777351033 --repo "${{ github.repository }}" \
            --name "cirsium-fresh-sentinel-v2-fixed-gsi-CIR02-receipt" \
            --dir "/tmp/acsp-public-source-world/partial"
      - name: Independently match original byte hashes and cross-run interpretations
        run: |
          python -m research.verify_cirsium_fresh_sentinel_v2_selected_dem_cross_run_result \
            --first /tmp/acsp-public-source-world/first \
            --second /tmp/acsp-public-source-world/second \
            --third-cir02 /tmp/acsp-public-source-world/partial/CIR02_receipt.json \
            | tee /tmp/acsp-public-source-world-verify.json
      - name: Publish only original-data verification status
        uses: actions/upload-artifact@v4
        with:
          name: acsp-selected-mosaic-original-public-receipt-verification
          path: /tmp/acsp-public-source-world-verify.json
          if-no-files-found: error
