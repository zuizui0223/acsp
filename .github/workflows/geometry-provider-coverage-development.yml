name: Geometry-provider coverage development

on:
  push:
    branches:
      - development/geometry-provider-coverage-contract-v1
    paths:
      - .github/workflows/geometry-provider-coverage-development.yml
      - research/freeze_geoboundaries_v6_coverage.py
      - research/geoboundaries_v6_coverage_contract.py
      - research/verify_geoboundaries_v6_coverage_live.py
      - research/test_geoboundaries_v6_coverage_contract.py
      - research/test_geoboundaries_v6_coverage_registry.py
      - validation/iso3166_alpha2_to_alpha3_pycountry_24_6_1.json
      - validation/acsp_geoboundaries_v6_adm0_coverage_v1.json
  pull_request:
    paths:
      - .github/workflows/geometry-provider-coverage-development.yml
      - research/freeze_geoboundaries_v6_coverage.py
      - research/geoboundaries_v6_coverage_contract.py
      - research/verify_geoboundaries_v6_coverage_live.py
      - research/test_geoboundaries_v6_coverage_contract.py
      - research/test_geoboundaries_v6_coverage_registry.py
      - validation/iso3166_alpha2_to_alpha3_pycountry_24_6_1.json
      - validation/acsp_geoboundaries_v6_adm0_coverage_v1.json

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  verify-coverage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test extraction and frozen registry offline
        run: |
          python -m unittest -v \
            research/test_geoboundaries_v6_coverage_contract.py \
            research/test_geoboundaries_v6_coverage_registry.py

      - name: Reinspect exact pinned upstream provider only
        run: |
          python research/freeze_geoboundaries_v6_coverage.py \
            --output provider-coverage-live.json \
            > /dev/null

      - name: Require live pinned provider to match frozen registry exactly
        run: |
          python research/verify_geoboundaries_v6_coverage_live.py \
            --live provider-coverage-live.json

      - name: Upload auditable provider-only comparison
        uses: actions/upload-artifact@v4
        with:
          name: geoboundaries-v6-adm0-coverage-verification
          path: provider-coverage-live.json
          if-no-files-found: error
          retention-days: 14
