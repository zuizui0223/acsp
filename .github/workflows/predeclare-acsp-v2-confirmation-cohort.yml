name: Predeclare ACSP v2 untouched confirmation cohort

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/acsp-v2-confirmation-cohort
    paths:
      - validation/acsp_v2_confirmation_cohort_trigger.txt

permissions:
  contents: read

jobs:
  predeclare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Verify frozen protocol and sampler tests
        run: python -m unittest -v test_acsp_v2_confirmation_cohort.py
      - name: Draw taxon-region cohort only
        run: |
          python predeclare_acsp_v2_confirmation_cohort.py \
            --protocol validation/acsp_v2_untouched_confirmation_protocol.json \
            --output acsp-v2-confirmation-cohort
      - name: Audit no-outcome cohort contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path("acsp-v2-confirmation-cohort")
          manifest = json.loads((root / "cohort_manifest.json").read_text())
          declared = pd.read_csv(root / "predeclared_taxon_region_pairs.csv")
          audit = pd.read_csv(root / "sampling_frame_audit.csv")

          assert manifest["status"] == "ready"
          assert manifest["protocol_fingerprint"] == "8b540a965e25789174ce97a976c36d8b659c3c0d2919693b8fcd766330532ebb"
          assert manifest["declared_pairs"] == 192
          assert manifest["unique_declared_taxa"] == 192
          assert manifest["taxon_group_counts"] == {"animal": 96, "plant": 96}
          assert set(manifest["record_count_stratum_counts"].values()) == {48}
          assert set(manifest["region_cell_counts"].values()) == {16}
          assert len(declared) == 192
          assert declared["scientific_name"].nunique() == 192
          assert len(audit) == 96
          assert manifest["outcomes_inspected"] is False
          assert manifest["occurrence_rows_fetched_for_declared_taxa"] is False
          assert manifest["candidate_generation_run"] is False
          assert manifest["acsp_v2_run"] is False
          assert manifest["grts_run"] is False
          assert manifest["sdm_fitting_run"] is False
          assert manifest["heldout_recovery_run"] is False
          assert manifest["taxon_replacement_after_declaration_allowed"] is False
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-v2-untouched-confirmation-cohort
          path: acsp-v2-confirmation-cohort
          if-no-files-found: error
          retention-days: 90
