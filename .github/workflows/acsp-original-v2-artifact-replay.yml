name: Original ACSP v2 GitHub artifact byte replay

on:
  pull_request:
    paths:
      - 'validation/acsp_original_v2_archival_reconciliation_20261028.json'
      - 'research/replay_original_robust_patch_v2_artifacts.py'
      - 'tests/test_original_v2_result_archive_replay.py'
      - 'paper/ORIGINAL_V2_RESULT_ARCHIVE_REPLAY.md'
      - '.github/workflows/acsp-original-v2-artifact-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-v2-results-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact statistical replay dependency
        run: python -m pip install numpy
      - name: Verify static receipt boundaries and source code
        run: |
          python -m unittest discover -s tests -p 'test_original_v2_result_archive_replay.py' -v
          python -m py_compile research/replay_original_robust_patch_v2_artifacts.py gbif_fieldmap_builder_app.py
          python paper/validate_submission_alignment.py
      - name: Retrieve byte-original August 2026 GitHub artifacts before expiry
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/acsp-original-v2
          curl --fail --location --show-error --silent --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/\${GITHUB_REPOSITORY}/actions/artifacts/9394691112/zip" \
            --output /tmp/acsp-original-v2/cohort.zip
          curl --fail --location --show-error --silent --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/\${GITHUB_REPOSITORY}/actions/artifacts/9396133154/zip" \
            --output /tmp/acsp-original-v2/results.zip
      - name: Replay exact 96-pair original result-table bootstrap and sign-flip
        run: |
          python research/replay_original_robust_patch_v2_artifacts.py \
            --cohort-zip /tmp/acsp-original-v2/cohort.zip \
            --results-zip /tmp/acsp-original-v2/results.zip \
            > /tmp/acsp-original-v2/replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/acsp-original-v2/replay.json").read_text())
          assert j["status"] == "BYTE_VERIFIED_HISTORICAL_RESULTS_STATISTICS_REPRODUCED"
          assert j["primary_pairs"] == 96 and j["declared_folds"] == 480
          assert j["original_occurrence_input_rows_present"] is False
          assert j["original_gbif_input_doi_verified"] is False
          print("Original 2026-08-20 zipped statistics confirmed; original GBIF inputs remain unavailable.")
          PY
      - name: Preserve only the coordinate-free replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: acsp-original-20260820-statistical-replay-receipt
          path: /tmp/acsp-original-v2/replay.json
          retention-days: 90
          if-no-files-found: error
