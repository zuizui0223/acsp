name: Izu microenvironment taxon predeclaration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/campanula-discovery-development
    paths:
      - research/predeclare_izu_microenvironment_taxa.py
      - validation/izu_island_microenvironment_random_taxon_transfer_protocol.json
      - .github/workflows/izu-microenvironment-predeclare.yml

permissions:
  contents: read

jobs:
  predeclare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sampling dependencies
        run: python -m pip install pandas numpy requests
      - name: Sample taxon identities only
        run: |
          python research/predeclare_izu_microenvironment_taxa.py \
            --protocol validation/izu_island_microenvironment_random_taxon_transfer_protocol.json \
            --excluded validation/practical_core_untouched_cohort_20260811/excluded_taxa.csv \
            --excluded validation/practical_core_untouched_cohort_20260811/predeclared_taxon_region_pairs.csv \
            --out izu-transfer-cohort
      - name: Audit no-outcome boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('izu-transfer-cohort/cohort_manifest.json').read_text())
          assert p['declared_taxa']==16
          assert p['outcomes_inspected'] is False
          assert p['focal_occurrence_rows_fetched'] is False
          assert p['candidate_generation_run'] is False
          assert p['heldout_recovery_run'] is False
          assert p['taxon_replacement_after_declaration'] is False
          print(json.dumps(p, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: izu-microenvironment-predeclared-taxa
          path: izu-transfer-cohort/
          if-no-files-found: error
          retention-days: 90
