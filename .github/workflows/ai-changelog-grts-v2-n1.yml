name: Record corrected GRTS v2 one-site repair

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - .github/workflows/ai-changelog-grts-v2-n1.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/practical-coverage-v3-development
          fetch-depth: 0
      - name: Prepend changelog and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG_AI.md')
          text = p.read_text(encoding='utf-8')
          marker = '# AI Change Log\n\n'
          heading = '## 2026-08-12 - GPT-5.6 Sol (OpenAI) - Corrected GRTS v2 one-site degenerate-frame repair'
          if not text.startswith(marker):
              raise SystemExit('unexpected changelog header')
          if heading not in text:
              entry_lines = [
                  heading,
                  '',
                  'Changed files:',
                  '- `benchmark_methods/grts_rescue_primary_batch_v2.R`',
                  '- `benchmark_methods/test_grts_rescue_primary_batch_v2.R`',
                  '- `benchmark_practical_rescue_grts_pair_v2.py`',
                  '- `aggregate_practical_rescue_grts_development_v2.py`',
                  '- `test_practical_rescue_grts_development_v2.py`',
                  '- `run_practical_rescue_fresh_confirmation_pair_v2.py`',
                  '- `freeze_practical_rescue_fresh_confirmation_protocol_v2.py`',
                  '- `fit_practical_rescue_final_model_v2.py`',
                  '- `test_practical_rescue_fresh_confirmation.py`',
                  '- `test_practical_rescue_promotion_chain_v2.py`',
                  '',
                  'Summary:',
                  '- Audited failed corrected-v2 raw pre-outcome artifacts without using held-out recovery to choose a fix. The first fail-closed error was `plants_3/fold_001`, whose training-only candidate frame contained exactly one row; all 50 official calls returned `missing value where TRUE/FALSE needed`.',
                  '- The frozen v2 protocol already defines `n_base=min(top_k,candidate_frame_rows)`, so an N=1 frame has one unique probability-one base set. The adapter now records that mathematically degenerate full-frame census directly rather than turning a pinned spsurvey 5.6.1 implementation edge case into comparator zero. Rescue policy, GRTS Top-5, 10-km mindis, maxtry, seeds, draws, and promotion gate are unchanged; the v2 protocol JSON and fingerprint are unchanged.',
                  '- Added an explicit N=1 sparse-frame smoke alongside 4/5/7/8 checks and retained fail-closed behavior for any remaining non-empty-frame GRTS implementation errors.',
                  '- Removed import-time global mutations from v2 development, final-refit, fresh-protocol, and fresh-pair wrappers so retained v1 reproduction/tests remain isolated.',
                  '- Corrected-v2 raw artifacts remain saved before aggregation; missing/failed comparator draws are not silently promoted as zeros through the v2 execution path.',
                  '',
                  '',
              ]
              p.write_text(marker + '\n'.join(entry_lines) + text[len(marker):], encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ai-changelog-grts-v2-n1.yml
          git add CHANGELOG_AI.md
          git commit -m "Record corrected GRTS v2 one-site repair"
          git push origin HEAD:agent/practical-coverage-v3-development
