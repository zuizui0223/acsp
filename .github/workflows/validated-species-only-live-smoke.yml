name: Validated species-only live smoke

on:
  pull_request:
    paths:
      - .github/workflows/validated-species-only-live-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Reproduce Izu terrain failure with full traceback
        run: |
          python - <<'PY'
          from acsp.taxon_patches import _terrain_inputs, fetch_region_occurrences, match_gbif_species
          match = match_gbif_species('Castanopsis sieboldii')
          bounds = (138.8, 34.0, 139.8, 35.0)
          occurrences = fetch_region_occurrences(match['taxon_key'], bounds)
          print('occurrence_rows', len(occurrences))
          surface, prototypes, seed = _terrain_inputs(occurrences, bounds, area_id='izu')
          print('surface', len(surface), 'prototypes', len(prototypes), 'seed', seed)
          PY
