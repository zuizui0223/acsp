name: Campanula occurrence-anchor diagnostic

on:
  pull_request:
    paths:
      - "research/diagnose_campanula_occurrence_anchor.py"
      - "research/test_campanula_occurrence_anchor_diagnostic.py"
      - "research/OCCURRENCE_ANCHORED_LOCAL_DISCOVERY.md"
      - "validation/acsp_occurrence_anchored_local_discovery_development_v1.json"
      - "field_validation/campanula_microdonta/development_data/gbif_training_occurrences_through_2025.csv"
      - "field_validation/campanula_microdonta/development_data/detection_clusters.csv"
      - "field_validation/campanula_microdonta/development_data/manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependency
        run: python -m pip install pandas
      - name: Run occurrence-anchor diagnosis
        run: |
          python research/diagnose_campanula_occurrence_anchor.py \
            --out-dir campanula-occurrence-anchor-diagnostic
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(
              Path("campanula-occurrence-anchor-diagnostic/summary.json").read_text()
          )
          assert summary["scientific_role"] == "development_diagnostic_only"
          assert summary["independent_validation"] is False
          assert summary["clusters"] == 19
          assert sum(summary["anchor_regime_counts"].values()) == 19
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: campanula-occurrence-anchor-diagnostic
          path: campanula-occurrence-anchor-diagnostic
          if-no-files-found: error
