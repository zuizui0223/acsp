name: Campanula occurrence-anchor diagnostic

on:
  pull_request:
    paths:
      - "research/diagnose_campanula_occurrence_anchor.py"
      - "research/test_campanula_occurrence_anchor_diagnostic.py"
      - "research/evaluate_campanula_occurrence_anchor_loco.py"
      - "research/test_campanula_occurrence_anchor_loco.py"
      - "research/OCCURRENCE_ANCHORED_LOCAL_DISCOVERY.md"
      - "validation/acsp_occurrence_anchored_local_discovery_development_v1.json"
      - "validation/campanula_occurrence_anchor_diagnostic_v1/**"
      - "validation/campanula_occurrence_anchor_loco_v1/**"
      - "field_validation/campanula_microdonta/development_data/gbif_training_occurrences_through_2025.csv"
      - "field_validation/campanula_microdonta/development_data/detection_clusters.csv"
      - "field_validation/campanula_microdonta/development_data/manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependency
        run: python -m pip install pandas
      - name: Run focused unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/research
        run: |
          python -m unittest research.test_campanula_occurrence_anchor_diagnostic -v
          python -m unittest research.test_campanula_occurrence_anchor_loco -v
      - name: Run inspected-field anchor diagnosis
        run: |
          python research/diagnose_campanula_occurrence_anchor.py \
            --out-dir campanula-occurrence-anchor-diagnostic
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(
              Path("campanula-occurrence-anchor-diagnostic/summary.json").read_text()
          )
          assert summary["scientific_role"] == "development_diagnostic_only"
          assert summary["independent_validation"] is False
          assert summary["clusters"] == 19
          assert sum(summary["anchor_regime_counts"].values()) == 19
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY
          cmp \
            campanula-occurrence-anchor-diagnostic/summary.json \
            validation/campanula_occurrence_anchor_diagnostic_v1/summary.json
          cmp \
            campanula-occurrence-anchor-diagnostic/cluster_anchor_distances.csv \
            validation/campanula_occurrence_anchor_diagnostic_v1/cluster_anchor_distances.csv
      - name: Run historical whole-cluster baseline
        run: |
          python research/evaluate_campanula_occurrence_anchor_loco.py \
            --out-dir campanula-occurrence-anchor-loco
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(
              Path("campanula-occurrence-anchor-loco/summary.json").read_text()
          )
          assert summary["scientific_role"] == "development_internal_baseline_only"
          assert summary["independent_validation"] is False
          assert summary["reads_2026_field_outcomes"] is False
          assert summary["historical_rows_inside_five_islands"] == 56
          assert summary["primary_cluster_policy"] == "single_link"
          assert summary["sensitivity_cluster_policy"] == "complete_link"
          assert set(summary["policy_summaries"]) == {"single_link", "complete_link"}
          assert summary["policy_summaries"]["single_link"]["clusters"] == 17
          assert summary["policy_summaries"]["complete_link"]["clusters"] == 18
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY
          for file in \
            summary.json \
            historical_occurrence_clusters.csv \
            leave_one_cluster_out_folds.csv \
            annular_baseline_curve.csv
          do
            cmp \
              "campanula-occurrence-anchor-loco/$file" \
              "validation/campanula_occurrence_anchor_loco_v1/$file"
          done
      - name: Upload development diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: campanula-occurrence-anchor-development
          path: |
            campanula-occurrence-anchor-diagnostic
            campanula-occurrence-anchor-loco
          if-no-files-found: error
