name: Campanula NDVI refinement

on:
  workflow_dispatch:
  push:
    branches:
      - agent/campanula-discovery-development
    paths:
      - research/campanula_ndvi_refinement.py
      - research/campanula_ndvi_refinement_fast.py
      - research/campanula_fast_random.py
      - .github/workflows/campanula-ndvi-refinement.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  ndvi-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP and geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install rasterio pyproj scipy awscli

      - name: Download frozen Campanula development cache and GSI DEM artifacts
        uses: actions/download-artifact@v4
        with:
          name: campanula-development-data
          path: campanula-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31856717236

      - name: Resolve and download official ESA WorldCover NDVI composite
        run: |
          set -euo pipefail
          mkdir -p public-layers
          NDVI_KEY=$(aws s3api list-objects-v2 \
            --bucket esa-worldcover-s2 \
            --prefix "ndvi/2021/N34/" \
            --max-items 1000 \
            --no-sign-request \
            --query 'Contents[].Key' \
            --output text | tr '\t' '\n' | grep -Ei 'N34E139.*NDVI.*\.tif$' | head -n 1)
          test -n "$NDVI_KEY"
          printf '%s\n' "$NDVI_KEY" | tee public-layers/ndvi_s3_key.txt
          aws s3 cp "s3://esa-worldcover-s2/$NDVI_KEY" \
            public-layers/ESA_WorldCover_10m_2021_v2_N34E139_NDVI.tif \
            --no-sign-request
          sha256sum public-layers/ESA_WorldCover_10m_2021_v2_N34E139_NDVI.tif \
            | tee public-layers/ndvi_sha256.txt

      - name: Rebuild outcome-blind full-island microterrain universe
        run: |
          python research/campanula_microterrain_discovery.py \
            --gbif campanula-source/field_validation/campanula_microdonta/development_data/gbif_training_occurrences_through_2025.csv \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --dem oshima=campanula-source/dem-artifacts/gsi_02d7024d473d0b2d.tif \
            --dem toshima=campanula-source/dem-artifacts/gsi_4867a2c26d122c44.tif \
            --dem niijima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem shikinejima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem kozushima=campanula-source/dem-artifacts/gsi_4ea5609c14c17bd8.tif \
            --out microterrain-results

      - name: Run NDVI ablation and robust-prototype refinement
        run: |
          python research/campanula_ndvi_refinement_fast.py \
            --microterrain-universe microterrain-results/microterrain_universe.csv \
            --gbif-prototypes microterrain-results/gbif_microterrain_prototypes.csv \
            --ndvi public-layers/ESA_WorldCover_10m_2021_v2_N34E139_NDVI.tif \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --radius-km 1.0 \
            --random-iterations 5000 \
            --seed 20260815 \
            --out ndvi-refinement-results

      - name: Audit development boundary and complete recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('ndvi-refinement-results/ndvi_refinement_report.json').read_text())
          assert report['status'] == 'development_only'
          assert report['field_coordinates_used_by_generator'] is False
          assert report['best']['recovered'] == 19
          assert report['best']['total'] == 19
          print(json.dumps({
              'best': report['best'],
              'compression_vs_prior_cells': report['compression_vs_prior_cells'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: campanula-ndvi-refinement
          path: |
            public-layers/ndvi_s3_key.txt
            public-layers/ndvi_sha256.txt
            microterrain-results/microterrain_report.json
            ndvi-refinement-results/ndvi_refinement_report.json
            ndvi-refinement-results/ndvi_refinement_frontier.csv
            ndvi-refinement-results/best_ndvi_refinement_candidates.csv
          if-no-files-found: error
          retention-days: 90
