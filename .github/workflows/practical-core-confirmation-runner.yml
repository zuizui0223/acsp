name: Practical Core confirmation runner checks

on:
  workflow_dispatch:
  push:
    branches:
      - agent/practical-core-confirmation-runner
    paths:
      - benchmark_methods/grts_batch_candidate_frame.R
      - benchmark_methods/test_grts_batch_candidate_frame.R
      - research/execute_practical_core_confirmation_pair.py
      - research/run_practical_core_confirmation_pair.py
      - research/aggregate_practical_core_confirmation.py
      - research/execute_aggregate_practical_core_confirmation.py
      - research/evaluate_practical_core_claim_guardrails.py
      - research/score_practical_core_secondary_sdm.py
      - research/aggregate_practical_core_secondary_sdm.py
      - validation/acsp_practical_core_claim_guardrail.json
      - validation/acsp_practical_core_secondary_sdm_protocol.json
      - research/test_practical_core_confirmation_runner.py
      - research/test_practical_core_production_aggregator.py
      - research/test_practical_core_claim_guardrails.py
      - research/test_practical_core_secondary_sdm.py
      - .github/workflows/practical-core-confirmation-runner.yml
  pull_request:
    paths:
      - benchmark_methods/grts_batch_candidate_frame.R
      - benchmark_methods/test_grts_batch_candidate_frame.R
      - research/execute_practical_core_confirmation_pair.py
      - research/run_practical_core_confirmation_pair.py
      - research/aggregate_practical_core_confirmation.py
      - research/execute_aggregate_practical_core_confirmation.py
      - research/evaluate_practical_core_claim_guardrails.py
      - research/score_practical_core_secondary_sdm.py
      - research/aggregate_practical_core_secondary_sdm.py
      - validation/acsp_practical_core_claim_guardrail.json
      - validation/acsp_practical_core_secondary_sdm_protocol.json
      - research/test_practical_core_confirmation_runner.py
      - research/test_practical_core_production_aggregator.py
      - research/test_practical_core_claim_guardrails.py
      - research/test_practical_core_secondary_sdm.py
      - .github/workflows/practical-core-confirmation-runner.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/research

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Compile confirmation sources
        run: |
          python -m py_compile \
            research/execute_practical_core_confirmation_pair.py \
            research/run_practical_core_confirmation_pair.py \
            research/aggregate_practical_core_confirmation.py \
            research/execute_aggregate_practical_core_confirmation.py \
            research/evaluate_practical_core_claim_guardrails.py \
            research/score_practical_core_secondary_sdm.py \
            research/aggregate_practical_core_secondary_sdm.py \
            research/test_practical_core_confirmation_runner.py \
            research/test_practical_core_production_aggregator.py \
            research/test_practical_core_claim_guardrails.py \
            research/test_practical_core_secondary_sdm.py
      - name: Run leakage, inference, claim, and secondary-SDM contract tests
        run: |
          python -m unittest -v \
            research/test_practical_core_confirmation_runner.py \
            research/test_practical_core_production_aggregator.py \
            research/test_practical_core_claim_guardrails.py \
            research/test_practical_core_secondary_sdm.py
      - name: Audit frozen fingerprints in source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          checks = [
              (Path("validation/acsp_practical_core_protocol.json"), "fingerprint", "3dafe65b6bef09b1878d688730d5feb64a8de58843b06ff9fb14a876512d4905"),
              (Path("validation/acsp_practical_core_untouched_confirmation_protocol.json"), "protocol_fingerprint", "cd27dc5416057b574e58742bfe001307338a20aedb63ce1bac431588dc58eee9"),
              (Path("validation/acsp_practical_core_claim_guardrail.json"), "fingerprint", "e654d7e0c652effa938f7cd04235156fab9f9c3da2c369200cfa120453eebdfc"),
              (Path("validation/acsp_practical_core_secondary_sdm_protocol.json"), "fingerprint", "50fac79ce26378a56aaf497564ce85574986580096275c4d26de67170e6f3d63"),
          ]
          for path, field, expected in checks:
              payload = json.loads(path.read_text())
              stored = payload.pop(field)
              actual = hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              assert stored == expected == actual, (path, stored, actual)
          PY

  grts-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::spsurvey
            any::sf
      - name: Require frozen spsurvey version
        run: |
          Rscript - <<'RSCRIPT'
          stopifnot(as.character(packageVersion("spsurvey")) == "5.6.1")
          RSCRIPT
      - name: Run batched official GRTS tests
        run: Rscript benchmark_methods/test_grts_batch_candidate_frame.R | tee grts-batch-test.log
      - name: Record R comparator versions
        run: |
          Rscript - <<'RSCRIPT'
          writeLines(c(
            paste0("spsurvey=", as.character(packageVersion("spsurvey"))),
            paste0("sf=", as.character(packageVersion("sf"))),
            paste0("R=", paste(R.version$major, R.version$minor, sep = "."))
          ), "grts-batch-versions.txt")
          RSCRIPT
      - uses: actions/upload-artifact@v4
        with:
          name: practical-core-confirmation-runner-audit
          path: |
            grts-batch-test.log
            grts-batch-versions.txt
          if-no-files-found: error
          retention-days: 90
