name: Izu low-budget allocation decomposition

on:
  workflow_dispatch:
  push:
    branches:
      - agent/microenvironment-generalization-development
    paths:
      - research/develop_izu_low_budget_allocation_decomposition.py
      - validation/izu_microenvironment_generalization_development/low_budget_allocation_decomposition_protocol.json
      - .github/workflows/izu-low-budget-allocation-decomposition.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install rasterio pyproj scipy awscli requests
      - name: Download frozen GSI DEM artifacts
        uses: actions/download-artifact@v4
        with:
          name: campanula-development-data
          path: campanula-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31856717236
      - name: Download frozen-source ESA NDVI tile
        run: |
          set -euo pipefail
          mkdir -p public-layers
          aws s3 cp \
            s3://esa-worldcover-s2/ndvi/2021/N34/ESA_WorldCover_10m_2021_v200_N34E139_NDVI.tif \
            public-layers/ndvi.tif --no-sign-request
          echo '641c99d0bae8ddb38f31c079b16597956e9c981ca42c20d9e13e5b8551133638  public-layers/ndvi.tif' | sha256sum -c -
      - name: Run predeclared q10 K5 allocation decomposition
        run: |
          python research/develop_izu_low_budget_allocation_decomposition.py \
            --protocol validation/izu_microenvironment_generalization_development/low_budget_allocation_decomposition_protocol.json \
            --transfer-protocol validation/izu_island_microenvironment_random_taxon_transfer_protocol.json \
            --sample validation/izu_island_microenvironment_random_taxa_20260816/predeclared_taxa.csv \
            --ndvi public-layers/ndvi.tif \
            --dem oshima=campanula-source/dem-artifacts/gsi_02d7024d473d0b2d.tif \
            --dem toshima=campanula-source/dem-artifacts/gsi_4867a2c26d122c44.tif \
            --dem niijima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem shikinejima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem kozushima=campanula-source/dem-artifacts/gsi_4ea5609c14c17bd8.tif \
            --out low-budget-results
      - name: Audit development boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('low-budget-results/low_budget_decomposition_summary.json').read_text())
          assert s['status']=='development_only'
          assert s['protocol_id']=='izu-low-budget-allocation-decomposition-v1'
          assert s['taxa']==16
          assert s['weights_or_qkr_retuned'] is False
          assert s['frozen_192_consumed'] is False
          assert s['confirmation_claim'] is False
          print(json.dumps(s, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: izu-low-budget-allocation-decomposition
          path: low-budget-results/
          if-no-files-found: error
          retention-days: 90
