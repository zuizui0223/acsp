name: ACSP Practical Rescue corrected official GRTS development gate v2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - validation/acsp_practical_rescue_grts_development_protocol_v2.json
      - benchmark_methods/grts_rescue_primary_batch_v2.R
      - benchmark_methods/test_grts_rescue_primary_batch_v2.R
      - benchmark_practical_rescue_grts_pair_v2.py
      - aggregate_practical_rescue_grts_development_v2.py
      - test_practical_rescue_grts_development_v2.py
      - .github/workflows/practical-rescue-grts-development-v2.yml

concurrency:
  group: practical-rescue-grts-development-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  corrected-72-pair-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install frozen Python scoring runtime
        run: python -m pip install "numpy==2.3.5" "pandas==2.2.3"
      - name: Verify corrected GRTS v2 contract
        run: python -m unittest -v test_practical_rescue_grts_development_v2.py
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install only official GRTS hard dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
            any::survey
            any::boot
            any::crossdes
            any::deldir
            any::lme4
            any::sampling
            any::units
      - name: Install pinned official spsurvey 5.6.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            -o /tmp/spsurvey-5.6.1.tar.gz \
            https://codeload.github.com/USEPA/spsurvey/tar.gz/0914fcd071713fdab19f43d8d9a66436830bd917
          R CMD INSTALL /tmp/spsurvey-5.6.1.tar.gz
          Rscript - <<'RSCRIPT'
          stopifnot(as.character(packageVersion("spsurvey")) == "5.6.1")
          RSCRIPT
      - name: Smoke-test official GRTS base adapter
        run: Rscript benchmark_methods/test_grts_candidate_frame.R
      - name: Verify corrected sparse-frame replacement behavior
        run: Rscript benchmark_methods/test_grts_rescue_primary_batch_v2.R
      - name: Download frozen rescue 72-pair decisions
        uses: actions/download-artifact@v4
        with:
          name: acsp-practical-rescue-72-pair-development
          path: rescue72
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31544341871
      - name: Download mixed 24-pair source artifact
        uses: actions/download-artifact@v4
        with:
          name: standard-baselines-mixed_20260705
          path: sources/mixed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30091294481
      - name: Download plant 24-pair source artifact
        uses: actions/download-artifact@v4
        with:
          name: standard-baselines-plants_20260706
          path: sources/plants
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30091305081
      - name: Download locked extension 24-pair source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdm-topk-recovered-pair-*
          path: sources/sdm24
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31238895064
      - name: Freeze corrected 18,000 official GRTS designs then score all 72 development pairs
        run: |
          set -euo pipefail
          max_jobs=4
          for source in mixed plants sdm; do
            if [ "$source" = mixed ]; then root=sources/mixed; fi
            if [ "$source" = plants ]; then root=sources/plants; fi
            if [ "$source" = sdm ]; then root=sources/sdm24; fi
            for pair_id in $(seq 1 24); do
              echo "=== queue corrected ${source}_${pair_id} ==="
              python benchmark_practical_rescue_grts_pair_v2.py \
                --group-id "${source}_${pair_id}" \
                --source-root "$root" \
                --rescue-fold-table rescue72/fold_method_comparison.csv \
                --protocol validation/acsp_practical_rescue_grts_development_protocol_v2.json \
                --output rescue-grts-development-v2-pairs &
              while [ "$(jobs -rp | wc -l)" -ge "$max_jobs" ]; do
                wait -n
              done
            done
          done
          wait
      - name: Preserve corrected frozen pair outputs before aggregation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsp-practical-rescue-corrected-grts-v2-72-development-pairs
          path: rescue-grts-development-v2-pairs
          if-no-files-found: warn
          retention-days: 90
      - name: Audit feasible replacement rule across frozen draws
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          paths = list(Path("rescue-grts-development-v2-pairs").rglob("grts_draws_scored.csv"))
          assert len(paths) == 72, len(paths)
          frames = [pd.read_csv(p) for p in paths]
          d = pd.concat(frames, ignore_index=True)
          assert len(d) == 18000, len(d)
          requested = pd.to_numeric(d["requested_replacements"], errors="raise").astype(int)
          effective = pd.to_numeric(d["effective_replacements"], errors="raise").astype(int)
          n = pd.to_numeric(d["candidate_frame_rows"], errors="raise").astype(int)
          k = pd.to_numeric(d["requested_k"], errors="raise").astype(int)
          n_base = np.minimum(k, n)
          expected = np.minimum(requested, np.maximum(n - n_base, 0))
          assert np.array_equal(effective.to_numpy(), expected.to_numpy())
          nonempty = n.gt(0)
          old_oversample_failure_zone = nonempty & n.lt(n_base + requested)
          assert old_oversample_failure_zone.any(), "audit expected sparse frames but found none"
          print({
              "draws": len(d),
              "sparse_draws_that_v1_overrequested": int(old_oversample_failure_zone.sum()),
              "corrected_effective_replacement_draws": int((effective < requested).sum()),
              "errors_after_correction": int(d["error_message"].fillna("").astype(str).str.len().gt(0).sum()),
          })
          PY
      - name: Evaluate corrected frozen pair-level GRTS gate
        run: |
          python aggregate_practical_rescue_grts_development_v2.py \
            --pair-root rescue-grts-development-v2-pairs \
            --protocol validation/acsp_practical_rescue_grts_development_protocol_v2.json \
            --output rescue-grts-development-v2-aggregate
      - name: Require complete corrected 72-pair result
        run: |
          test -s rescue-grts-development-v2-aggregate/development_manifest.json
          test -s rescue-grts-development-v2-aggregate/pair_level_comparison.csv
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("rescue-grts-development-v2-aggregate/development_manifest.json").read_text())
          assert result["protocol_fingerprint"] == "74fec14b44035e897072b022d82ea30c00b27ce1bb95c16a0e9a5578a3d3da7a"
          assert result["declared_pairs"] == result["complete_pairs"] == 72
          assert result["folds"] == 360
          assert result["total_grts_draws"] == 18000
          assert result["spsurvey_version"] == "5.6.1"
          assert result["spsurvey_tag_commit"] == "0914fcd071713fdab19f43d8d9a66436830bd917"
          assert result["outcomes_available_to_grts_selector"] is False
          assert result["no_retuning_after_grts_outcome"] is True
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-practical-rescue-corrected-grts-v2-72-development
          path: |
            rescue-grts-development-v2-aggregate
            rescue-grts-development-v2-pairs
          if-no-files-found: error
          retention-days: 90
