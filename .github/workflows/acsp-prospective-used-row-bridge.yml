name: Future GBIF raw-to-used-row bridge (synthetic only)

on:
  pull_request:
    paths:
      - 'research/verify_prospective_gbif_used_rows_v1.py'
      - 'tests/test_prospective_gbif_used_rows_v1.py'
      - 'paper/PROSPECTIVE_GBIF_USED_ROW_BRIDGE.md'
      - 'paper/PROSPECTIVE_GBIF_SOURCE_CAPTURE.md'
      - 'paper/SUBMISSION_READINESS.md'
      - '.github/workflows/acsp-prospective-used-row-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-private-used-bridge:
    name: Synthetic raw-to-cleaned GBIF identity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only historical-candidate test dependency
        run: python -m pip install numpy
      - name: Verify prospective original raw ID and used-row bridge
        run: |
          python -m unittest discover -s tests -p 'test_prospective_gbif_used_rows_v1.py' -v
          python -m unittest discover -s tests -p 'test_prospective_gbif_search_source_v1.py' -v
          python -m unittest discover -s tests -p 'test_candidate_original_gbif_folds.py' -v
          python paper/validate_submission_alignment.py
          python paper/validate_submission_packet.py
          python -m py_compile research/verify_prospective_gbif_used_rows_v1.py
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path("research/verify_prospective_gbif_used_rows_v1.py").read_text()
          imports=set()
          for node in ast.walk(ast.parse(s)):
              if isinstance(node, ast.Import):
                  imports.update(a.name for a in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          assert not any(i.startswith(("requests","urllib.request","aiohttp","http.client"))
                         for i in imports)
          assert "historical_2026_august_original_gbif_input_recovered" in s
          assert "frozen_used_ids_independently_attested_pre_outcome" in s
          print("Synthetic future-source identity bridge: no real GBIF request or old-source promotion.")
          PY
