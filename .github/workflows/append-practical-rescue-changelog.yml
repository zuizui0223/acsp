name: Append Practical Rescue AI changelog

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - validation/append_practical_rescue_changelog_trigger.txt

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate frozen protocol, prepend changelog, and remove helper
        env:
          CHANGELOG_ENTRY_B64: 
        run: |
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          protocol_path = Path("validation/acsp_practical_rescue_grts_development_protocol.json")
          payload = json.loads(protocol_path.read_text(encoding="utf-8"))
          stored = payload.pop("protocol_fingerprint")
          calculated = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          assert stored == calculated == "950f7d9de90da2f2bd2561a18b7cc1eb74a60568ccc801875b96119db53bddf2", (stored, calculated)

          changelog = Path("CHANGELOG_AI.md")
          original = changelog.read_text(encoding="utf-8")
          header = "# AI Change Log\n"
          assert original.startswith(header)
          marker = "## 2026-08-12 - GPT-5.6 Sol (OpenAI) - Local-anchor rescue development and GRTS gate"
          if marker not in original:
              entry = base64.b64decode(os.environ["CHANGELOG_ENTRY_B64"]).decode("utf-8")
              changelog.write_text(header + entry + original[len(header):], encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/append-practical-rescue-changelog.yml
          git rm validation/append_practical_rescue_changelog_trigger.txt
          git add CHANGELOG_AI.md
          git diff --cached --check
          git commit -m "Document Practical Rescue development and GRTS promotion gate"
          git pull --rebase origin agent/practical-coverage-v3-development
          git push origin HEAD:agent/practical-coverage-v3-development
