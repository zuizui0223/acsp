name: Append Practical Rescue AI changelog

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - validation/append_practical_rescue_changelog_trigger.txt

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepend required AI changelog entry and remove helper
        env:
          CHANGELOG_ENTRY_B64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path("CHANGELOG_AI.md")
          original = path.read_text(encoding="utf-8")
          header = "# AI Change Log\n"
          assert original.startswith(header)
          entry = base64.b64decode(__import__("os").environ["CHANGELOG_ENTRY_B64"]).decode("utf-8")
          if "## 2026-08-12 - GPT-5.6 Sol (OpenAI) - Local-anchor rescue development" not in original:
              path.write_text(header + entry + original[len(header):], encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/append-practical-rescue-changelog.yml
          git rm validation/append_practical_rescue_changelog_trigger.txt
          git add CHANGELOG_AI.md
          git commit -m "Document Practical Rescue development and GRTS promotion gate"
          git push origin HEAD:agent/practical-coverage-v3-development
