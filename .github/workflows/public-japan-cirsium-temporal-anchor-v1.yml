name: Public Japan Cirsium temporal anchor benchmark v1

on:
  pull_request:
    paths:
      - "research/benchmark_public_japan_cirsium_temporal_anchor_v1.py"
      - "tests/test_public_japan_cirsium_temporal_anchor_benchmark.py"
      - "validation/public_japan_cirsium_temporal_anchor_benchmark_v1.json"
      - "validation/cirsium_aza3_prospective_validation_cohort_v1.csv"
      - ".github/workflows/public-japan-cirsium-temporal-anchor-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic unit tests
        run: python tests/test_public_japan_cirsium_temporal_anchor_benchmark.py -v
      - name: Run frozen public GBIF temporal benchmark
        run: |
          rm -rf /tmp/public-japan-cirsium-temporal-anchor-v1
          python research/benchmark_public_japan_cirsium_temporal_anchor_v1.py \
            --out-dir /tmp/public-japan-cirsium-temporal-anchor-v1
      - name: Guard output against accidental field/private columns
        run: |
          if grep -R -E 'private_exact|field_outcome|tissue_acquired|authorization_record' /tmp/public-japan-cirsium-temporal-anchor-v1; then
            echo 'private/field outcome marker leaked into public benchmark output'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-japan-cirsium-temporal-anchor-v1
          path: /tmp/public-japan-cirsium-temporal-anchor-v1/
          if-no-files-found: error
