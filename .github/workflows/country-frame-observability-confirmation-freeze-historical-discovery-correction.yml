name: Country-frame observability confirmation freeze historical discovery correction

# Dormant until the dedicated corrected activation marker is created on main.
on:
  push:
    branches: [main]
    paths:
      - validation/activate_country_frame_observability_confirmation_historical_discovery_correction.marker

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  corrected-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Verify exact corrected one-shot activation before identities
        env:
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import predeclare_country_frame_observability_confirmation_historical_discovery as corrected

          parent = "f90f5f614bc370dd2fed40973ac11a3edcb3d88dfd6afebae8ce5de5a4bec547"
          correction = "f218782451f7a3a3b248ce8a886a0ccab838eedafd752d8475a9b6682e4fdb1e"
          exposure = "76e708dfbc45daa55c3a6d383c47e1b35074df5b206a1bc27e584ce7cf7ae638"
          assert os.environ["RUN_NUMBER"] == "1", "corrected freeze is one-shot"
          assert os.environ["GITHUB_REF_VALUE"] == "refs/heads/main"

          cfg = corrected.base.protocol()
          amendment = corrected.correction()
          binding, exposed_keys = corrected.exposure_binding()
          assert cfg["protocol_fingerprint"] == parent
          assert amendment["correction_fingerprint"] == correction
          assert binding["binding_fingerprint"] == exposure
          assert exposed_keys == {9775639}

          marker = Path(
              "validation/activate_country_frame_observability_confirmation_historical_discovery_correction.marker"
          ).read_text(encoding="utf-8")
          for token in (
              "issue=163",
              f"parent_protocol_fingerprint={parent}",
              f"boundary_correction_fingerprint={correction}",
              f"preheldout_exposure_binding_fingerprint={exposure}",
              "quarantined_run_id=32991791263",
              "quarantined_run_authoritative=false",
              "quarantined_run_artifacts=0",
              "corrected_discovery_years=1900-2020",
              "country_declaration_rule_changed=false",
              "score_or_endpoint_changed=false",
              "heldout_outcomes_opened=false",
              "second_heldout_activation_required=true",
          ):
              assert token in marker, f"corrected activation drift: {token}"
          PY
      - name: Re-run original and corrected pre-heldout contract tests
        run: |
          python -m unittest -v research/test_country_frame_observability_confirmation.py
          python -m unittest -v research/test_country_frame_observability_confirmation_historical_discovery.py

  freeze-observability-frames:
    needs: corrected-contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Freeze corrected historical-discovery 96-frame cohort
        id: freeze
        run: |
          python research/predeclare_country_frame_observability_confirmation_historical_discovery.py \
            --output observability-confirmation-cohort
      - name: Upload abort audit only if corrected freeze fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: country-frame-observability-confirmation-corrected-abort-audit
          path: observability-confirmation-cohort/
          if-no-files-found: warn
          retention-days: 90
      - name: Verify complete corrected cohort before heldout activation
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import pandas as pd
          import predeclare_country_frame_observability_confirmation_historical_discovery as corrected

          root = Path("observability-confirmation-cohort")
          frame = pd.read_csv(root / "predeclared_observability_frames.csv")
          audit = pd.read_csv(root / "pre_freeze_declaration_attempts.csv")
          manifest = json.loads((root / "cohort_manifest.json").read_text(encoding="utf-8"))
          parent = "f90f5f614bc370dd2fed40973ac11a3edcb3d88dfd6afebae8ce5de5a4bec547"
          correction = "f218782451f7a3a3b248ce8a886a0ccab838eedafd752d8475a9b6682e4fdb1e"
          exposure = "76e708dfbc45daa55c3a6d383c47e1b35074df5b206a1bc27e584ce7cf7ae638"

          assert manifest["status"] == "observability_confirmation_96_frames_frozen_before_heldout"
          assert manifest["protocol_fingerprint"] == parent
          assert manifest["parent_protocol_fingerprint"] == parent
          assert manifest["boundary_correction_fingerprint"] == correction
          assert manifest["preheldout_exposure_binding_fingerprint"] == exposure
          assert manifest["discovery_species_facet_years"] == [1900, 2020]
          assert manifest["discovery_species_facets_include_heldout_years"] is False
          assert manifest["preheldout_exposed_species_keys"] == 1
          assert manifest["frozen_frames"] == manifest["unique_species_keys"] == len(frame) == 96
          assert frame["speciesKey"].nunique() == 96
          assert frame["scientific_name"].nunique() == 96
          assert frame["taxon_group"].value_counts().to_dict() == {"plant": 48, "animal": 48}
          for group in ("plant", "animal"):
              counts = frame.loc[frame["taxon_group"].eq(group), "record_count_stratum"].astype(int).value_counts().sort_index().to_dict()
              assert counts == {0: 12, 1: 12, 2: 12, 3: 12}
          per_cell = frame.groupby(["region_cell_index", "taxon_group"]).size()
          assert len(per_cell) == 24 and (per_cell == 4).all()
          assert frame["declaration_status"].eq("declared").all()
          assert (frame["historical_selected_country_count"].astype(int) >= 5).all()
          for row in frame.itertuples(index=False):
              assert math.isclose(
                  float(row.country_frame_observability_score),
                  corrected.base.observability_score(int(row.historical_selected_country_count)),
                  rel_tol=0.0,
                  abs_tol=1e-12,
              )

          excluded_keys, excluded_names = corrected.corrected_exclusion_sets()
          assert not (set(frame["speciesKey"].astype(int)) & excluded_keys)
          assert not (set(frame["scientific_name"].astype(str)) & excluded_names)
          assert 9775639 not in set(frame["speciesKey"].astype(int))
          assert int(audit["selected"].astype(str).str.lower().eq("true").sum()) == 96

          forbidden_columns = {
              "recent_count", "recent_records", "temporal_status", "temporal_outcome",
              "candidate", "robust", "random", "recall", "lift",
          }
          assert not (forbidden_columns & set(frame.columns))
          assert not (forbidden_columns & set(audit.columns))
          assert manifest["recent_outcomes_opened"] is False
          assert manifest["candidate_generation_run"] is False
          assert manifest["robust_support_run"] is False
          assert manifest["random_baseline_run"] is False
          assert manifest["recall_or_lift_read"] is False
          assert manifest["replacement_after_freeze_allowed"] is False
          assert manifest["score_cutoff_selected"] is False
          assert manifest["scientific_candidate_method_changed"] is False
          PY
      - name: Upload authoritative corrected observability cohort
        uses: actions/upload-artifact@v4
        with:
          name: country-frame-observability-confirmation-cohort-corrected-historical-discovery
          path: observability-confirmation-cohort/
          if-no-files-found: error
          retention-days: 90
