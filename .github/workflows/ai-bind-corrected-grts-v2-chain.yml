name: Bind corrected GRTS v2 promotion chain

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - .github/workflows/ai-bind-corrected-grts-v2-chain.yml

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/practical-coverage-v3-development
          fetch-depth: 0
      - name: Bind final fit and fresh confirmation to corrected comparator
        run: |
          python - <<'PY'
          from pathlib import Path

          old_fp = "950f7d9de90da2f2bd2561a18b7cc1eb74a60568ccc801875b96119db53bddf2"
          new_fp = "74fec14b44035e897072b022d82ea30c00b27ce1bb95c16a0e9a5578a3d3da7a"

          fit = Path("fit_practical_rescue_final_model.py")
          text = fit.read_text(encoding="utf-8")
          if old_fp not in text:
              raise SystemExit("old GRTS fingerprint missing from final fit script")
          fit.write_text(text.replace(old_fp, new_fp), encoding="utf-8")

          freeze = Path("freeze_practical_rescue_fresh_confirmation_protocol.py")
          text = freeze.read_text(encoding="utf-8")
          if old_fp not in text:
              raise SystemExit("old GRTS fingerprint missing from fresh protocol freezer")
          text = text.replace(old_fp, new_fp)
          text = text.replace(
              '"protocol_id": "acsp-practical-rescue-fresh-confirmation-v1",',
              '"protocol_id": "acsp-practical-rescue-fresh-confirmation-v2",',
          )
          old_repl = '            "replacement_sites": 3,\n'
          new_repl = (
              '            "replacement_sites_requested": 3,\n'
              '            "replacement_sites_effective_rule": "min(replacement_sites_requested, max(candidate_frame_rows - n_base, 0))",\n'
              '            "replacement_sites_role": "diagnostic oversample only; lack of spare rows cannot invalidate an otherwise valid primary base design",\n'
          )
          if old_repl not in text:
              raise SystemExit("old fresh replacement field missing")
          text = text.replace(old_repl, new_repl)
          text = text.replace(
              '"primary_contrast": "practical_rescue_final_72 - official_grts_proportional_local_mindis10km",',
              '"primary_contrast": "practical_rescue_final_72 - corrected_official_grts_proportional_local_mindis10km",',
          )
          freeze.write_text(text, encoding="utf-8")

          runner = Path("run_practical_rescue_fresh_confirmation_pair.py")
          text = runner.read_text(encoding="utf-8")
          old_script = '"benchmark_methods/grts_rescue_primary_batch.R",'
          new_script = '"benchmark_methods/grts_rescue_primary_batch_v2.R",'
          if old_script not in text:
              raise SystemExit("old GRTS adapter missing from fresh pair runner")
          text = text.replace(old_script, new_script)
          old_key = 'str(int(grts["replacement_sites"]))'
          new_key = 'str(int(grts["replacement_sites_requested"]))'
          if old_key not in text:
              raise SystemExit("old replacement key missing from fresh pair runner")
          text = text.replace(old_key, new_key)
          marker = '    if draws["outcomes_available_to_selector"].astype(str).str.lower().isin({"true", "1"}).any():\n        raise RuntimeError("official GRTS artifact reports held-out outcome access")\n'
          addition = marker + '''    required = {"effective_replacements", "candidate_frame_rows"}\n    if not required.issubset(draws.columns):\n        raise RuntimeError("corrected GRTS artifact lacks feasible-replacement diagnostics")\n    requested = int(grts["replacement_sites_requested"])\n    effective = pd.to_numeric(draws["effective_replacements"], errors="raise").astype(int)\n    frame_rows = pd.to_numeric(draws["candidate_frame_rows"], errors="raise").astype(int)\n    n_base = np.minimum(int(grts["top_k"]), frame_rows.to_numpy())\n    expected_effective = np.minimum(requested, np.maximum(frame_rows.to_numpy() - n_base, 0))\n    if not np.array_equal(effective.to_numpy(), expected_effective):\n        raise RuntimeError("corrected GRTS artifact violates feasible diagnostic replacement rule")\n'''
          if marker not in text:
              raise SystemExit("fresh pair GRTS validation marker missing")
          text = text.replace(marker, addition, 1)
          runner.write_text(text, encoding="utf-8")

          test = Path("test_practical_rescue_fresh_protocol.py")
          text = test.read_text(encoding="utf-8")
          marker = '            self.assertEqual(payload["official_grts"]["draws_per_fold"], 50)\n'
          addition = marker + '            self.assertEqual(payload["official_grts"]["replacement_sites_requested"], 3)\n            self.assertEqual(payload["official_grts"]["replacement_sites_effective_rule"], "min(replacement_sites_requested, max(candidate_frame_rows - n_base, 0))")\n'
          if marker not in text:
              raise SystemExit("fresh protocol test marker missing")
          test.write_text(text.replace(marker, addition, 1), encoding="utf-8")

          workflow = Path(".github/workflows/practical-rescue-fresh-confirmation.yml")
          text = workflow.read_text(encoding="utf-8")
          marker = '      - name: Download frozen fresh predeclaration\n'
          position = text.rfind(marker)
          if position < 0:
              raise SystemExit("fresh confirmation pair download marker missing")
          smoke = '      - name: Verify corrected sparse-frame GRTS behavior\n        run: Rscript benchmark_methods/test_grts_rescue_primary_batch_v2.R\n'
          if smoke not in text:
              text = text[:position] + smoke + text[position:]
          workflow.write_text(text, encoding="utf-8")
          PY
      - name: Record AI changelog entry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG_AI.md")
          text = path.read_text(encoding="utf-8")
          marker = "# AI Change Log\n\n"
          heading = "## 2026-08-12 - GPT-5.6 Sol (OpenAI) - Corrected GRTS v2 promotion chain"
          if heading not in text:
              lines = [
                  heading,
                  "",
                  "Summary:",
                  "- Audited v1 official-GRTS errors against pre-outcome candidate-frame sizes and found deterministic diagnostic-oversample failures when fewer than three replacement rows remained.",
                  "- Froze corrected strong-comparator protocol v2 (`74fec14b44035e897072b022d82ea30c00b27ce1bb95c16a0e9a5578a3d3da7a`) before evaluating v2 outcomes; rescue model/features/hyperparameters and the promotion threshold are unchanged.",
                  "- Added a feasible diagnostic-replacement adapter and sparse-frame tests: requested replacements remain three, while effective replacements are capped by rows remaining after the primary base sample.",
                  "- Bound final refit and fully fresh confirmation to corrected GRTS v2; final refit now resolves the passed v2 run only from an immutable numeric trigger file.",
                  "- The earlier v1 GRTS aggregate is retained for audit but is not eligible to justify promotion because its comparator was artificially weakened by oversample infeasibility.",
                  "",
                  "",
              ]
              if not text.startswith(marker):
                  raise SystemExit("unexpected changelog header")
              path.write_text(marker + "\n".join(lines) + text[len(marker):], encoding="utf-8")
          PY
      - name: Commit chain binding and remove helper
        run: |
          git rm .github/workflows/ai-bind-corrected-grts-v2-chain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fit_practical_rescue_final_model.py \
            freeze_practical_rescue_fresh_confirmation_protocol.py \
            run_practical_rescue_fresh_confirmation_pair.py \
            test_practical_rescue_fresh_protocol.py \
            .github/workflows/practical-rescue-fresh-confirmation.yml \
            CHANGELOG_AI.md
          git commit -m "Bind promotion chain to corrected GRTS v2"
          git push origin HEAD:agent/practical-coverage-v3-development
