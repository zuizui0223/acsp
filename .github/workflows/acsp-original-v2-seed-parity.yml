name: Original ACSP v2 seed-offset execution parity

on:
  pull_request:
    paths:
      - 'research/audit_original_v2_seed_offset_parity.py'
      - 'validation/acsp_original_v2_rng_seed_parity_20261028.json'
      - 'tests/test_original_v2_seed_offset_parity.py'
      - 'paper/ORIGINAL_V2_RANDOM_BASELINE_PARITY.md'
      - '.github/workflows/acsp-original-v2-seed-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-byte-parity:
    name: Paired historical run source-byte audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original replay dependency
        run: python -m pip install numpy
      - name: Verify scientific limits, receipt and source code
        run: |
          python -m unittest discover -s tests -p 'test_original_v2_seed_offset_parity.py' -v
          python -m unittest discover -s tests -p 'test_original_v2_result_archive_replay.py' -v
          python paper/validate_submission_alignment.py
          python -m py_compile research/audit_original_v2_seed_offset_parity.py
      - name: Retrieve two authentic historical result ZIPs before expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/acsp-v2-two-runs
          curl --fail --location --show-error --silent --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9395679418/zip" \
            --output /tmp/acsp-v2-two-runs/prior.zip
          curl --fail --location --show-error --silent --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9396133154/zip" \
            --output /tmp/acsp-v2-two-runs/final.zip
      - name: Verify unchanged ecology and changing random reference only
        run: |
          python research/audit_original_v2_seed_offset_parity.py \
            --prior-zip /tmp/acsp-v2-two-runs/prior.zip \
            --final-zip /tmp/acsp-v2-two-runs/final.zip \
            --verify-saved validation/acsp_original_v2_rng_seed_parity_20261028.json \
            > /tmp/acsp-v2-two-runs/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/acsp-v2-two-runs/report.json").read_text())
          assert d["status"] == "HISTORICAL_NONINDEPENDENT_SEED_IMPLEMENTATION_COMPARISON"
          assert d["frozen_geometry_and_recovery_outputs"]["original_fold_by_radius_rows"] == 1920
          assert d["frozen_geometry_and_recovery_outputs"]["changed_random_baseline_fold_by_radius_rows"] == 1287
          assert d["frozen_geometry_and_recovery_outputs"]["changed_pair_mean_lift_rows"] == 78
          assert d["primary_10km"]["both_passed_frozen_gates"] is True
          assert d["scientific_limits"]["independent_new_taxa_or_cohort"] is False
          assert d["scientific_limits"]["historical_input_GBIF_rows_byte_verified_equal"] is False
          assert d["scientific_limits"]["causal_attribution_only_to_seed_proven"] is False
          print("Two original source ZIPs checked; frozen ecology and held-out recovery unchanged.")
          PY
      - name: Save only a coordinate-free comparison receipt
        uses: actions/upload-artifact@v4
        with:
          name: acsp-20260820-original-seed-parity-audit
          path: /tmp/acsp-v2-two-runs/report.json
          retention-days: 90
          if-no-files-found: error
