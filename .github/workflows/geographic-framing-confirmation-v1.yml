name: Geographic framing confirmation v1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  predeclare-confirmation-cohort:
    name: Manual replay - freeze fresh disjoint 96-taxon confirmation cohort
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP
        run: python -m pip install -e .

      - name: Verify frozen confirmation contract before identity sampling
        run: |
          python -m unittest -v research/test_geographic_framing_confirmation_v1.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('validation/acsp_geographic_framing_confirmation_protocol_v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          stored = payload.pop('protocol_fingerprint')
          calculated = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          expected = '9f655f6121f1c917659dcf85ba039304b645ea88b5afff8d7855a11cf1e7a490'
          assert stored == calculated == expected
          assert payload['cohort']['seed'] == 2026082305
          assert payload['cohort']['pair_count'] == 96
          assert payload['representation']['historical_year_range'] == [1900, 2020]
          assert payload['representation']['heldout_year_range'] == [2021, 2025]
          assert payload['representation']['country_expansion'] is False
          assert payload['representation']['higher_taxon_fallback'] is False
          assert payload['confirmation_gate']['historical_registry_availability_min'] == 0.95
          assert payload['confirmation_gate']['temporal_evaluability_overall_min'] == 0.90
          assert payload['confirmation_gate']['conditional_containment_overall_min'] == 0.97
          assert payload['claim_boundary']['fresh_confirmation_cohort'] is True
          assert payload['claim_boundary']['confirmation_taxon_replacement_allowed'] is False
          assert payload['claim_boundary']['candidate_generation_run_before_gate'] is False
          assert payload['claim_boundary']['robust_support_run_before_gate'] is False
          PY

      - name: Draw replay confirmation identities only
        run: |
          python research/predeclare_geographic_framing_confirmation_cohort_v1.py \
            --output geographic-framing-confirmation-v1-cohort

      - name: Audit independence before replay outcomes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pandas as pd
          from pathlib import Path

          root = Path('geographic-framing-confirmation-v1-cohort')
          declared = pd.read_csv(root/'predeclared_taxon_region_pairs.csv')
          manifest = json.loads((root/'cohort_manifest.json').read_text(encoding='utf-8'))
          v3 = pd.read_csv('validation/geographic_framing_development_v3/predeclared_taxon_region_pairs.csv')
          v4 = pd.read_csv('validation/geographic_framing_development_v4/predeclared_taxon_region_pairs.csv')
          names = set(declared['scientific_name'].astype(str))
          assert len(declared) == 96
          assert declared['scientific_name'].nunique() == 96
          assert names.isdisjoint(set(v3['scientific_name'].astype(str)))
          assert names.isdisjoint(set(v4['scientific_name'].astype(str)))
          assert manifest['fresh_confirmation_cohort'] is True
          assert manifest['temporal_country_outcomes_inspected'] is False
          assert manifest['confirmation_outcomes_opened'] is False
          assert manifest['taxon_replacement_after_declaration_allowed'] is False
          assert manifest['candidate_generation_run'] is False
          assert manifest['robust_support_run'] is False
          assert manifest['taxon_group_counts'] == {'animal': 48, 'plant': 48}
          assert set(manifest['region_cell_counts'].values()) == {8}
          assert set(manifest['record_count_stratum_counts'].values()) == {24}
          manifest['identity_csv_sha256'] = hashlib.sha256((root/'predeclared_taxon_region_pairs.csv').read_bytes()).hexdigest()
          (root/'cohort_manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY

      - name: Upload replay cohort evidence
        uses: actions/upload-artifact@v4
        with:
          name: acsp-geographic-framing-confirmation-v1-cohort-replay
          path: geographic-framing-confirmation-v1-cohort/
          if-no-files-found: error
          retention-days: 30

  evaluate-confirmation:
    name: Manual replay - evaluate frozen country-registry confirmation
    needs: predeclare-confirmation-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP
        run: python -m pip install -e .

      - name: Download replay cohort from this run
        uses: actions/download-artifact@v4
        with:
          name: acsp-geographic-framing-confirmation-v1-cohort-replay
          path: frozen-confirmation-cohort

      - name: Re-evaluate temporal country outcomes for drift diagnosis only
        run: |
          python research/evaluate_geographic_framing_confirmation_v1.py \
            --sample-file frozen-confirmation-cohort/predeclared_taxon_region_pairs.csv \
            --output geographic-framing-confirmation-v1-results

      - name: Audit strict claim boundary
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path('geographic-framing-confirmation-v1-results')
          summary = json.loads((root/'country_registry_confirmation_v1_summary.json').read_text(encoding='utf-8'))
          taxa = pd.read_csv(root/'country_registry_confirmation_v1_taxon_diagnostics.csv')
          assert summary['status'] == 'fresh_country_registry_framing_confirmation_v1_complete'
          assert summary['protocol_fingerprint'] == '9f655f6121f1c917659dcf85ba039304b645ea88b5afff8d7855a11cf1e7a490'
          assert summary['taxa_in_yield_denominator'] == 96
          assert len(taxa) == 96
          assert summary['confirmation_taxon_replacement_allowed'] is False
          assert summary['candidate_generation_run'] is False
          assert summary['robust_support_run'] is False
          assert summary['country_representation_changed_after_v4_freeze'] is False
          assert summary['country_expansion_or_fallback_used'] is False
          assert summary['global_name_only_acsp_validated'] is False
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          print('Manual replay only: this result diagnoses GBIF drift and cannot replace authoritative run 32624041517.')
          PY

      - name: Upload replay result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsp-geographic-framing-confirmation-v1-results-replay
          path: geographic-framing-confirmation-v1-results/
          if-no-files-found: error
          retention-days: 30
