name: Public Cirsium portable detached component diagnostic v1

on:
  pull_request:
    paths:
      - "research/run_public_cirsium_portable_detached_component_diagnostic_v1.py"
      - "validation/public_cirsium_portable_detached_component_diagnostic_v1.json"
      - "acsp/discovery/broad_frames.py"
      - "acsp/discovery/components.py"
      - "acsp/discovery/providers/coastal_worldcover.py"
      - "acsp/discovery/providers/worldcover.py"
      - ".github/workflows/public-cirsium-portable-detached-component-diagnostic-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run frozen detached-component reachability diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
        run: |
          rm -rf /tmp/public-cirsium-portable-detached-component-v1
          python research/run_public_cirsium_portable_detached_component_diagnostic_v1.py \
            --out-dir /tmp/public-cirsium-portable-detached-component-v1
      - name: Guard aggregate public artifact
        run: |
          test ! -e /tmp/public-cirsium-portable-detached-component-v1/private_worldcover_component_crop.tif
          if head -n 1 /tmp/public-cirsium-portable-detached-component-v1/detached_component_reachability.csv | grep -E '(^|,)(latitude|longitude|decimalLatitude|decimalLongitude|occurrence_id|gbif_key)(,|$)'; then
            echo 'coordinate or occurrence identifier leaked into public detached diagnostic artifact'
            exit 1
          fi
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('/tmp/public-cirsium-portable-detached-component-v1')
          summary = json.loads((root / 'summary.json').read_text())
          table = pd.read_csv(root / 'detached_component_reachability.csv')
          assert summary['cohort_unit_id'] == 'CIR08'
          assert summary['validated_product_changed'] is False
          assert summary['new_confirmation_claim'] is False
          assert summary['replacement_or_precision_relaxation_used'] is False
          if summary['status'] == 'DEVELOPMENT_ONLY_DETACHED_COMPONENT_REACHABILITY_COMPLETE':
              assert summary['candidate_lanes_frozen_before_recent_scoring'] is True
              assert summary['ranking_or_fitted_selector_used'] is False
              assert set(table['lane_id']) == {
                  'LOCAL_2KM', 'LOCAL_5KM', 'DETACHED_SAME_COMPONENT',
                  'DETACHED_OTHER_COMPONENT', 'ANCHORED_COMPONENT_FULL',
                  'OTHER_COMPONENTS_FULL', 'BROAD_LAND_UNION'
              }
              assert set(table['recovery_radius_km']) == {0.25, 0.5, 1.0}
              assert len(table) == 7 * 3
          else:
              assert table.empty
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-cirsium-portable-detached-component-diagnostic-v1
          path: |
            /tmp/public-cirsium-portable-detached-component-v1/detached_component_reachability.csv
            /tmp/public-cirsium-portable-detached-component-v1/summary.json
          if-no-files-found: error
          retention-days: 90
