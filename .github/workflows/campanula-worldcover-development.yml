name: Campanula WorldCover development

on:
  workflow_dispatch:
  push:
    branches:
      - agent/campanula-discovery-development
    paths:
      - research/campanula_microterrain_discovery.py
      - research/campanula_worldcover_discovery.py
      - research/campanula_microenvironment_sources.json
      - .github/workflows/campanula-worldcover-development.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  worldcover-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP and geospatial development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install rasterio pyproj scipy

      - name: Download frozen Campanula development cache and GSI DEM artifacts
        uses: actions/download-artifact@v4
        with:
          name: campanula-development-data
          path: campanula-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31856717236

      - name: Download official ESA WorldCover 2021 v200 tile
        run: |
          set -euo pipefail
          mkdir -p public-layers
          curl --fail --location --retry 4 --retry-delay 3 \
            --output public-layers/ESA_WorldCover_10m_2021_v200_N33E138_Map.tif \
            https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N33E138_Map.tif
          test -s public-layers/ESA_WorldCover_10m_2021_v200_N33E138_Map.tif
          sha256sum public-layers/ESA_WorldCover_10m_2021_v200_N33E138_Map.tif | tee public-layers/worldcover_sha256.txt

      - name: Rebuild full-island microterrain universe without 2026 outcomes
        run: |
          python research/campanula_microterrain_discovery.py \
            --gbif campanula-source/field_validation/campanula_microdonta/development_data/gbif_training_occurrences_through_2025.csv \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --dem oshima=campanula-source/dem-artifacts/gsi_02d7024d473d0b2d.tif \
            --dem toshima=campanula-source/dem-artifacts/gsi_4867a2c26d122c44.tif \
            --dem niijima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem shikinejima=campanula-source/dem-artifacts/gsi_8de1699745175287.tif \
            --dem kozushima=campanula-source/dem-artifacts/gsi_4ea5609c14c17bd8.tif \
            --out microterrain-results

      - name: Run WorldCover microenvironment development experiment
        run: |
          python research/campanula_worldcover_discovery.py \
            --microterrain-universe microterrain-results/microterrain_universe.csv \
            --gbif-prototypes microterrain-results/gbif_microterrain_prototypes.csv \
            --worldcover public-layers/ESA_WorldCover_10m_2021_v200_N33E138_Map.tif \
            --detections campanula-source/field_validation/campanula_microdonta/development_data/detection_clusters.csv \
            --radius-km 1.0 \
            --random-iterations 2000 \
            --seed 20260815 \
            --out worldcover-results

      - name: Audit development boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          micro = json.loads(Path('microterrain-results/microterrain_report.json').read_text())
          world = json.loads(Path('worldcover-results/worldcover_report.json').read_text())
          assert micro['field_coordinates_used_by_generator'] is False
          assert world['field_coordinates_used_by_generator'] is False
          assert world['status'] == 'development_only'
          best = world.get('best')
          if best is not None:
              assert best['recovered'] == 19
              assert best['total'] == 19
          print(json.dumps({'microterrain': micro, 'worldcover_best': best}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: campanula-worldcover-development
          path: |
            public-layers/worldcover_sha256.txt
            microterrain-results/microterrain_report.json
            microterrain-results/gbif_microterrain_prototypes.csv
            worldcover-results/worldcover_report.json
            worldcover-results/worldcover_gbif_prototypes.csv
            worldcover-results/best_worldcover_candidates.csv
          if-no-files-found: error
          retention-days: 90
