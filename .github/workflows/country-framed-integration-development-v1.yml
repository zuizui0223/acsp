name: Country-framed robust integration development v1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "validation/acsp_country_framed_robust_integration_development_v1.json"
      - "validation/acsp_country_geometry_geoboundaries_v6_freeze_v1.json"
      - "validation/geographic_framing_development_v4/predeclared_taxon_region_pairs.csv"
      - "validation/geographic_framing_confirmation_v1/confirmation_taxa.csv"
      - "research/predeclare_country_framed_integration_development_v1.py"
      - "research/run_country_framed_integration_development_v1.py"
      - "research/test_country_framed_integration_development_v1.py"
      - "research/country_framed_robust_integration.py"
      - "research/geoboundaries_v6_provider.py"
      - ".github/workflows/country-framed-integration-development-v1.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  freeze-development-identities:
    name: Freeze 24 development taxon-country identities before outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP
        run: python -m pip install -e .

      - name: Verify preregistered integration contract before any declaration
        run: python -m unittest -v research/test_country_framed_integration_development_v1.py

      - name: Freeze development taxon-country identities using historical facets only
        run: |
          python research/predeclare_country_framed_integration_development_v1.py \
            --output country-framed-integration-development-v1-cohort

      - name: Audit pre-outcome identity artifact
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path('country-framed-integration-development-v1-cohort')
          manifest = json.loads((root/'cohort_manifest.json').read_text(encoding='utf-8'))
          pairs = pd.read_csv(root/'predeclared_taxon_country_pairs.csv')
          assert manifest['protocol_fingerprint'] == 'b35b1fee5dd899e800d2449d966266b15df8f4b8987fe3ddcf49c6e7884b092a'
          assert len(pairs) == 24
          assert pairs['speciesKey'].nunique() == 24
          assert manifest['declared_taxa'] == 24
          assert manifest['taxon_group_counts'] == {'animal': 12, 'plant': 12}
          assert manifest['record_count_stratum_counts'] == {'0': 6, '1': 6, '2': 6, '3': 6}
          assert manifest['recent_outcomes_inspected'] is False
          assert manifest['recent_occurrence_rows_fetched'] is False
          assert manifest['candidate_generation_run'] is False
          assert manifest['robust_support_run'] is False
          assert manifest['random_baseline_run'] is False
          assert manifest['confirmation_v1_taxa_consumed'] is False
          assert manifest['replacement_after_declaration_allowed'] is False
          assert manifest['country_expansion_or_fallback_used'] is False
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY

      - name: Upload frozen pre-outcome declarations
        uses: actions/upload-artifact@v4
        with:
          name: country-framed-integration-development-v1-cohort
          path: country-framed-integration-development-v1-cohort/
          if-no-files-found: error
          retention-days: 90

  evaluate-frozen-integration:
    name: Evaluate frozen country-framed robust integration
    needs: freeze-development-identities
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP
        run: python -m pip install -e .

      - name: Download already-frozen declarations from this run
        uses: actions/download-artifact@v4
        with:
          name: country-framed-integration-development-v1-cohort
          path: frozen-integration-cohort

      - name: Audit artifact still precedes integrated outcomes
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('frozen-integration-cohort')
          manifest = json.loads((root/'cohort_manifest.json').read_text(encoding='utf-8'))
          pairs = pd.read_csv(root/'predeclared_taxon_country_pairs.csv')
          assert len(pairs) == 24
          assert manifest['recent_outcomes_inspected'] is False
          assert manifest['candidate_generation_run'] is False
          assert manifest['robust_support_run'] is False
          assert manifest['replacement_after_declaration_allowed'] is False
          PY

      - name: Build frozen robust patches first, then open recent outcomes
        run: |
          python research/run_country_framed_integration_development_v1.py \
            --declarations frozen-integration-cohort/predeclared_taxon_country_pairs.csv \
            --output country-framed-integration-development-v1-results

      - name: Audit fixed endpoint and preserve favorable or unfavorable result
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path('country-framed-integration-development-v1-results')
          summary = json.loads((root/'development_summary.json').read_text(encoding='utf-8'))
          rows = pd.read_csv(root/'taxon_country_results.csv')
          assert summary['status'] == 'country_framed_robust_integration_development_v1_complete'
          assert summary['protocol_fingerprint'] == 'b35b1fee5dd899e800d2449d966266b15df8f4b8987fe3ddcf49c6e7884b092a'
          assert summary['declared_taxa'] == 24
          assert len(rows) == 24
          assert summary['primary_support_fraction'] == 0.025
          assert summary['primary_radius_km'] == 10.0
          assert summary['random_baseline_repetitions'] == 200
          assert summary['candidate_generation_preceded_recent_outcome_fetch'] is True
          assert summary['retuned_after_outcome_opening'] is False
          assert summary['country_representation_changed'] is False
          assert summary['country_geometry_provider_changed'] is False
          assert summary['robust_core_changed'] is False
          assert summary['confirmation_v1_taxa_consumed'] is False
          assert summary['development_only'] is True
          assert summary['global_candidate_generation_validated'] is False
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          if summary['development_gate_passed']:
              print('DEVELOPMENT GATE PASSED: freeze this integration instantiation before scaling to the remaining v4 development taxa; do not consume fresh confirmation taxa.')
          else:
              print('DEVELOPMENT GATE FAILED: preserve the rejection and do not retune provider, country rule, support fraction, surface size, 10 km endpoint, or random baseline on these 24 taxa.')
          PY

      - name: Upload integration development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-framed-integration-development-v1-results
          path: country-framed-integration-development-v1-results/
          if-no-files-found: error
          retention-days: 90
