name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .
      - name: Compile Python sources
        run: >-
          python -m py_compile
          gbif_fieldmap_builder_app.py
          acsp/__init__.py
          acsp/app.py
          acsp/automatic_sdm.py
          acsp/benchmarking.py
          acsp/claims.py
          acsp/cli.py
          acsp/comparator_benchmark.py
          acsp/comparator_export.py
          acsp/decision_baselines.py
          acsp/planning.py
          acsp/modeling.py
          acsp/practical_core.py
          acsp/sdm.py
          acsp/validated_core.py
          acsp_discover.py
          research/aggregate_sdm_topk_benchmark.py
          research/audit_random_validation_stability.py
          research/execute_sdm_topk_pair.py
          research/export_standard_baseline_folds.py
          research/predeclare_sdm_topk_cohort.py
          research/run_sdm_topk_pair.py
          research/run_standard_baseline_benchmark.py
          paper/build_paper_outputs.py
      - name: Run survey-tool tests
        run: python -m unittest discover -v
      - name: Run research pipeline tests
        run: python -m unittest discover -s research -t research -v
      - name: Build Python wheel
        run: python -m build --wheel
      - name: Verify wheel in an isolated environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          .wheel-venv/bin/python -m pip install dist/*.whl
          pushd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -I -c "import acsp; import acsp.cli; import acsp_discover; import gbif_fieldmap_builder_app; print('installed Python package and app imports successfully')"
          popd
      - name: Verify packaged app and recommendation commands
        run: |
          acsp-fieldmap --help
          acsp-recommend --help

  validation-stability:
    name: Frozen validation and paper-output audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Re-sample independent validation cohorts
        run: python research/audit_random_validation_stability.py | tee validation-stability.json
      - name: Build paper tables with secondary comparator snapshot
        run: |
          python paper/build_paper_outputs.py --output-dir paper-generated
          test -s paper-generated/table_1_retrospective_validation.csv
          test -s paper-generated/table_s1_seed_sensitivity.csv
          test -s paper-generated/table_s2_claim_matrix.csv
          test -s paper-generated/table_s3_standard_baseline_comparison.csv
          test -s paper-generated/validated_core_policies.json
          test -s paper-generated/standard_baseline_results_manifest.json
          test -s paper-generated/paper_output_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("paper-generated/paper_output_manifest.json").read_text())
          assert manifest["paper_scope"] == "pre_campanula_cross_taxon_retrospective"
          assert manifest["retrospective_status"] == "complete"
          assert manifest["method_comparator_status"] == "complete_secondary_predeclared_reconstruction"
          assert manifest["method_comparator_protocol_fingerprint"] == "23773fd0b94f69f96813eb00a49aba3cae25849de27b0dfb5f729a355d61fbce"
          assert manifest["field_data_read"] is False
          assert manifest["post_baseline_algorithms_read"] is False
          assert manifest["primary_recovery_radius_km"] == 10.0
          assert manifest["top_k"] == 5
          PY
      - name: Upload validation and paper outputs
        uses: actions/upload-artifact@v4
        with:
          name: validation-and-paper-outputs
          path: |
            validation-stability.json
            paper-generated
          if-no-files-found: error

  github-action:
    name: ACSP GitHub Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the local ACSP Action
        id: acsp
        uses: ./
        with:
          candidates-csv: examples/acsp-candidates.csv
          output-csv: action-smoke/recommended.csv
          summary-json: action-smoke/summary.json
          per-area: "3"
      - name: Confirm Action outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.acsp.outputs.recommended-csv }}"
          test -s "${{ steps.acsp.outputs.summary-json }}"
          test "${{ steps.acsp.outputs.selected-count }}" = "4"
          python - <<'PY'
          import pandas as pd
          zones = pd.read_csv("action-smoke/recommended.csv")
          required = {"zone_id", "zone_score", "zone_rank", "zone_member_count", "representative_site_id"}
          assert required.issubset(zones.columns), required - set(zones.columns)
          PY

  r:
    name: R package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-acsp
          extra-packages: any::rcmdcheck
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-acsp
