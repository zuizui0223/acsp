name: Japan plant broad-frame identity candidates v4

on:
  workflow_dispatch:

concurrency:
  group: japan-plant-broad-frame-identity-candidates-v4-replay-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify authoritative first activation is already pinned
        run: |
          python - <<'PY'
          import json
          r=json.load(open('validation/japan_plant_broad_frame_identity_receipt_v4.json'))
          assert r['status']=='IDENTITY_CANDIDATES_PINNED_PRE_FOCAL_HISTORICAL_QUERY'
          assert r['source_workflow_run_id']==34565100325
          assert r['source_artifact_id']==10186066547
          assert r['candidate_count']==96
          assert r['no_reselection_after_pin'] is True
          PY
      - name: Install package
        run: python -m pip install -e .
      - name: Test buffered identity-only boundary
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}
        run: python tests/test_japan_plant_broad_frame_identity_candidates_v4.py -v
      - name: Download prior provider-supply exclusion snapshot
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: zuizui0223/acsp
          run-id: 33031292325
          name: provider-eligible-observability-stage1-candidate-snapshot
          path: /tmp/prior-provider-supply
      - name: Replay 96 plant identity candidates for drift diagnosis only
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}
        run: |
          rm -rf /tmp/japan-plant-broad-v4-stage1-replay
          mkdir -p /tmp/japan-plant-broad-v4-stage1-replay
          python research/freeze_japan_plant_broad_frame_identity_candidates_v4.py \
            --prior-supply-snapshot /tmp/prior-provider-supply/candidate_snapshot.csv \
            --candidates-output /tmp/japan-plant-broad-v4-stage1-replay/identity_candidates.csv \
            --audit-output /tmp/japan-plant-broad-v4-stage1-replay/audit.json
      - name: Mark replay non-authoritative
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/japan-plant-broad-v4-stage1-replay/audit.json')
          a=json.loads(p.read_text())
          a['scientific_authority']='NON_AUTHORITATIVE_DRIFT_REPLAY'
          a['authoritative_source_workflow_run_id']=34565100325
          a['may_replace_authoritative_identity_set']=False
          p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan-plant-broad-frame-identity-candidates-v4-drift-replay
          path: /tmp/japan-plant-broad-v4-stage1-replay/
          if-no-files-found: error
          retention-days: 30
