name: Campanula development data cache

# Builds the Campanula microdonta DEVELOPMENT dataset on a runner, where GBIF and
# GSI are reachable, and commits the small artifacts so the development loop can
# run offline. This produces development data only: the 2026 field outcomes have
# already been inspected, so nothing here can serve as independent confirmation.

on:
  workflow_dispatch:
    inputs:
      gbif_cap:
        description: Maximum GBIF records to fetch
        required: false
        default: "2000"
      commit:
        description: Commit the refreshed cache back to the branch
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build the development cache
        run: |
          python research/cache_campanula_development_data.py \
            --gbif-cap "${{ inputs.gbif_cap }}" \
            --dem-out dem-artifacts

      - name: Confirm the cache is usable offline
        run: |
          set -euo pipefail
          test -s field_validation/campanula_microdonta/development_data/candidate_pool.csv
          test -s field_validation/campanula_microdonta/development_data/manifest.json
          python research/campanula_development_loop.py \
            --strategy local_topk --iterations 500 \
            --json-out development-loop-local-topk.json
          python research/campanula_development_loop.py \
            --strategy area_balanced --iterations 500 \
            --json-out development-loop-area-balanced.json

      - name: Upload cache, DEM mosaics, and loop results
        uses: actions/upload-artifact@v4
        with:
          name: campanula-development-data
          path: |
            field_validation/campanula_microdonta/development_data
            development-loop-*.json
            dem-artifacts
          if-no-files-found: error

      - name: Commit the refreshed cache
        if: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add field_validation/campanula_microdonta/development_data
          if git diff --cached --quiet; then
            echo "cache unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Refresh the Campanula development data cache

          Generated by the campanula-development-data workflow. Development data
          only: the 2026 field outcomes were already inspected, so this cannot
          serve as independent confirmation."
          git push origin "HEAD:${GITHUB_REF_NAME}"
