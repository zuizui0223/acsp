name: Future GBIF source snapshot integrity (synthetic only)

on:
  pull_request:
    paths:
      - 'research/freeze_prospective_gbif_search_source_v1.py'
      - 'tests/test_prospective_gbif_search_source_v1.py'
      - 'paper/PROSPECTIVE_GBIF_SOURCE_CAPTURE.md'
      - 'paper/SUBMISSION_READINESS.md'
      - '.github/workflows/acsp-prospective-gbif-source-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-future-source:
    name: Prospective raw source freeze — synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact bytes/ID attribution and public-private output separation
        run: |
          python -m unittest discover -s tests -p 'test_prospective_gbif_search_source_v1.py' -v
          python -m unittest discover -s tests -p 'test_candidate_original_gbif_folds.py' -v
          python paper/validate_submission_alignment.py
          python paper/validate_submission_packet.py
          python -m py_compile research/freeze_prospective_gbif_search_source_v1.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('research/freeze_prospective_gbif_search_source_v1.py')
          imports=set()
          for node in ast.walk(ast.parse(p.read_text(encoding="utf-8"))):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          assert not any(x.startswith(('requests','urllib.request','http.client','aiohttp')) for x in imports)
          s=p.read_text(encoding='utf-8')
          assert 'new-independent-cohort-only-not-2026-08-20' in s
          assert 'original_2026_august_96pair_source_recovered' in s
          print('Only synthetic data used; no provider fetch or old-source relabel.')
          PY
