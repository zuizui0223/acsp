name: Discovery package checks

on:
  pull_request:
    paths:
      - "acsp/discovery/**"
      - "acsp/structural_graph.py"
      - "acsp/structural_raw_adapters.py"
      - "acsp/structural_support.py"
      - "acsp/structural_selector.py"
      - "tests/test_discovery_package.py"
      - "pyproject.toml"
      - ".github/workflows/discovery-package-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run taxon-neutral discovery tests
        run: python tests/test_discovery_package.py -v
      - name: Verify validation-boundary imports
        run: |
          python - <<'PY'
          import sys
          import acsp
          assert 'acsp.discovery' not in sys.modules
          from acsp.validated_robust import VALIDATED_ROBUST_STATUS
          assert VALIDATED_ROBUST_STATUS == 'untouched_confirmation_passed'
          import acsp.discovery as discovery
          assert discovery.DISCOVERY_VALIDATION_STATUS == 'experimental_not_independently_validated'
          assert 'acsp.planning' not in sys.modules
          PY
