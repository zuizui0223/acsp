name: Validated clean-schema live smoke

on:
  pull_request:
    paths:
      - .github/workflows/validated-clean-schema-live-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Run merged species-only CLI against live services
        run: |
          mkdir -p smoke
          acsp-patches \
            --taxon "Castanopsis sieboldii" \
            --output smoke/candidate_patches.csv \
            --summary-json smoke/summary.json
      - name: Audit candidate-only schema and unchanged patch set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          summary = json.loads(Path('smoke/summary.json').read_text())
          patches = pd.read_csv('smoke/candidate_patches.csv')
          expected = [
              'candidate_patch_id',
              'survey_area_id',
              'latitude',
              'longitude',
              'support_cell_count',
              'candidate_patch_radius_m',
              'patch_merge_distance_m',
              'support_fraction',
              'validation_status',
              'validation_region_id',
              'validation_region_name',
              'validation_geographic_stratum',
          ]
          forbidden = {
              'zone_score', 'zone_rank', 'initial_rank', 'model_rank', 'rank_change',
              'observed_support_score', 'local_habitat_support_score',
              'model_support_score', 'access_support_score', 'agreement_score',
              'agreement_class', 'zone_evidence_summary', 'zone_score_method', 'site_id',
          }
          assert list(patches.columns) == expected, patches.columns.tolist()
          assert forbidden.isdisjoint(patches.columns)
          assert summary['input_mode'] == 'taxon_japan_validated_regions'
          assert summary['declared_region_count'] == 12
          assert summary['evaluated_region_count'] == 9
          assert summary['candidate_patch_count'] == 139 == len(patches)
          assert summary['validated_support_fraction'] == 0.025
          assert summary['validation_confirmation_pairs'] == 96
          assert summary['validation_confirmation_folds'] == 480
          assert summary['candidate_generation_only'] is True
          assert summary['routing_or_budget_optimization'] is False
          print(json.dumps({
              'rows': len(patches),
              'columns': patches.columns.tolist(),
              'evaluated_regions': summary['evaluated_region_count'],
              'skipped_regions': summary['skipped_region_count'],
          }, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-clean-schema-live-smoke
          path: smoke
          if-no-files-found: error
          retention-days: 30
