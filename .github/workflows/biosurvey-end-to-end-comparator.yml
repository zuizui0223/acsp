name: biosurvey end-to-end comparator

on:
  workflow_dispatch:
  push:
    branches:
      - agent/biosurvey-end-to-end-comparator
    paths:
      - benchmark_methods/biosurvey_end_to_end.R
      - benchmark_methods/test_biosurvey_end_to_end.R
      - .github/workflows/biosurvey-end-to-end-comparator.yml
  pull_request:
    paths:
      - benchmark_methods/biosurvey_end_to_end.R
      - benchmark_methods/test_biosurvey_end_to_end.R
      - .github/workflows/biosurvey-end-to-end-comparator.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install comparator bootstrap dependencies only
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::jsonlite
            any::terra
            any::sessioninfo
      - name: Install pinned biosurvey development version
        shell: bash
        run: |
          set -euo pipefail
          BIOSURVEY_COMMIT="035fbebf3d47f823fa55b41a56a74b35dc510753"
          BIOSURVEY_ARCHIVE="/tmp/biosurvey-${BIOSURVEY_COMMIT}.tar.gz"
          BIOSURVEY_UNPACK_ROOT="/tmp/biosurvey-src-${BIOSURVEY_COMMIT}"
          mkdir -p "${BIOSURVEY_UNPACK_ROOT}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${BIOSURVEY_ARCHIVE}" \
            "https://codeload.github.com/claununez/biosurvey/tar.gz/${BIOSURVEY_COMMIT}"
          tar -xzf "${BIOSURVEY_ARCHIVE}" -C "${BIOSURVEY_UNPACK_ROOT}" --strip-components=1
          test -f "${BIOSURVEY_UNPACK_ROOT}/DESCRIPTION"
          export BIOSURVEY_UNPACK_ROOT
          Rscript - <<'RSCRIPT'
          source_dir <- Sys.getenv("BIOSURVEY_UNPACK_ROOT")
          stopifnot(nzchar(source_dir), file.exists(file.path(source_dir, "DESCRIPTION")))
          desc <- read.dcf(file.path(source_dir, "DESCRIPTION"))
          stopifnot(identical(unname(desc[1, "Package"]), "biosurvey"))
          stopifnot(identical(unname(desc[1, "Version"]), "0.1.2"))
          remotes::install_deps(source_dir, dependencies = TRUE, upgrade = "never")
          remotes::install_local(source_dir, upgrade = "never", dependencies = FALSE)
          stopifnot(as.character(packageVersion("biosurvey")) == "0.1.2")
          RSCRIPT
      - name: Run end-to-end comparator smoke test
        run: Rscript benchmark_methods/test_biosurvey_end_to_end.R | tee biosurvey-comparator-test.log
      - name: Record pinned comparator provenance
        run: |
          Rscript - <<'RSCRIPT'
          writeLines(c(
            "biosurvey_repo=claununez/biosurvey",
            "biosurvey_commit=035fbebf3d47f823fa55b41a56a74b35dc510753",
            paste0("biosurvey_version=", as.character(packageVersion("biosurvey"))),
            paste0("terra_version=", as.character(packageVersion("terra"))),
            paste0("R=", paste(R.version$major, R.version$minor, sep = "."))
          ), "biosurvey-comparator-versions.txt")
          RSCRIPT
      - uses: actions/upload-artifact@v4
        with:
          name: biosurvey-end-to-end-smoke-test
          path: |
            biosurvey-comparator-test.log
            biosurvey-comparator-versions.txt
          if-no-files-found: error
          retention-days: 90
