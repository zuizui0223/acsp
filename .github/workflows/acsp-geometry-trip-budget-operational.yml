name: ACSP geometry trip-budget operational validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/microenvironment-generalization-development
      - "agent/operational-budget-*"
      - "agent/explicit-hub-day-*"
    paths:
      - validation/acsp_geometry_trip_budget_operational_protocol.json
      - research/prepare_acsp_geometry_trip_budget_layer.py
      - research/evaluate_acsp_geometry_trip_budget_island.py
      - research/aggregate_acsp_geometry_trip_budget.py
      - research/fast_max_coverage.py
      - research/run_acsp_cross_island_confirmation_island.py
      - acsp/coverage.py
      - acsp/operational_budget.py
      - acsp/trip_proxy.py
      - acsp/cli.py
      - acsp_discover.py
      - gbif_fieldmap_builder_app.py
      - .github/workflows/acsp-geometry-trip-budget-operational.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  island:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        island:
          - yakushima
          - amami_oshima
          - tsushima
          - sado
          - oki_dogo
          - shodoshima
          - tanegashima
          - iriomote
          - ishigaki
          - miyakojima
          - rishiri
          - okinawa_main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install operational dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install scipy pyproj rasterio
      - name: Prepare GSI land geometry
        run: |
          python research/prepare_acsp_geometry_trip_budget_layer.py \
            --protocol validation/acsp_geometry_trip_budget_operational_protocol.json \
            --island "${{ matrix.island }}" \
            --out "trip-layer/${{ matrix.island }}"
      - name: Evaluate field-day translation
        run: |
          python research/evaluate_acsp_geometry_trip_budget_island.py \
            --protocol validation/acsp_geometry_trip_budget_operational_protocol.json \
            --island "${{ matrix.island }}" \
            --dem "trip-layer/${{ matrix.island }}/dem.tif" \
            --layer-manifest "trip-layer/${{ matrix.island }}/layer_manifest.json" \
            --out "trip-results/${{ matrix.island }}"
      - name: Audit outcome-free boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          island=os.environ['ISLAND']
          p=Path('trip-results')/island/'island_summary.json'
          s=json.loads(p.read_text())
          assert s['protocol_fingerprint']=='6bd7c35e2e3de369088691ebe8861d0578f5933374895fe06cb390bfe9a4383f'
          assert s['taxon_occurrences_used'] is False
          assert s['taxon_outcomes_used'] is False
          assert s['environmental_support_modifier_used'] is False
          print(json.dumps(s, indent=2))
          PY
        env:
          ISLAND: ${{ matrix.island }}
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-geometry-trip-budget-${{ matrix.island }}
          path: trip-results/${{ matrix.island }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: island
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aggregation dependencies
        run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: acsp-geometry-trip-budget-*
          path: all-trip-results
      - name: Aggregate operational validation
        run: |
          python research/aggregate_acsp_geometry_trip_budget.py \
            --protocol validation/acsp_geometry_trip_budget_operational_protocol.json \
            --input all-trip-results \
            --out aggregate-trip-results
      - name: Audit aggregate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('aggregate-trip-results/geometry_trip_budget_summary.json').read_text())
          assert s['status']=='operational_geometry_trip_budget_complete'
          assert s['protocol_fingerprint']=='6bd7c35e2e3de369088691ebe8861d0578f5933374895fe06cb390bfe9a4383f'
          assert s['taxon_and_environment_modifier_free'] is True
          assert s['frozen_192_consumed'] is False
          print(json.dumps(s, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-geometry-trip-budget-operational-summary
          path: aggregate-trip-results/
          if-no-files-found: error
          retention-days: 90
