name: Fresh-SENTINEL v2 source replay integrity audit

on:
  pull_request:
    paths:
      - "research/audit_cirsium_fresh_sentinel_v2_source_replay.py"
      - "tests/test_cirsium_fresh_sentinel_v2_source_replay.py"
      - "validation/coverage_then_fine_structure_fresh_sentinel_v2_source_replay_gate_v1.json"
      - ".github/workflows/cirsium-fresh-sentinel-v2-source-replay-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test replay comparison and fail-closed source semantics
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_cirsium_fresh_sentinel_v2_source_replay.py
      - name: Fetch pinned pre-outcome coordinate-free receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for unit in CIR02 CIR06 CIR12 CIR13; do
            mkdir -p "/tmp/acsp-gsi-replay/original/${unit}" "/tmp/acsp-gsi-replay/replay/${unit}"
            gh run download 37647225829 --repo "${{ github.repository }}" \
              --name "cirsium-fresh-sentinel-v2-fixed-gsi-${unit}-receipt" \
              --dir "/tmp/acsp-gsi-replay/original/${unit}"
            gh run download 37705751756 --repo "${{ github.repository }}" \
              --name "cirsium-fresh-sentinel-v2-fixed-gsi-${unit}-receipt" \
              --dir "/tmp/acsp-gsi-replay/replay/${unit}"
          done
      - name: Reproduce frozen source and patch hash comparison
        run: |
          python research/audit_cirsium_fresh_sentinel_v2_source_replay.py \
            --original-dir /tmp/acsp-gsi-replay/original \
            --replay-dir /tmp/acsp-gsi-replay/replay \
            --out-json /tmp/acsp-gsi-replay/replay_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("/tmp/acsp-gsi-replay/replay_result.json").read_text())
          frozen=json.loads(Path("validation/coverage_then_fine_structure_fresh_sentinel_v2_source_replay_gate_v1.json").read_text())
          assert frozen["status"]=="FREEZE_REPLAY_DIAGNOSIS_NOT_SELECTOR_PROMOTION"
          assert actual["source_run_id"]==frozen["source_workflow_run"]
          assert actual["replay_run_id"]==frozen["replay_workflow_run"]
          assert actual["status"]==frozen["required_status"]
          for key,value in frozen["expected"].items():
              assert actual["summary"][key]==value,(key, actual["summary"][key], value)
          for unit in ("CIR02","CIR06","CIR12","CIR13"):
              assert actual["units"][unit]["source_counts_identical"] is True
              assert actual["units"][unit]["source_state_digest_identical"] is True
              assert actual["units"][unit]["gsi_attribution_categories_identical"] is True
          assert actual["claim_boundary"]["private_coordinates_opened"] is False
          assert actual["claim_boundary"]["prospective_field_outcomes_opened"] is False
          assert actual["claim_boundary"]["matching_patch_sha_rescues_upstream_reproducibility"] is False
          PY
      - name: Upload only public-safe replay comparison
        uses: actions/upload-artifact@v4
        with:
          name: cirsium-fresh-sentinel-v2-source-replay-public-receipt
          path: /tmp/acsp-gsi-replay/replay_result.json
          if-no-files-found: error
