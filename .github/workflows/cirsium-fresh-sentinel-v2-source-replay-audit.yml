name: Fresh-SENTINEL v2 source replay integrity audit

on:
  pull_request:
    paths:
      - "research/audit_cirsium_fresh_sentinel_v2_source_replay.py"
      - "research/audit_cirsium_fresh_sentinel_v2_chunk_logs.py"
      - "tests/test_cirsium_fresh_sentinel_v2_source_replay.py"
      - "tests/test_cirsium_fresh_sentinel_v2_chunk_logs.py"
      - "validation/coverage_then_fine_structure_fresh_sentinel_v2_source_replay_gate_v1.json"
      - ".github/workflows/cirsium-fresh-sentinel-v2-source-replay-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test replay comparison and fail-closed source semantics
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_cirsium_fresh_sentinel_v2_source_replay.py tests/test_cirsium_fresh_sentinel_v2_chunk_logs.py
      - name: Fetch pinned pre-outcome coordinate-free receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for unit in CIR02 CIR06 CIR12 CIR13; do
            mkdir -p "/tmp/acsp-gsi-replay/original/${unit}" "/tmp/acsp-gsi-replay/replay/${unit}"
            gh run download 37647225829 --repo "${{ github.repository }}" \
              --name "cirsium-fresh-sentinel-v2-fixed-gsi-${unit}-receipt" \
              --dir "/tmp/acsp-gsi-replay/original/${unit}"
            gh run download 37705751756 --repo "${{ github.repository }}" \
              --name "cirsium-fresh-sentinel-v2-fixed-gsi-${unit}-receipt" \
              --dir "/tmp/acsp-gsi-replay/replay/${unit}"
          done
      - name: Reproduce frozen source and patch hash comparison
        run: |
          python research/audit_cirsium_fresh_sentinel_v2_source_replay.py \
            --original-dir /tmp/acsp-gsi-replay/original \
            --replay-dir /tmp/acsp-gsi-replay/replay \
            --out-json /tmp/acsp-gsi-replay/replay_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("/tmp/acsp-gsi-replay/replay_result.json").read_text())
          frozen=json.loads(Path("validation/coverage_then_fine_structure_fresh_sentinel_v2_source_replay_gate_v1.json").read_text())
          assert frozen["status"]=="FREEZE_REPLAY_DIAGNOSIS_NOT_SELECTOR_PROMOTION"
          assert actual["source_run_id"]==frozen["source_workflow_run"]
          assert actual["replay_run_id"]==frozen["replay_workflow_run"]
          assert actual["status"]==frozen["required_status"]
          for key,value in frozen["expected"].items():
              assert actual["summary"][key]==value,(key, actual["summary"][key], value)
          for unit in ("CIR02","CIR06","CIR12","CIR13"):
              assert actual["units"][unit]["source_counts_identical"] is True
              assert actual["units"][unit]["source_state_digest_identical"] is True
              assert actual["units"][unit]["gsi_attribution_categories_identical"] is True
          assert actual["claim_boundary"]["private_coordinates_opened"] is False
          assert actual["claim_boundary"]["prospective_field_outcomes_opened"] is False
          assert actual["claim_boundary"]["matching_patch_sha_rescues_upstream_reproducibility"] is False
          PY
      - name: Fetch pinned original/replay terrain job logs without publishing logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/acsp-gsi-replay/job-logs
          gh api "repos/${{ github.repository }}/actions/jobs/112881046494/logs" > /tmp/acsp-gsi-replay/job-logs/CIR06_original.log
          gh api "repos/${{ github.repository }}/actions/jobs/113079588295/logs" > /tmp/acsp-gsi-replay/job-logs/CIR06_replay.log
          gh api "repos/${{ github.repository }}/actions/jobs/112881046755/logs" > /tmp/acsp-gsi-replay/job-logs/CIR13_original.log
          gh api "repos/${{ github.repository }}/actions/jobs/113079588247/logs" > /tmp/acsp-gsi-replay/job-logs/CIR13_replay.log
      - name: Audit unchanged source attribution and pinned software environment
        run: |
          python research/audit_cirsium_fresh_sentinel_v2_chunk_logs.py \
            --cir06-original-log /tmp/acsp-gsi-replay/job-logs/CIR06_original.log \
            --cir06-replay-log /tmp/acsp-gsi-replay/job-logs/CIR06_replay.log \
            --cir13-original-log /tmp/acsp-gsi-replay/job-logs/CIR13_original.log \
            --cir13-replay-log /tmp/acsp-gsi-replay/job-logs/CIR13_replay.log \
            --out-json /tmp/acsp-gsi-replay/chunk_log_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/acsp-gsi-replay/chunk_log_summary.json").read_text())
          frozen=json.loads(Path("validation/coverage_then_fine_structure_fresh_sentinel_v2_source_replay_gate_v1.json").read_text())["chunk_log_verification"]
          assert x["status"]=="CHUNK_METADATA_REPLAY_IDENTICAL_SOURCE_CONTENT_DRIFT_UNRESOLVED"
          for unit in ("CIR06", "CIR13"):
              v=x["units"][unit]
              assert v["original_job_id"]==frozen["expected_original_job_ids"][unit]
              assert v["replay_job_id"]==frozen["expected_replay_job_ids"][unit]
              assert v["chunk_count"]==frozen["expected_chunk_counts"][unit]
              assert v["matching_chunk_audit_count"]==frozen["expected_matching_chunk_counts"][unit]
              assert v["all_chunk_audits_identical"] is True
              assert v["installed_package_token_count"]==frozen["expected_installed_package_token_count"]
              assert v["installed_package_versions_identical"] is True
              assert v["original_runner_image_version"]==frozen["expected_runner_image_version"]
              assert v["runner_image_version_identical"] is True
          assert x["claim_boundary"]["source_mosaic_bytes_equal_verified"] is False
          assert x["claim_boundary"]["source_tile_png_bytes_equal_verified"] is False
          assert x["claim_boundary"]["prospective_field_outcomes_opened"] is False
          PY
      - name: Upload only public-safe replay comparison
        uses: actions/upload-artifact@v4
        with:
          name: cirsium-fresh-sentinel-v2-source-replay-public-receipt
          path: |
            /tmp/acsp-gsi-replay/replay_result.json
            /tmp/acsp-gsi-replay/chunk_log_summary.json
          if-no-files-found: error
