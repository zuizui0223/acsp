name: Freeze final ACSP Practical Rescue vNext2 router

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - validation/practical_rescue_vnext2_final_fit_trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install exact router runtime
        run: |
          python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0"
          python -m pip install -e .
      - name: Resolve passed router-development run from immutable trigger
        id: dev
        run: |
          set -euo pipefail
          value=$(tr -d '[:space:]' < validation/practical_rescue_vnext2_final_fit_trigger.txt)
          case "$value" in ''|*[!0-9]*) echo "trigger must contain one numeric router-development run ID" >&2; exit 1;; esac
          echo "run_id=$value" >> "$GITHUB_OUTPUT"
      - name: Download complete vNext2 router development artifact
        uses: actions/download-artifact@v4
        with:
          name: acsp-practical-rescue-vnext2-router-192-development
          path: router-development
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.dev.outputs.run_id }}
      - name: Fit transparent Ridge router only after all development gates pass
        run: |
          python fit_practical_rescue_router_final.py \
            --development-manifest router-development/development_manifest.json \
            --training-rows router-development/router_training_rows.csv \
            --fold-level router-development/fold_level_comparison.csv \
            --protocol validation/acsp_practical_rescue_vnext2_router_protocol.json \
            --output final-router
      - name: Audit frozen final-router contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("final-router/model_manifest.json").read_text())
          assert m["status"] == "final_vnext2_router_fitted_after_complete_development_gate"
          assert m["protocol_fingerprint"] == "988243d9acbb20b16fcf7ec307db8c3a5325c3abd7ba71835da5e9911bc0cad6"
          assert m["development_pairs"] == 192
          assert m["development_pairs_with_complete_folds"] == 180
          assert m["development_all_zero_pair_count"] == 12
          assert len(m["development_all_zero_pairs"]) == 12
          assert m["development_pairs_with_complete_folds"] + m["development_all_zero_pair_count"] == 192
          assert m["development_complete_folds"] == m["training_rows"] == 873
          assert m["development_scientific_zero_folds"] == 87
          assert m["decision_threshold_absolute_recall"] == 0.015
          assert m["ridge_alpha"] == 10.0
          assert m["confirmation_outcomes_used_for_fit"] is False
          assert m["hyperparameters_changed_after_development_gate"] is False
          assert m["new_untouched_confirmation_required"] is True
          print(json.dumps(m, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-practical-rescue-vnext2-final-router
          path: final-router
          if-no-files-found: error
          retention-days: 90
