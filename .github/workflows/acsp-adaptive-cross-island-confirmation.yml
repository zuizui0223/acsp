name: ACSP adaptive cross-island confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/microenvironment-generalization-development
    paths:
      - research/prepare_acsp_cross_island_public_layers.py
      - research/run_acsp_cross_island_confirmation_island.py
      - research/aggregate_acsp_cross_island_confirmation.py
      - research/acsp_training_domain_gate.py
      - research/fast_max_coverage.py
      - validation/acsp_adaptive_survey_method_freeze_v1.json
      - validation/acsp_adaptive_survey_cross_island_confirmation_execution_protocol.json
      - validation/acsp_adaptive_cross_island_confirmation_20260816/**
      - .github/workflows/acsp-adaptive-cross-island-confirmation.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  island:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        island:
          - yakushima
          - amami_oshima
          - tsushima
          - sado
          - oki_dogo
          - shodoshima
          - tanegashima
          - iriomote
          - ishigaki
          - miyakojima
          - rishiri
          - okinawa_main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install confirmation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install awscli scipy rasterio pyproj
      - name: Prepare frozen public layers
        run: |
          python research/prepare_acsp_cross_island_public_layers.py \
            --execution-protocol validation/acsp_adaptive_survey_cross_island_confirmation_execution_protocol.json \
            --cohort-protocol validation/acsp_adaptive_survey_cross_island_confirmation_cohort_protocol.json \
            --island '${{ matrix.island }}' \
            --out island-public
      - name: Run frozen island confirmation
        run: |
          python research/run_acsp_cross_island_confirmation_island.py \
            --execution-protocol validation/acsp_adaptive_survey_cross_island_confirmation_execution_protocol.json \
            --cohort validation/acsp_adaptive_cross_island_confirmation_20260816/predeclared_taxon_island_pairs.csv \
            --island '${{ matrix.island }}' \
            --dem island-public/dem.tif \
            --ndvi island-public/ndvi.tif \
            --layer-manifest island-public/layer_manifest.json \
            --out island-result
      - name: Audit frozen confirmation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('island-result/island_summary.json').read_text())
          assert s['execution_protocol_fingerprint']=='24a5cc0d21bcfd4fdfce5dc9b8ccbb2cd8dc1fc717928d8ed6775c79ef8591e1'
          assert s['method_freeze_fingerprint']=='1bff5eb8571928e9b26c193bc7bc0756f239b30def062ab49e0b94ed0c3029f0'
          assert s['outer_heldout_coordinates_used_during_selection'] is False
          assert s['retuning_performed'] is False
          assert s['frozen_192_consumed'] is False
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-adaptive-confirmation-${{ matrix.island }}
          path: |
            island-result/
            island-public/layer_manifest.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: island
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aggregation dependencies
        run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: acsp-adaptive-confirmation-*
          path: all-results
          merge-multiple: false
      - name: Aggregate frozen confirmation and robustness
        run: |
          python research/aggregate_acsp_cross_island_confirmation.py \
            --execution-protocol validation/acsp_adaptive_survey_cross_island_confirmation_execution_protocol.json \
            --cohort validation/acsp_adaptive_cross_island_confirmation_20260816/predeclared_taxon_island_pairs.csv \
            --results-root all-results \
            --out confirmation-result
      - name: Audit no-retuning result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('confirmation-result/confirmation_summary.json').read_text())
          assert s['execution_protocol_fingerprint']=='24a5cc0d21bcfd4fdfce5dc9b8ccbb2cd8dc1fc717928d8ed6775c79ef8591e1'
          assert s['method_freeze_fingerprint']=='1bff5eb8571928e9b26c193bc7bc0756f239b30def062ab49e0b94ed0c3029f0'
          assert s['retuning_performed'] is False
          assert s['frozen_192_consumed'] is False
          assert s['status']=='confirmation_complete'
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-adaptive-cross-island-confirmation-result
          path: confirmation-result/
          if-no-files-found: error
          retention-days: 90
