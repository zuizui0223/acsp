name: Original ACSP v2 descriptive heterogeneity audit

on:
  pull_request:
    paths:
      - 'research/describe_original_v2_patch_heterogeneity.py'
      - 'tests/test_original_v2_descriptive_heterogeneity.py'
      - 'validation/acsp_original_v2_descriptive_heterogeneity_20261028.json'
      - 'paper/ORIGINAL_V2_HETEROGENEITY_DESCRIPTIVE.md'
      - '.github/workflows/acsp-original-v2-heterogeneity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  descriptive-original-artifact:
    name: Descriptive 96-pair original result audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic numerical dependency
        run: python -m pip install numpy
      - name: Run focused boundary and provenance tests
        run: |
          python -m unittest discover -s tests -p 'test_original_v2_descriptive_heterogeneity.py' -v
          python -m unittest discover -s tests -p 'test_original_v2_result_archive_replay.py' -v
          python paper/validate_submission_alignment.py
          python -m py_compile research/describe_original_v2_patch_heterogeneity.py
      - name: Download EXACT original 2026-08-20 result ZIP (not new GBIF records)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/acsp-original-heterogeneity
          curl --fail --location --show-error --silent --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9396133154/zip" \
            --output /tmp/acsp-original-heterogeneity/original.zip
      - name: Verify every original byte and exact saved descriptive JSON
        run: |
          python research/describe_original_v2_patch_heterogeneity.py \
            --results-zip /tmp/acsp-original-heterogeneity/original.zip \
            --verify-saved validation/acsp_original_v2_descriptive_heterogeneity_20261028.json \
            > /tmp/acsp-original-heterogeneity/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/acsp-original-heterogeneity/report.json')
          data=json.loads(p.read_text())
          assert data["primary_10km"]["sign_counts"] == {"negative":25,"positive":54,"zero":17}
          assert data["regional_means_positive"] == 10 and data["regional_means_negative"] == 2
          assert data["science_boundary"]["new_gbif_queries_or_field_outcomes_used"] is False
          assert data["science_boundary"]["raw_original_gbif_occurrence_inputs_recovered"] is False
          print("Original ZIP source verified; posthoc descriptives match saved receipt.")
          PY
      - name: Upload only coordinate-free descriptive receipt
        uses: actions/upload-artifact@v4
        with:
          name: acsp-original-v2-heterogeneity-descriptive-receipt
          path: /tmp/acsp-original-heterogeneity/report.json
          if-no-files-found: error
          retention-days: 90
