name: ACSP Practical Rescue fully fresh corrected-GRTS-v2 confirmation

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - validation/practical_rescue_fresh_confirmation_run_trigger.txt

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      final_model_run_id: ${{ steps.trigger.outputs.final_model_run_id }}
      predeclaration_run_id: ${{ steps.trigger.outputs.predeclaration_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install preparation dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Resolve frozen artifact run IDs only
        id: trigger
        run: |
          set -euo pipefail
          trigger=validation/practical_rescue_fresh_confirmation_run_trigger.txt
          model=$(sed -n 's/^final_model_run_id=//p' "$trigger" | tr -d '[:space:]')
          cohort=$(sed -n 's/^predeclaration_run_id=//p' "$trigger" | tr -d '[:space:]')
          for value in "$model" "$cohort"; do
            case "$value" in ''|*[!0-9]*) echo "trigger run IDs must be numeric" >&2; exit 1;; esac
          done
          echo "final_model_run_id=$model" >> "$GITHUB_OUTPUT"
          echo "predeclaration_run_id=$cohort" >> "$GITHUB_OUTPUT"
      - name: Download frozen fresh predeclaration
        uses: actions/download-artifact@v4
        with:
          name: acsp-practical-rescue-fresh-confirmation-predeclaration
          path: predecl
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.trigger.outputs.predeclaration_run_id }}
      - name: Download frozen final model identity
        uses: actions/download-artifact@v4
        with:
          name: acsp-practical-rescue-final-72-model
          path: final-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.trigger.outputs.final_model_run_id }}
      - name: Require a model-bound untouched 192-pair corrected-GRTS-v2 cohort
        run: |
          set -euo pipefail
          cohort=$(find predecl -name predeclared_taxon_region_pairs.csv -print -quit)
          protocol=$(find predecl -name acsp_practical_rescue_fresh_confirmation_protocol.json -print -quit)
          model=$(find final-model -name practical_rescue_final_72.joblib -print -quit)
          manifest=$(find final-model -name model_manifest.json -print -quit)
          test -n "$cohort" && test -n "$protocol" && test -n "$model" && test -n "$manifest"
          COHORT="$cohort" PROTOCOL="$protocol" MODEL="$model" MANIFEST="$manifest" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          cohort = pd.read_csv(os.environ["COHORT"])
          protocol = json.loads(Path(os.environ["PROTOCOL"]).read_text())
          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text())
          assert len(cohort) == cohort["pair_id"].nunique() == cohort["scientific_name"].nunique() == 192
          assert set(cohort["pair_id"].astype(int)) == set(range(1, 193))
          assert protocol["protocol_id"] == "acsp-practical-rescue-fresh-confirmation-v2"
          assert protocol["status"] == "frozen_after_final_72_model_before_fresh_cohort_sampling_or_outcome_inspection"
          assert protocol["final_model"]["grts_development_protocol_fingerprint"] == "74fec14b44035e897072b022d82ea30c00b27ce1bb95c16a0e9a5578a3d3da7a"
          assert protocol["final_model"]["model_sha256"] == sha(os.environ["MODEL"])
          assert manifest["model_sha256"] == sha(os.environ["MODEL"])
          assert protocol["official_grts"]["replacement_sites_requested"] == 3
          assert protocol["official_grts"]["replacement_sites_effective_rule"] == "min(replacement_sites_requested, max(candidate_frame_rows - n_base, 0))"
          assert protocol["missing_pair_artifacts_scored_as_zero"] is False
          assert protocol["no_retuning_after_confirmation_outcome"] is True
          PY
      - name: Build immutable 192-pair matrix
        id: matrix
        run: |
          cohort=$(find predecl -name predeclared_taxon_region_pairs.csv -print -quit)
          COHORT="$cohort" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pandas as pd
          cohort = pd.read_csv(os.environ["COHORT"])
          matrix = [{"pair_id": int(value)} for value in cohort["pair_id"].astype(int).sort_values()]
          print("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")))
          PY

  pair:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install exact frozen Python runtime
        run: |
          python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0" joblib
          python -m pip install -e .
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install only official GRTS hard dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
            any::survey
            any::boot
            any::crossdes
            any::deldir
            any::lme4
            any::sampling
            any::units
      - name: Install pinned official spsurvey 5.6.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            -o /tmp/spsurvey-5.6.1.tar.gz \
            https://codeload.github.com/USEPA/spsurvey/tar.gz/0914fcd071713fdab19f43d8d9a66436830bd917
          R CMD INSTALL /tmp/spsurvey-5.6.1.tar.gz
          Rscript - <<'RSCRIPT'
          stopifnot(as.character(packageVersion("spsurvey")) == "5.6.1")
          RSCRIPT
      - name: Verify corrected sparse-frame GRTS behavior
        run: Rscript benchmark_methods/test_grts_rescue_primary_batch_v2.R
      - name: Download frozen fresh predeclaration
        uses: actions/download-artifact@v4
        with:
          name: acsp-practical-rescue-fresh-confirmation-predeclaration
          path: predecl
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.predeclaration_run_id }}
      - name: Download frozen final rescue model
        uses: actions/download-artifact@v4
        with:
          name: acsp-practical-rescue-final-72-model
          path: final-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.final_model_run_id }}
      - name: Execute one frozen fresh pair against corrected GRTS v2
        id: execute
        continue-on-error: true
        run: |
          set -euo pipefail
          cohort=$(find predecl -name predeclared_taxon_region_pairs.csv -print -quit)
          protocol=$(find predecl -name acsp_practical_rescue_fresh_confirmation_protocol.json -print -quit)
          model=$(find final-model -name practical_rescue_final_72.joblib -print -quit)
          manifest=$(find final-model -name model_manifest.json -print -quit)
          python run_practical_rescue_fresh_confirmation_pair_v2.py \
            --pair-id ${{ matrix.pair_id }} \
            --cohort "$cohort" \
            --model "$model" \
            --model-manifest "$manifest" \
            --protocol "$protocol" \
            --output practical-rescue-fresh-pairs
      - name: Preserve infrastructure failure without manufacturing scientific zero
        if: steps.execute.outcome != 'success'
        run: |
          root=practical-rescue-fresh-pairs/pair_$(printf '%03d' ${{ matrix.pair_id }})
          mkdir -p "$root"
          PAIR_ID=${{ matrix.pair_id }} ROOT="$root" python - <<'PY'
          import json, os
          from pathlib import Path
          marker = {
              "pair_id": int(os.environ["PAIR_ID"]),
              "status": "unexpected_infrastructure_failure",
              "verified_scientific_artifact": False,
              "scientific_zero_created": False,
              "taxon_replacement_allowed": False,
          }
          Path(os.environ["ROOT"], "infrastructure_failure.json").write_text(json.dumps(marker, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-rescue-fresh-pair-${{ matrix.pair_id }}
          path: practical-rescue-fresh-pairs/pair_*
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [prepare, pair]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install exact aggregation runtime
        run: python -m pip install "numpy==2.3.5" "pandas==2.2.3"
      - name: Download frozen fresh predeclaration
        uses: actions/download-artifact@v4
        with:
          name: acsp-practical-rescue-fresh-confirmation-predeclaration
          path: predecl
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.predeclaration_run_id }}
      - name: Download every declared pair artifact
        uses: actions/download-artifact@v4
        with:
          pattern: practical-rescue-fresh-pair-*
          path: pair-artifacts
          merge-multiple: true
      - name: Strictly aggregate without zero-filling missing artifacts
        run: |
          cohort=$(find predecl -name predeclared_taxon_region_pairs.csv -print -quit)
          protocol=$(find predecl -name acsp_practical_rescue_fresh_confirmation_protocol.json -print -quit)
          python aggregate_practical_rescue_fresh_confirmation.py \
            --cohort "$cohort" \
            --pair-root pair-artifacts \
            --protocol "$protocol" \
            --output practical-rescue-fresh-confirmation-aggregate
      - name: Require complete confirmation manifest without conditioning CI on promotion outcome
        run: |
          test -s practical-rescue-fresh-confirmation-aggregate/confirmation_manifest.json
          test -s practical-rescue-fresh-confirmation-aggregate/pair_level_comparison.csv
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("practical-rescue-fresh-confirmation-aggregate/confirmation_manifest.json").read_text())
          assert m["declared_pairs"] == m["verified_pair_artifacts"] == 192
          assert m["missing_pair_artifacts_scored_as_zero"] is False
          assert m["outcomes_available_to_rescue_selector"] is False
          assert m["outcomes_available_to_grts_selector"] is False
          assert m["no_retuning_after_confirmation_outcome"] is True
          print(json.dumps(m, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acsp-practical-rescue-fresh-confirmation-aggregate
          path: practical-rescue-fresh-confirmation-aggregate
          if-no-files-found: error
          retention-days: 90
