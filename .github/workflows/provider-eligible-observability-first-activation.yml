name: Provider-eligible observability first activation

# This workflow is intentionally dormant until the dedicated first-activation
# marker is created on main. No PR, schedule, dispatch, or cron trigger exists.
on:
  push:
    branches: [main]
    paths:
      - validation/activate_provider_eligible_observability_first_v1.marker

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Verify exact first-activation marker before any provider call
        env:
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import predeclare_provider_eligible_observability_confirmation as prereg

          marker_path = "validation/activate_provider_eligible_observability_first_v1.marker"
          assert os.environ["RUN_NUMBER"] == "1", "only workflow run_number 1 is scientific"
          assert os.environ["EVENT_NAME"] == "push"
          assert os.environ["REF_NAME"] == "refs/heads/main"
          observed = prereg.validate_static_preregistration()
          assert observed == {
              "protocol_fingerprint": "4afd35c96178934f33f1e1336871df59972ffc6f487c6f11b9abedd690ea442d",
              "execution_contract_fingerprint": "f17ccb3308baad021ce95ccf24bfe3ded782f4286469d82bfd1c3fc9f9f867ac",
              "coverage_contract_fingerprint": "377f6374e077cc38ea7fc026de6dc289abc2716aca8c83d66ddcd42826139520",
              "exclusion_provenance_fingerprint": "b4dba265e33ec716e5451de8bb18eaf4e3647e66ccb29aa089644fca2e74d52b",
          }
          marker = Path(marker_path).read_text(encoding="utf-8")
          for token in (
              "issue=169",
              "activation=first_preheldout_freeze",
              "protocol_fingerprint=4afd35c96178934f33f1e1336871df59972ffc6f487c6f11b9abedd690ea442d",
              "execution_contract_fingerprint=f17ccb3308baad021ce95ccf24bfe3ded782f4286469d82bfd1c3fc9f9f867ac",
              "coverage_contract_fingerprint=377f6374e077cc38ea7fc026de6dc289abc2716aca8c83d66ddcd42826139520",
              "exclusion_provenance_fingerprint=b4dba265e33ec716e5451de8bb18eaf4e3647e66ccb29aa089644fca2e74d52b",
              "preregistration_merge_commit=91ff432e3da7cf3b26efa16a5c60219715feff89",
              "identities_opened_before_activation=false",
              "focal_species_historical_facets_opened_before_activation=false",
              "heldout_outcomes_opened_before_activation=false",
              "outcome_driven_tuning=false",
          ):
              assert token in marker, f"first-activation marker drift: {token}"

          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          assert changed == [marker_path], f"activation commit must change marker only: {changed}"
          execution = prereg.execution_contract()
          first = execution["first_activation_workflow_contract"]
          assert first["workflow_must_not_have_pull_request_trigger"] is True
          assert first["workflow_must_not_have_schedule_trigger"] is True
          assert first["workflow_dispatch_allowed"] is False
          assert first["no_cron_fallback"] is True
          assert execution["first_activation_failure_semantics"]["new_seed_or_replacement_after_abort_allowed"] is False
          assert execution["first_activation_failure_semantics"]["second_activation_after_abort_allowed"] is False
          PY

  stage1-candidate-snapshot:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Freeze complete discovery candidate snapshot only
        run: |
          python research/run_provider_eligible_observability_first_activation.py stage1 \
            --output-dir first-activation/stage1
      - name: Upload exact stage-1 snapshot or abort manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-eligible-observability-stage1-candidate-snapshot
          path: first-activation/stage1/
          if-no-files-found: error
          retention-days: 90

  stage2-historical-eligibility:
    needs: stage1-candidate-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: provider-eligible-observability-stage1-candidate-snapshot
          path: input/stage1
      - name: Freeze complete historical/provider eligibility audit
        run: |
          python research/run_provider_eligible_observability_first_activation.py stage2 \
            --stage1-dir input/stage1 \
            --output-dir first-activation/stage2
      - name: Upload exact stage-2 snapshot or abort audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-eligible-observability-stage2-eligibility
          path: first-activation/stage2/
          if-no-files-found: error
          retention-days: 90

  stage3-offline-final-selection:
    needs: stage2-historical-eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: provider-eligible-observability-stage2-eligibility
          path: input/stage2
      - name: Select final 96 offline from exact complete eligibility bytes
        run: |
          python research/run_provider_eligible_observability_first_activation.py stage3 \
            --stage2-dir input/stage2 \
            --output-dir first-activation/stage3
      - name: Upload exact stage-3 selection or abort manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-eligible-observability-stage3-final-selection
          path: first-activation/stage3/
          if-no-files-found: error
          retention-days: 90

  stage4-pinned-geometry:
    needs: stage3-offline-final-selection
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: provider-eligible-observability-stage3-final-selection
          path: input/stage3
      - name: Freeze pinned geometry for the already-selected 96 without replacement
        run: |
          python research/run_provider_eligible_observability_first_activation.py stage4 \
            --stage3-dir input/stage3 \
            --output-dir first-activation/stage4
      - name: Upload exact stage-4 geometry freeze or abort audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-eligible-observability-stage4-geometry
          path: first-activation/stage4/
          if-no-files-found: error
          retention-days: 90

  stage5-authoritative-publish:
    needs: stage4-pinned-geometry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACSP
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: provider-eligible-observability-stage1-candidate-snapshot
          path: input/stage1
      - uses: actions/download-artifact@v4
        with:
          name: provider-eligible-observability-stage2-eligibility
          path: input/stage2
      - uses: actions/download-artifact@v4
        with:
          name: provider-eligible-observability-stage3-final-selection
          path: input/stage3
      - uses: actions/download-artifact@v4
        with:
          name: provider-eligible-observability-stage4-geometry
          path: input/stage4
      - name: Bind all exact stage bytes into authoritative first-activation object
        run: |
          python research/run_provider_eligible_observability_first_activation.py stage5 \
            --stage1-dir input/stage1 \
            --stage2-dir input/stage2 \
            --stage3-dir input/stage3 \
            --stage4-dir input/stage4 \
            --output-dir first-activation/authoritative
      - name: Verify authoritative object remains exactly pre-heldout
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path
          import pandas as pd
          import predeclare_provider_eligible_observability_confirmation as prereg
          from geoboundaries_v6_coverage_contract import require_supported_alpha2
          from geoboundaries_v6_provider import GEOBOUNDARIES_RELEASE_COMMIT, GEOBOUNDARIES_SOURCE_ID
          import run_provider_eligible_observability_first_activation as run

          root = Path("first-activation/authoritative")
          frames_path = root / run.FINAL_FRAMES_CSV
          audit_path = root / run.FINAL_AUDIT_CSV
          candidates_path = root / run.FINAL_CANDIDATES_CSV
          manifest_path = root / run.FINAL_MANIFEST
          frames = pd.read_csv(frames_path)
          audit = pd.read_csv(audit_path)
          candidates = pd.read_csv(candidates_path)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          cfg = prereg.protocol()

          assert manifest["status"] == "provider_eligible_observability_96_frames_frozen_before_heldout"
          assert manifest["protocol_fingerprint"] == "4afd35c96178934f33f1e1336871df59972ffc6f487c6f11b9abedd690ea442d"
          assert manifest["execution_contract_fingerprint"] == "f17ccb3308baad021ce95ccf24bfe3ded782f4286469d82bfd1c3fc9f9f867ac"
          assert manifest["coverage_contract_fingerprint"] == "377f6374e077cc38ea7fc026de6dc289abc2716aca8c83d66ddcd42826139520"
          assert manifest["exclusion_provenance_fingerprint"] == "b4dba265e33ec716e5451de8bb18eaf4e3647e66ccb29aa089644fca2e74d52b"
          assert manifest["preregistration_merge_commit"] == "91ff432e3da7cf3b26efa16a5c60219715feff89"
          assert len(frames) == 96
          assert frames["speciesKey"].nunique() == 96
          assert frames["scientific_name"].nunique() == 96
          assert frames["taxon_group"].value_counts().to_dict() == {"plant": 48, "animal": 48}
          for group in ("plant", "animal"):
              counts = (
                  frames.loc[frames["taxon_group"].eq(group), "record_count_stratum"]
                  .astype(int).value_counts().sort_index().to_dict()
              )
              assert counts == {0: 12, 1: 12, 2: 12, 3: 12}
          per_cell = frames.groupby(["region_cell_index", "taxon_group"]).size()
          assert len(per_cell) == 24 and (per_cell == 4).all()
          assert frames["provider_eligible"].astype(bool).all()
          assert frames["eligibility_status"].eq("provider_eligible_before_final_selection").all()
          assert (frames["historical_selected_country_count"].astype(int) >= 5).all()

          excluded_keys, excluded_names = run.consumed_exclusion_sets()
          assert not (set(frames["speciesKey"].astype(int)) & excluded_keys)
          assert not (set(frames["scientific_name"].astype(str)) & excluded_names)

          for row in frames.itertuples(index=False):
              assert require_supported_alpha2(str(row.selected_country_code)) == str(row.selected_country_alpha3)
              assert math.isclose(
                  float(row.country_frame_observability_score),
                  math.log1p(int(row.historical_selected_country_count)),
                  rel_tol=0.0,
                  abs_tol=1e-12,
              )
              assert str(row.geometry_source_id) == GEOBOUNDARIES_SOURCE_ID
              assert GEOBOUNDARIES_RELEASE_COMMIT in str(row.geometry_source_version)
              digest = str(row.geometry_canonical_sha256)
              assert len(digest) == 64 and all(c in "0123456789abcdef" for c in digest)

          assert len(audit) == len(candidates)
          assert not audit["eligibility_status"].eq("historical_provider_error_abort").any()
          selected_keys = set(frames["speciesKey"].astype(int))
          assert selected_keys.issubset(set(audit["speciesKey"].astype(int)))

          forbidden_tokens = (
              "recent_count", "recent_records", "temporal_outcome", "candidate_patch",
              "robust", "random_recall", "recall", "lift", "auc",
          )
          for column in list(frames.columns) + list(audit.columns) + list(candidates.columns):
              lowered = str(column).lower()
              assert not any(token in lowered for token in forbidden_tokens), column

          assert manifest["frames_csv_sha256"] == hashlib.sha256(frames_path.read_bytes()).hexdigest()
          assert manifest["candidate_snapshot_sha256"] == hashlib.sha256(candidates_path.read_bytes()).hexdigest()
          assert manifest["eligibility_audit_sha256"] == hashlib.sha256(audit_path.read_bytes()).hexdigest()
          assert manifest["heldout_2021_2025_opened"] is False
          assert manifest["heldout_opened"] is False
          assert manifest["candidate_generation_run"] is False
          assert manifest["robust_support_run"] is False
          assert manifest["random_baseline_run"] is False
          assert manifest["recall_or_lift_read"] is False
          assert manifest["score_cutoff_selected"] is False
          assert manifest["outcome_driven_tuning"] is False
          assert manifest["replacement_after_final_selection_allowed"] is False
          assert manifest["country_substitution_allowed"] is False
          assert manifest["alternate_geometry_provider_allowed"] is False
          assert cfg["execution"]["second_activation"]["required_after_exact_complete_first_activation_artifact"] is True
          PY
      - name: Upload authoritative first-activation cohort
        uses: actions/upload-artifact@v4
        with:
          name: provider-eligible-observability-first-activation-cohort
          path: first-activation/authoritative/
          if-no-files-found: error
          retention-days: 90
