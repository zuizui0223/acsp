name: Describe ACSP-SDM decision differences

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/sdm-decision-differences-31238895064
    paths:
      - .benchmark-triggers/sdm-decision-differences-31238895064.txt
      - .github/workflows/sdm-decision-differences.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Download recovered frozen pair artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdm-topk-recovered-pair-*
          path: recovered_pairs
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31238895064
      - name: Build outcome-free decision differentiation tables
        run: |
          python research/summarize_sdm_decision_differences.py \
            --pair-root recovered_pairs \
            --output sdm_decision_differences
      - name: Validate diagnostic inventory
        run: |
          test -s sdm_decision_differences/fold_decision_differences.csv
          test -s sdm_decision_differences/pair_decision_differences.csv
          test -s sdm_decision_differences/decision_difference_summary.csv
          test -s sdm_decision_differences/decision_difference_manifest.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path("sdm_decision_differences")
          manifest = json.loads((root / "decision_difference_manifest.json").read_text())
          folds = pd.read_csv(root / "fold_decision_differences.csv")
          assert manifest["pair_artifacts_seen"] == 24
          assert manifest["folds_seen"] == 120
          assert len(folds) == 120
          assert "heldout_recall" not in folds.columns
          assert "jaccard_overlap" in folds.columns
          assert "local_sdm_rank_spearman" in folds.columns
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdm-decision-differences
          path: sdm_decision_differences
          if-no-files-found: error
          retention-days: 90
