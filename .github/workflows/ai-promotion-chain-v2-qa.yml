name: Corrected GRTS v2 promotion chain QA

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - .github/workflows/ai-promotion-chain-v2-qa.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/practical-coverage-v3-development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install exact rescue runtime and YAML validator
        run: |
          python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0" joblib pyyaml
          python -m pip install -e .
      - name: Run corrected promotion-chain tests in isolated processes
        run: |
          python -m unittest -v test_practical_rescue_promotion_chain_v2.py
          python -m unittest -v test_practical_rescue_grts_development_v2.py
          python -m unittest -v test_practical_rescue_fresh_confirmation.py
          python -m unittest -v test_practical_rescue_fresh_protocol.py
          python -m unittest -v test_practical_rescue_fresh_exclusions.py
      - name: Compile operational and promotion entry points
        run: |
          python -m py_compile \
            gbif_fieldmap_builder_app.py \
            fit_practical_rescue_final_model.py \
            fit_practical_rescue_final_model_v2.py \
            freeze_practical_rescue_fresh_confirmation_protocol.py \
            freeze_practical_rescue_fresh_confirmation_protocol_v2.py \
            predeclare_practical_rescue_fresh_confirmation_cohort.py \
            run_practical_rescue_fresh_confirmation_pair.py \
            run_practical_rescue_fresh_confirmation_pair_v2.py \
            aggregate_practical_rescue_fresh_confirmation.py
      - name: Parse promotion workflows as YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in [
              ".github/workflows/practical-rescue-final-refit.yml",
              ".github/workflows/practical-rescue-fresh-confirmation-freeze.yml",
              ".github/workflows/practical-rescue-fresh-confirmation.yml",
          ]:
              payload = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              assert isinstance(payload, dict) and "jobs" in payload, name
              print(name, sorted(payload["jobs"]))
          PY
      - name: Record corrected v2 promotion-chain change
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG_AI.md")
          text = path.read_text(encoding="utf-8")
          marker = "# AI Change Log\n\n"
          heading = "## 2026-08-12 - GPT-5.6 Sol (OpenAI) - Corrected GRTS v2 promotion chain"
          if heading not in text:
              lines = [
                  heading,
                  "",
                  "Changed files:",
                  "- `validation/acsp_practical_rescue_grts_development_protocol_v2.json`",
                  "- `benchmark_methods/grts_rescue_primary_batch_v2.R`",
                  "- `benchmark_methods/test_grts_rescue_primary_batch_v2.R`",
                  "- `benchmark_practical_rescue_grts_pair_v2.py`",
                  "- `aggregate_practical_rescue_grts_development_v2.py`",
                  "- `fit_practical_rescue_final_model_v2.py`",
                  "- `freeze_practical_rescue_fresh_confirmation_protocol_v2.py`",
                  "- `run_practical_rescue_fresh_confirmation_pair_v2.py`",
                  "- promotion-chain workflows and v2 tests",
                  "",
                  "Summary:",
                  "- Pre-outcome candidate-frame auditing showed that v1 fixed diagnostic oversample n=3 could invalidate an otherwise feasible primary GRTS Top-5 sample when fewer than three spare candidate rows remained.",
                  "- Froze corrected strong-comparator v2 fingerprint `74fec14b44035e897072b022d82ea30c00b27ce1bb95c16a0e9a5578a3d3da7a` before evaluating v2 outcomes. Requested replacements remain three; effective diagnostic replacements are capped by rows remaining after the primary base sample.",
                  "- Rescue features, estimator, hyperparameters, 10-km estimand, Top-5 primary sample, 50 GRTS draws/fold, seeds, and the >=0.015/CI/sign-flip gate are unchanged.",
                  "- v1 results remain audit evidence only and are not promotion-eligible because diagnostic oversample infeasibility weakened the comparator.",
                  "- Final refit, fresh protocol freeze, and fresh 192-pair confirmation are now bound through thin wrappers to corrected GRTS v2; no fresh outcome is used in those bindings.",
                  "",
                  "",
              ]
              if not text.startswith(marker):
                  raise SystemExit("unexpected CHANGELOG_AI.md header")
              path.write_text(marker + "\n".join(lines) + text[len(marker):], encoding="utf-8")
          PY
      - name: Commit changelog and remove one-shot QA workflow
        run: |
          git rm .github/workflows/ai-promotion-chain-v2-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG_AI.md
          git commit -m "Record corrected GRTS v2 promotion chain"
          git push origin HEAD:agent/practical-coverage-v3-development
