name: Japan plant v4 temporal region stability diagnostic

on:
  push:
    paths:
      - "validation/activate_japan_plant_v4_temporal_region_stability_diagnostic.marker"
  workflow_dispatch:

concurrency:
  group: japan-plant-v4-temporal-region-stability-diagnostic-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Test diagnostic mechanics and frozen cohort
        run: python -m unittest -v tests/test_japan_plant_v4_temporal_region_stability.py
      - name: Run post-hoc temporal region stability diagnosis
        run: |
          mkdir -p temporal-region-diagnostic
          python research/diagnose_japan_plant_v4_temporal_region_stability.py \
            --out-dir temporal-region-diagnostic
      - name: Verify diagnostic boundary and public-safe outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('temporal-region-diagnostic/summary.json').read_text(encoding='utf-8'))
          assert summary['status'] == 'POSTHOC_DIAGNOSTIC_COMPLETE_NO_CONFIRMATORY_RESCORING'
          assert summary['taxa'] == 24
          assert summary['terminal_203_decision_changed'] is False
          assert summary['candidate_frames_rescored'] is False
          assert summary['same_cohort_retuned'] is False
          for path in Path('temporal-region-diagnostic').glob('*'):
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8').lower()
              for token in ('latitude', 'longitude', 'occurrence_id'):
                  assert token not in text, (path, token)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan-plant-v4-temporal-region-stability-diagnostic
          path: temporal-region-diagnostic/
          if-no-files-found: error
          retention-days: 90
