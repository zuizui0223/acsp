name: Predeclare SDM Top-k comparator cohort

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/sdm-topk-cohort-predeclare
    paths:
      - .github/workflows/predeclare-sdm-topk-cohort.yml
      - validation/sdm_topk_protocol.json
      - predeclare_sdm_topk_cohort.py
      - benchmark_general_random_taxa_regions.py

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ACSP
        run: python -m pip install -e .
      - name: Draw untouched taxon-region cohort only
        run: |
          python predeclare_sdm_topk_cohort.py \
            --protocol validation/sdm_topk_protocol.json \
            --output sdm_topk_cohort_predeclare
      - name: Verify no outcomes were generated
        run: |
          test -s sdm_topk_cohort_predeclare/predeclared_taxon_region_pairs.csv
          test -s sdm_topk_cohort_predeclare/excluded_taxa.csv
          test -s sdm_topk_cohort_predeclare/cohort_manifest.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path("sdm_topk_cohort_predeclare")
          manifest = json.loads((root / "cohort_manifest.json").read_text())
          sample = pd.read_csv(root / "predeclared_taxon_region_pairs.csv")
          declared = sample[sample["status"].eq("predeclared")]
          assert manifest["status"] == "ready"
          assert manifest["protocol_fingerprint"] == "12a53c8bdf2493038809d6a1021a7dcf2ee7c07ea891ad5b0862d2ee2813f7b2"
          assert manifest["declared_pairs_obtained"] == 24
          assert manifest["outcomes_inspected"] is False
          assert manifest["candidate_generation_run"] is False
          assert manifest["sdm_fitting_run"] is False
          assert manifest["heldout_recovery_run"] is False
          assert declared["scientific_name"].nunique() == 24
          assert set(declared["taxon_group"]) == {"plant", "animal"}
          print(manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdm-topk-untouched-cohort
          path: sdm_topk_cohort_predeclare
          if-no-files-found: error
          retention-days: 90
