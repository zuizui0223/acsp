name: Record fresh confirmation CLI hardening

on:
  push:
    branches:
      - agent/practical-coverage-v3-development
    paths:
      - .github/workflows/ai-changelog-fresh-cli-fix.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/practical-coverage-v3-development
          fetch-depth: 0
      - name: Prepend AI changelog entry and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG_AI.md")
          text = path.read_text(encoding="utf-8")
          marker = "# AI Change Log\n\n"
          if not text.startswith(marker):
              raise SystemExit("unexpected CHANGELOG_AI.md header")
          heading = "## 2026-08-12 - GPT-5.6 Sol (OpenAI) - Fresh confirmation CLI wiring hardening"
          if heading not in text:
              lines = [
                  heading,
                  "",
                  "Changed files:",
                  "- `aggregate_practical_rescue_fresh_confirmation.py`",
                  "- `predeclare_practical_rescue_fresh_confirmation_cohort.py`",
                  "- `test_practical_rescue_fresh_confirmation.py`",
                  "- `test_practical_rescue_fresh_protocol.py`",
                  "",
                  "Summary:",
                  "- Fixed two downstream CLI-to-function bindings before expensive fresh confirmation execution: `--protocol` now maps to the existing `protocol_path` argument in both fresh cohort predeclaration and fresh confirmation aggregation.",
                  "- Added regression tests for both bindings so the failure mode cannot recur after 192-pair execution.",
                  "- No cohort design, model, GRTS settings, inference threshold, taxon exclusions, seed, or promotion criterion changed.",
                  "",
                  "",
              ]
              path.write_text(marker + "\n".join(lines) + text[len(marker):], encoding="utf-8")
          PY
          git rm .github/workflows/ai-changelog-fresh-cli-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG_AI.md
          git commit -m "Record fresh confirmation CLI hardening"
          git push origin HEAD:agent/practical-coverage-v3-development
