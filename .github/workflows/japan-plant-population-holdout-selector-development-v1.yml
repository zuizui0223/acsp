name: Japan plant population-holdout selector development v1

on:
  push:
    paths:
      - "validation/activate_japan_plant_population_holdout_selector_development_v1.marker"
  workflow_dispatch:

concurrency:
  group: japan-plant-population-holdout-selector-development-v1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}
  COHORT_RUN_ID: "32335791948"
  COHORT_ARTIFACT: "acsp-robust-patch-untouched-confirmation-cohort-v2"

jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Test population-holdout mechanics
        run: python -m unittest -v tests/test_japan_plant_population_holdout_selector_v1.py
      - name: Download exact consumed 96-pair cohort
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COHORT_ARTIFACT }}
          path: frozen-cohort
          github-token: ${{ github.token }}
          repository: zuizui0223/acsp
          run-id: ${{ env.COHORT_RUN_ID }}
      - name: Verify exact frozen cohort bytes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('frozen-cohort')
          pairs = root / 'predeclared_taxon_region_pairs.csv'
          manifest = root / 'cohort_manifest.json'
          assert hashlib.sha256(pairs.read_bytes()).hexdigest() == '8e8eebf56b071572ad4eb84d6fe5dbe9ec12c4cd561e84dfca22abd398bede4d'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == '8fdc03b94d10e9448c2fe7515e5dbdaf4e5a26f1b6784d7a9bf947cea406f809'
          protocol = json.loads(Path('validation/japan_plant_population_holdout_selector_development_v1.json').read_text(encoding='utf-8'))
          assert protocol['cohort']['source_artifact_digest'] == 'sha256:cc0f949649491439f91e1b90d01d48acbd3f7fffc6833a75105a3bc175a5faf3'
          print('FROZEN_COHORT_BYTES_PASS')
          PY
      - name: Run whole-population selector holdout development
        run: |
          mkdir -p population-holdout-development
          python research/develop_japan_plant_population_holdout_selector_v1.py \
            --sample-file frozen-cohort/predeclared_taxon_region_pairs.csv \
            --out-dir population-holdout-development
      - name: Verify development boundary and public-safe outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('population-holdout-development/summary.json').read_text(encoding='utf-8'))
          assert summary['status'] == 'DEVELOPMENT_COMPLETE'
          assert summary['declared_plant_pairs'] == 48
          assert summary['independent_confirmation'] is False
          assert summary['heldout_used_for_generation_or_ranking'] is False
          assert summary['matched_k'] is True
          assert summary['radius_tuning_performed'] is False
          assert summary['selector_weight_tuning_performed'] is False
          assert summary['production_selector_changed'] is False
          for path in Path('population-holdout-development').glob('*'):
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8').lower()
              for token in ('latitude', 'longitude', 'gbif_key', 'occurrence_id'):
                  assert token not in text, (path, token)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan-plant-population-holdout-selector-development-v1
          path: population-holdout-development/
          if-no-files-found: error
          retention-days: 90
