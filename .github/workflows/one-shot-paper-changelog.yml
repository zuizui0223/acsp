name: One-shot paper-alignment changelog prepend

'on':
  push:
    branches:
      - paper/align-robust-candidate-patch-manuscript
    paths:
      - .github/workflows/one-shot-paper-changelog.yml

permissions:
  contents: write

jobs:
  prepend-changelog:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/align-robust-candidate-patch-manuscript
          fetch-depth: 0

      - name: Prepend changelog entry and remove one-shot staging files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG_AI.md")
          fragment = Path(".github/changelog-entry-paper-align.md")
          workflow = Path(".github/workflows/one-shot-paper-changelog.yml")
          header = "# AI Change Log\n\n"
          text = changelog.read_text(encoding="utf-8")
          entry = fragment.read_text(encoding="utf-8").strip()
          if not text.startswith(header):
              raise SystemExit("Unexpected CHANGELOG_AI.md header")
          if entry not in text:
              changelog.write_text(
                  header + entry + "\n\n" + text[len(header):],
                  encoding="utf-8",
              )
          fragment.unlink()
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Document robust-patch manuscript alignment"
          git push origin HEAD:paper/align-robust-candidate-patch-manuscript
