name: Country-framed v2 replication RU recovery assembly-only continuation

on:
  push:
    branches: [main]
    paths:
      - validation/activate_country_framed_integration_development_v2_replication_ru_recovery_assembly_continuation.marker

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  assembly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      recover_pairs: ${{ steps.source.outputs.recover_pairs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Verify one-shot assembly-only continuation marker
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          assert os.environ['GITHUB_RUN_NUMBER'] == '1', 'fresh second assembly continuation activation is forbidden'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          marker=Path('validation/activate_country_framed_integration_development_v2_replication_ru_recovery_assembly_continuation.marker')
          assert marker.is_file()
          values={}
          for line in marker.read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  k,v=line.split('=',1); values[k.strip()]=v.strip()
          assert values['source_replication_run_id']=='32811169261'
          assert values['source_recovery_run_id']=='32851181814'
          assert values['source_recovery_input_artifact_id']=='9564336761'
          assert values['source_recovery_input_artifact_digest']=='sha256:f35944d7e99c0b6f1d221caac4a79076d7d4e3aa21e7a8833289b39572866114'
          assert values['source_continuation_run_id']=='32858219634'
          assert values['source_continuation_head_sha']=='f99d44672fd04d5b005a4b2c8218d1e2b52a658e'
          assert values['recovery_execution_fingerprint']=='694e838b02717a20429070e291d7226c1b7c2c575d736020895f2676c1cbb504'
          assert values['assembly_layout_fix_only']=='true'
          assert values['world_recomputed']=='false'
          assert values['scientific_method_changed']=='false'
          assert values['outcome_driven_tuning']=='false'
          assert values['cohort_refrozen']=='false'
          PY
      - name: Verify exact source continuation and artifact set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, requests
          repo=os.environ['GH_REPOSITORY']
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}", 'Accept':'application/vnd.github+json'}
          run=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/32858219634',headers=headers,timeout=60)
          run.raise_for_status(); run=run.json()
          assert run['status']=='completed' and run['conclusion']=='failure', run
          assert run['run_number']==1, run
          assert run['head_sha']=='f99d44672fd04d5b005a4b2c8218d1e2b52a658e', run
          jobs=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/32858219634/jobs?per_page=100',headers=headers,timeout=60)
          jobs.raise_for_status(); jobs=jobs.json()['jobs']
          by_name={j['name']:j for j in jobs}
          assert by_name['continuation-contract']['conclusion']=='success'
          assert by_name['aggregate']['conclusion']=='skipped'
          for pair_id in (1,4,15,19):
              assert by_name[f'prepare-pair ({pair_id})']['conclusion']=='success'
              assert by_name[f'assemble-pair ({pair_id})']['conclusion']=='failure'
              for shard_id in range(8):
                  assert by_name[f'world-shard ({pair_id}, {shard_id})']['conclusion']=='success'
          arts=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/32858219634/artifacts?per_page=100',headers=headers,timeout=60)
          arts.raise_for_status(); arts=arts.json()['artifacts']
          expected={f'replication-ru-recovery-continuation-prep-{p}' for p in (1,4,15,19)}
          expected |= {f'replication-ru-recovery-continuation-world-{p}-{s}' for p in (1,4,15,19) for s in range(8)}
          names={a['name'] for a in arts}
          assert names==expected, sorted(names ^ expected)
          assert len(arts)==36 and all(not a['expired'] for a in arts)
          inp=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/32851181814/artifacts?name=replication-ru-recovery-inputs',headers=headers,timeout=60)
          inp.raise_for_status(); inp=inp.json()['artifacts']
          assert len(inp)==1
          assert inp[0]['id']==9564336761
          assert inp[0]['digest']=='sha256:f35944d7e99c0b6f1d221caac4a79076d7d4e3aa21e7a8833289b39572866114'
          assert not inp[0]['expired']
          PY
      - name: Re-verify source run and frozen RU timeout selection
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          import requests
          repo=os.environ['GH_REPOSITORY']
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}", 'Accept':'application/vnd.github+json'}
          jobs=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/32811169261/jobs?per_page=100',headers=headers,timeout=60)
          jobs.raise_for_status(); jobs=jobs.json()['jobs']
          by_name={j['name']:j for j in jobs}
          recover=[]
          for pair_id in (1,4,15,19):
              j=by_name[f'evaluate-pair ({pair_id})']
              started=datetime.fromisoformat(j['started_at'].replace('Z','+00:00'))
              completed=datetime.fromisoformat(j['completed_at'].replace('Z','+00:00'))
              runtime=(completed-started).total_seconds()/60.0
              if j['conclusion']=='success':
                  continue
              assert j['conclusion']=='cancelled' and runtime >= 299.0, (pair_id,j['conclusion'],runtime)
              recover.append(pair_id)
          assert recover==[1,4,15,19], recover
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('recover_pairs='+json.dumps(recover,separators=(',',':'))+'\n')
          PY

  assemble-pair:
    needs: assembly-contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pair-id: ${{ fromJSON(needs.assembly-contract.outputs.recover_pairs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f99d44672fd04d5b005a4b2c8218d1e2b52a658e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download exact verified recovery inputs
        uses: actions/download-artifact@v4
        with:
          name: replication-ru-recovery-inputs
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32851181814
      - name: Download exact prepared pair from source continuation
        uses: actions/download-artifact@v4
        with:
          name: replication-ru-recovery-continuation-prep-${{ matrix.pair-id }}
          path: pair-prep
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32858219634
      - name: Download exact computed world shards from source continuation
        uses: actions/download-artifact@v4
        with:
          pattern: replication-ru-recovery-continuation-world-${{ matrix.pair-id }}-*
          path: worlds-source
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32858219634
      - name: Restore only the directory names expected by the unchanged recovery assembler
        env:
          PAIR_ID: ${{ matrix.pair-id }}
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          pair_id=int(os.environ['PAIR_ID'])
          src_root=Path('worlds-source')
          dst_root=Path('worlds'); dst_root.mkdir()
          for shard_id in range(8):
              src=src_root/f'replication-ru-recovery-continuation-world-{pair_id}-{shard_id}'
              dst=dst_root/f'replication-ru-recovery-world-{pair_id}-{shard_id}'
              assert src.is_dir(), src
              assert (src/'world_manifest.json').is_file() and (src/'worlds.npz').is_file(), src
              shutil.copytree(src,dst)
          assert len(list(dst_root.glob(f'replication-ru-recovery-world-{pair_id}-*')))==8
          PY
      - name: Reassemble original LOO order and open heldout endpoint with unchanged frozen code
        run: >-
          python research/run_replication_ru_robust_world_recovery.py assemble-pair
          --declarations recovery-inputs/cohort/predeclared_taxon_country_pairs.csv
          --cohort-manifest recovery-inputs/cohort/cohort_manifest.json
          --surface recovery-inputs/surface/ru_complete_surface.parquet
          --surface-manifest recovery-inputs/surface/surface_manifest.json
          --pair-prep pair-prep
          --worlds-root worlds
          --pair-id ${{ matrix.pair-id }}
          --output recovered-pair
      - uses: actions/upload-artifact@v4
        with:
          name: replication-ru-recovery-assembly-continuation-pair-${{ matrix.pair-id }}
          path: recovered-pair/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [assembly-contract, assemble-pair]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f99d44672fd04d5b005a4b2c8218d1e2b52a658e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download all successful source pair artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: replication-pair-*
          path: combined-pairs
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32811169261
      - name: Download technically recovered RU pair artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: replication-ru-recovery-assembly-continuation-pair-*
          path: recovered-pairs
          merge-multiple: false
      - name: Overlay only the four frozen RU timeout pairs
        env:
          RECOVER_PAIRS: ${{ needs.assembly-contract.outputs.recover_pairs }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          recover=[int(x) for x in json.loads(os.environ['RECOVER_PAIRS'])]
          assert recover==[1,4,15,19], recover
          for pair_id in recover:
              src=Path('recovered-pairs')/f'replication-ru-recovery-assembly-continuation-pair-{pair_id}'
              dst=Path('combined-pairs')/f'replication-pair-{pair_id}'
              assert src.is_dir(), src
              if dst.exists(): shutil.rmtree(dst)
              shutil.copytree(src,dst)
          dirs=sorted(p for p in Path('combined-pairs').glob('replication-pair-*') if p.is_dir())
          assert len(dirs)==24, [p.name for p in dirs]
          PY
      - name: Aggregate once with the original frozen replication gates
        run: python research/aggregate_country_framed_integration_development_v2_replication.py --input-root combined-pairs --output replication-results
      - name: Attach technical recovery provenance only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('replication-results/replication_summary.json')
          s=json.loads(p.read_text())
          s.update({
            'replication_ru_recovery_execution_fingerprint':'694e838b02717a20429070e291d7226c1b7c2c575d736020895f2676c1cbb504',
            'replication_ru_recovery_source_run_id':32811169261,
            'replication_ru_recovery_source_failed_run_id':32851181814,
            'replication_ru_recovery_source_continuation_run_id':32858219634,
            'replication_ru_recovery_source_input_artifact_id':9564336761,
            'replication_ru_recovered_pair_ids':[1,4,15,19],
            'replication_ru_recovery_assembly_layout_fix_only':True,
            'replication_ru_recovery_world_recomputed':False,
            'replication_ru_recovery_scientific_method_changed':False,
            'replication_ru_recovery_cohort_refrozen':False,
            'replication_ru_recovery_outcome_driven_tuning':False,
          })
          p.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n')
          print('V2 REPLICATION PASS' if s['replication_gate_passed'] else 'V2 REPLICATION FAIL')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: country-framed-integration-development-v2-replication-results-ru-recovery
          path: replication-results/
          if-no-files-found: error
          retention-days: 90
