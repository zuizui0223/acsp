name: Geographic framing development v4

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/research

jobs:
  replay-frozen-v4:
    name: Manual replay of frozen v4 country registry
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACSP
        run: python -m pip install -e .

      - name: Verify frozen representation and durable identities
        run: |
          python -m unittest -v research/test_geographic_framing_country_registry_v4.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          protocol_path = Path('validation/acsp_geographic_framing_development_protocol_v4.json')
          protocol = json.loads(protocol_path.read_text(encoding='utf-8'))
          stored = protocol.pop('protocol_fingerprint')
          calculated = hashlib.sha256(
              json.dumps(protocol, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          expected_protocol = '3bd9e6145e17a99b52d8a9f82c07f346541f56a2bf81bd768e180de78c295bf8'
          assert stored == calculated == expected_protocol

          identity_path = Path('validation/geographic_framing_development_v4/predeclared_taxon_region_pairs.csv')
          identity_sha = hashlib.sha256(identity_path.read_bytes()).hexdigest()
          assert identity_sha == '04342b9c06f6bdf109ea4a684945acdbba8a7063cd11b29b563f80e701de485f'

          freeze = json.loads(Path('validation/acsp_geographic_framing_country_registry_freeze_v1.json').read_text(encoding='utf-8'))
          assert freeze['status'] == 'frozen_after_v4_development_pass_before_fresh_confirmation'
          assert freeze['decision']['representation_frozen'] is True
          assert freeze['decision']['retuning_on_v4_development_taxa_allowed'] is False
          assert freeze['authoritative_first_run']['workflow_run_id'] == 32615423653
          assert freeze['development_result']['promotion_gate_passed'] is True
          PY

      - name: Replay frozen v4 development identities against live GBIF
        run: |
          python research/evaluate_geographic_framing_development_v4.py \
            --sample-file validation/geographic_framing_development_v4/predeclared_taxon_region_pairs.csv \
            --output geographic-framing-v4-replay

      - name: Keep authoritative first-run decision immutable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          authoritative = json.loads(
              Path('validation/geographic_framing_development_v4/country_registry_v4_summary.json').read_text(encoding='utf-8')
          )
          replay = json.loads(
              Path('geographic-framing-v4-replay/country_registry_v4_summary.json').read_text(encoding='utf-8')
          )
          assert authoritative['protocol_fingerprint'] == replay['protocol_fingerprint']
          assert authoritative['taxa_in_yield_denominator'] == replay['taxa_in_yield_denominator'] == 96
          print('AUTHORITATIVE FIRST RUN (immutable):')
          print(json.dumps(authoritative, indent=2, ensure_ascii=False))
          print('LIVE REPLAY (diagnostic only; does not revise the freeze):')
          print(json.dumps(replay, indent=2, ensure_ascii=False))
          PY

      - name: Upload replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsp-geographic-framing-development-v4-replay
          path: geographic-framing-v4-replay/
          if-no-files-found: error
          retention-days: 30
